  <div class="box">

    <div class="s">Este juego se juega en horizontal</div>
    <button id="fsBtn">PANTALLA COMPLETA</button>
  </div>
</div>
<script>
(function(){
'use strict';

(function injectStyles(){
  var css = document.createElement('style');
  css.textContent = [
    '*{margin:0;padding:0;box-sizing:border-box;}',
    'html,body{width:100%;height:100%;overflow:hidden;background:#0d0f12;',
      'touch-action:none;overscroll-behavior:none;',
      '-webkit-user-select:none;user-select:none;',
      '-webkit-tap-highlight-color:transparent;',
      'font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}',
    'canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;',
      'background:#0d0f12;touch-action:none;}',
    '#err{display:none;position:fixed;left:8px;right:8px;top:8px;z-index:99;',
      'background:#b71c1c;color:#fff;font:12px/1.45 ui-monospace,monospace;',
      'padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:60vh;overflow:auto;}',
    '#rotate{display:none;position:fixed;inset:0;z-index:200;background:#0d0f12;',
      'color:#fff;align-items:center;justify-content:center;text-align:center;padding:20px;}',
    '#rotate.on{display:flex;}',
    '#rotate .icon{font-size:64px;line-height:1;margin-bottom:14px;animation:rot 1.6s ease-in-out infinite;}',
    '@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}',
    '#rotate .t{font-size:28px;font-weight:800;letter-spacing:1px;margin-bottom:6px;}',
    '#rotate .s{font-size:14px;color:#8b949e;margin-bottom:24px;}',
    '#fsBtn{background:#4a90d9;color:#fff;border:0;border-radius:999px;',
      'padding:14px 26px;font-size:16px;font-weight:700;letter-spacing:1px;',
      'font-family:inherit;cursor:pointer;-webkit-appearance:none;}',
    '#fsBtn:active{transform:scale(0.96);}'
  ].join('');
  document.head.appendChild(css);
})();

var errBox = document.getElementById('err');
function showErr(msg){
  errBox.style.display = 'block';
  errBox.textContent = 'ERROR: ' + msg;
}
window.addEventListener('error', function(e){
  showErr((e.message || 'desconocido') + (e.lineno ? '  (línea ' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e){ showErr(String(e.reason)); });

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d', { alpha:false });
var W = 0, H = 0, DPR = 1, vignette = null;

function measureViewport(){
  var w = 0, h = 0;
  if (window.visualViewport && window.visualViewport.width && window.visualViewport.height){
    w = window.visualViewport.width; h = window.visualViewport.height;
  }
  if (!w || !h){
    w = window.innerWidth  || document.documentElement.clientWidth  || (document.body && document.body.clientWidth)  || 0;
    h = window.innerHeight || document.documentElement.clientHeight || (document.body && document.body.clientHeight) || 0;
  }
  if (!w || !h){ w = window.outerWidth || 480; h = window.outerHeight || 320; }
  return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
}

function resize(){
  var vp = measureViewport();
  if (vp.w === W && vp.h === H && canvas.width){ updateRotateUI(); return; }
  W = vp.w; H = vp.h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = ctx.createRadialGradient(
    W/2, H/2, Math.min(W,H) * 0.30, W/2, H/2, Math.max(W,H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.72)');
  layoutUI();
  updateRotateUI();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 60); setTimeout(resize, 260); });
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
if (window.ResizeObserver){
  try { new ResizeObserver(resize).observe(document.documentElement); } catch(e){}
  try { new ResizeObserver(resize).observe(document.body); } catch(e){}
}
setInterval(function(){
  var vp = measureViewport();
  if (vp.w !== W || vp.h !== H) resize();
}, 400);

var rotateEl = document.getElementById('rotate');
var fsBtn = document.getElementById('fsBtn');
function isPortrait(){ return H > W * 1.05; }
function updateRotateUI(){
  if (isPortrait() && W > 0 && H > 0) rotateEl.classList.add('on');
  else rotateEl.classList.remove('on');
}
function lockLandscape(){
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  var p = fs ? fs.call(el) : null;
  function tryLock(){
    if (screen.orientation && screen.orientation.lock){
      var r = screen.orientation.lock('landscape');
      if (r && r.catch) r.catch(function(){});
    }
    setTimeout(resize, 200); setTimeout(resize, 600);
  }
  if (p && p.then) p.then(tryLock).catch(function(){ tryLock(); });
  else tryLock();
}
fsBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); lockLandscape(); });

/* ============ UTILIDADES ============ */
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function rand(a,b){ return a + Math.random() * (b - a); }
function angleDiff(a,b){
  var d = a - b;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function fmt(n){
  var s = String(Math.floor(n)), out = '';
  while (s.length > 3){ out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}
function rr(x,y,w,h,r){
  r = Math.max(0, Math.min(r, Math.min(Math.abs(w), Math.abs(h)) / 2));
  if (w < 0){ x += w; w = -w; }
  if (h < 0){ y += h; h = -h; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function hexByte(v){ v = Math.max(0, Math.min(255, Math.round(v))); var s = v.toString(16); return s.length < 2 ? '0' + s : s; }
function darken(hex, amount){
  if (!hex || hex.length < 7) return '#222222';
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  r *= (1 - amount); g *= (1 - amount); b *= (1 - amount);
  return '#' + hexByte(r) + hexByte(g) + hexByte(b);
}
function lighten(hex, amount){
  if (!hex || hex.length < 7) return '#ffffff';
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  r += (255 - r) * amount; g += (255 - g) * amount; b += (255 - b) * amount;
  return '#' + hexByte(r) + hexByte(g) + hexByte(b);
}

/* ============ GUARDADO ============ */
var SAVE_KEY = 'zombies_save_v1';
var SAVE = {
  coins: 0,
  up: { speed: 0, reload: 0, mag: 0, fire: 0 },
  skin: { body: '#4a90d9', hat: 0 }
};

function loadSave(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d) return;
    SAVE.coins = Math.max(0, d.coins | 0);
    if (d.up){
      SAVE.up.speed  = Math.max(0, d.up.speed  | 0);
      SAVE.up.reload = Math.max(0, d.up.reload | 0);
      SAVE.up.mag    = Math.max(0, d.up.mag    | 0);
      SAVE.up.fire   = Math.max(0, d.up.fire   | 0);
    }
    if (d.skin){
      if (typeof d.skin.body === 'string' && /^#[0-9a-fA-F]{6}$/.test(d.skin.body))
        SAVE.skin.body = d.skin.body;
      SAVE.skin.hat = Math.max(0, Math.min(4, d.skin.hat | 0));
    }
  } catch(e){}
}
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch(e){}
}
loadSave();

/* ============ SKIN ============ */
var SKIN_COLORS = [
  '#4a90d9', '#e53935', '#43a047', '#fbc02d', '#8e24aa',
  '#00acc1', '#fb8c00', '#ec407a', '#8bc34a', '#546e7a'
];
var HAT_COUNT = 5;

/* ============ MEJORAS ============ */
var UPGRADES = [
  { key:'speed',  name:'VELOCIDAD', max:6, base:8,  step:8  },
  { key:'reload', name:'RECARGA',   max:8, base:10, step:10 },
  { key:'mag',    name:'CAPACIDAD', max:6, base:12, step:12 },
  { key:'fire',   name:'CADENCIA',  max:8, base:14, step:14 }
];

function upgradeCost(u){ return u.base + u.step * SAVE.up[u.key]; }
function isMaxed(u){ return SAVE.up[u.key] >= u.max; }

function buyUpgrade(key){
  for (var i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i];
    if (u.key !== key) continue;
    if (isMaxed(u)) return false;
    var c = upgradeCost(u);
    if (SAVE.coins < c) return false;
    SAVE.coins -= c;
    SAVE.up[key]++;
    saveGame();
    if (G){ G.buyFlash = 0.35; G.buyKey = key; }
    return true;
  }
  return false;
}

function applyUpgrades(){
  var u = SAVE.up;
  return {
    speed:      262 + u.speed * 15,
    reloadTime: Math.max(0.55, 1.90 - u.reload * 0.14),
    magSize:    15 + u.mag * 3,
    fireRate:   Math.max(0.055, 0.170 - u.fire * 0.012)
  };
}

/* ============ CONSTANTES ============ */
var WORLD = { w: 2200, h: 2200 };
var STICK_MAX = 62;
var STICK_DEAD = 0.22;

var ZDEF = {
  walker: { r:15, hp:36,  speed:70,  dmg:9,  score:10, color:'#5b8c3e', dark:'#2f4a20' },
  runner: { r:12, hp:22,  speed:140, dmg:7,  score:15, color:'#9ec24a', dark:'#55702a' },
  brute:  { r:27, hp:160, speed:50,  dmg:22, score:40, color:'#8a3b3b', dark:'#4a1f1f' }
};

/* ============ BOTONES ============ */
var buttons = [
  { id:'dash',   x:0, y:0, r:34, label:'\u26A1', cd:0, max:1, press:0 },
  { id:'reload', x:0, y:0, r:34, label:'\u27F3', cd:0, max:1, press:0 }
];
var GEAR = { x:0, y:0, r:16 };

function layoutUI(){
  var pad = buttons[0].r + 16;
  buttons[0].x = pad;     buttons[0].y = H - pad;
  buttons[1].x = W - pad; buttons[1].y = H - pad;

  var small = Math.min(W, H) < 420;
  var padTop = small ? 14 : 22;
  var hpBw = Math.min(small ? 150 : 260, W * 0.42);
  var hpBh = small ? 16 : 20;
  GEAR.r = small ? 15 : 17;
  GEAR.x = padTop + hpBw + 22;
  GEAR.y = padTop + hpBh / 2;
}

/* ============ ENTRADA ============ */
var keys = {};
var mouse = { x:0, y:0, down:false, active:false };
var sticks = { move:null, aim:null };
var landscapeAsked = false;
var uiRects = [];

function makeStick(id, x, y){
  return { id:id, ox:x, oy:y, x:x, y:y, dx:0, dy:0, mag:0, nx:0, ny:0 };
}
function updateStick(s){
  var dx = s.x - s.ox, dy = s.y - s.oy;
  var d = Math.sqrt(dx*dx + dy*dy);
  if (d > STICK_MAX){
    var k = (d - STICK_MAX) / d;
    s.ox += dx * k; s.oy += dy * k;
    dx = s.x - s.ox; dy = s.y - s.oy;
    d = STICK_MAX;
  }
  s.dx = dx; s.dy = dy;
  s.mag = Math.min(1, d / STICK_MAX);
  s.nx = dx / STICK_MAX; s.ny = dy / STICK_MAX;
}

function handleUITap(x, y){
  for (var i = 0; i < uiRects.length; i++){
    var r = uiRects[i];
    if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) continue;

    var k = r.key;
    if (k === 'restart'){ reset(); return true; }
    if (k === 'customize'){ enterCustomize(); return true; }
    if (k === 'back'){ exitCustomize(); return true; }
    if (k.indexOf('color:') === 0){
      SAVE.skin.body = k.slice(6);
      saveGame();
      return true;
    }
    if (k.indexOf('hat:') === 0){
      SAVE.skin.hat = parseInt(k.slice(4), 10) || 0;
      saveGame();
      return true;
    }
    buyUpgrade(k);
    return true;
  }
  return false;
}

function onPointerDown(id, x, y){
  /* botón engranaje (personalizar en partida) */
  if (G && G.state === 'playing' &&
      Math.hypot(x - GEAR.x, y - GEAR.y) < GEAR.r * 1.6){
    enterCustomize();
    return true;
  }
  for (var i = 0; i < buttons.length; i++){
    var b = buttons[i];
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.45){
      b.press = 0.2;
      if (b.id === 'dash')   tryDash();
      if (b.id === 'reload') tryReload();
      return true;
    }
  }
  if (x < W * 0.5){
    if (!sticks.move) sticks.move = makeStick(id, x, y);
  } else {
    if (!sticks.aim) sticks.aim = makeStick(id, x, y);
  }
  return false;
}
function onPointerMove(id, x, y){
  if (sticks.move && sticks.move.id === id){ sticks.move.x = x; sticks.move.y = y; updateStick(sticks.move); }
  if (sticks.aim  && sticks.aim.id  === id){ sticks.aim.x  = x; sticks.aim.y  = y; updateStick(sticks.aim);  }
}
function onPointerUp(id){
  if (sticks.move && sticks.move.id === id) sticks.move = null;
  if (sticks.aim  && sticks.aim.id  === id) sticks.aim  = null;
}

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  if (!landscapeAsked){
    landscapeAsked = true;
    if (isPortrait()) lockLandscape();
  }
  if (G && (G.state === 'dead' || G.state === 'customize')){
    if (G.state === 'customize' || G.deadT > 0.7){
      for (var i = 0; i < e.changedTouches.length; i++){
        var t = e.changedTouches[i];
        handleUITap(t.clientX, t.clientY);
      }
    }
    return;
  }
  for (var j = 0; j < e.changedTouches.length; j++){
    var tt = e.changedTouches[j];
    onPointerDown(tt.identifier, tt.clientX, tt.clientY);
  }
}, { passive:false });

canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    onPointerMove(t.identifier, t.clientX, t.clientY);
  }
}, { passive:false });

function endTouches(e){
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++){
    onPointerUp(e.changedTouches[i].identifier);
  }
}
canvas.addEventListener('touchend', endTouches, { passive:false });
canvas.addEventListener('touchcancel', endTouches, { passive:false });

window.addEventListener('mousemove', function(e){
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
window.addEventListener('mousedown', function(e){
  if (e.button !== 0) return;
  if (G && (G.state === 'dead' || G.state === 'customize')){
    if (G.state === 'customize' || G.deadT > 0.7) handleUITap(e.clientX, e.clientY);
    return;
  }
  mouse.down = true; mouse.active = true;
});
window.addEventListener('mouseup', function(e){ if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
window.addEventListener('keydown', function(e){
  keys[e.code] = true;
  if (e.code === 'Space'){ e.preventDefault(); tryDash(); }
  if (e.code === 'KeyR') tryReload();
  if (e.code === 'KeyC' && G && G.state === 'playing') enterCustomize();
  if (e.code === 'Escape' && G && G.state === 'customize') exitCustomize();
  if (e.code === 'Enter' && G && G.state === 'dead' && G.deadT > 0.7) reset();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });

/* ============ ESTADO ============ */
var G = null;

function reset(){
  var U = applyUpgrades();
  G = {
    player: {
      x: WORLD.w/2, y: WORLD.h/2, r: 15,
      speed: U.speed,
      hp: 100, maxHp: 100,
      aim: -Math.PI/2,
      hurtFlash: 0, invuln: 0, healFlash: 0,
      magSize: U.magSize, mag: U.magSize,
      reloading: false, reloadT: 0, reloadTime: U.reloadTime,
      fireCd: 0, fireRate: U.fireRate,
      dashCd: 0, dashT: 0, dashDX: 0, dashDY: 1
    },
    zombies: [], bullets: [], particles: [], floaters: [], decals: [], pickups: [],
    score: 0, kills: 0, runCoins: 0,
    wave: 0, waveTimer: 2.0, spawnQueue: 0, spawnCd: 0,
    state: 'playing', shake: 0, waveMsg: 0, hintT: 7, deadT: 0, time: 0,
    buyFlash: 0, buyKey: '',
    customizeReturn: 'dead',
    cam: { x: 0, y: 0 }
  };
  sticks.move = null;
  sticks.aim = null;
  uiRects = [];
  updateCamera();
  layoutUI();
}

function enterCustomize(){
  if (!G) return;
  G.customizeReturn = G.state;
  G.state = 'customize';
  uiRects = [];
  sticks.move = null;
  sticks.aim = null;
  mouse.down = false;
}
function exitCustomize(){
  if (!G) return;
  G.state = G.customizeReturn || 'dead';
  uiRects = [];
}

function updateCamera(){
  var p = G.player, cx, cy;
  if (WORLD.w <= W) cx = (WORLD.w - W) / 2; else cx = clamp(p.x - W/2, 0, WORLD.w - W);
  if (WORLD.h <= H) cy = (WORLD.h - H) / 2; else cy = clamp(p.y - H/2, 0, WORLD.h - H);
  G.cam.x = cx; G.cam.y = cy;
}

/* ============ PARTÍCULAS ============ */
function spawnParticle(x, y, color, size, life, vx, vy, drag){
  if (G.particles.length > 460) return;
  G.particles.push({ x:x, y:y, vx:vx || 0, vy:vy || 0, color:color, size:size,
                     life:life, max:life, drag:(drag === undefined ? 0.15 : drag) });
}
function bloodBurst(x, y, amount, power){
  for (var i = 0; i < amount; i++){
    var a = Math.random() * Math.PI * 2;
    var s = rand(50, power);
    spawnParticle(x, y, Math.random() < 0.75 ? '#b71c1c' : '#7f1010',
                  rand(1.5, 4), rand(0.35, 0.8), Math.cos(a)*s, Math.sin(a)*s);
  }
}
function addFloater(x, y, text, color, size){
  G.floaters.push({ x:x, y:y, vy:-58, life:0.8, max:0.8, text:text, color:color, size:size || 15 });
}
function stepParticles(dt){
  for (var i = G.particles.length - 1; i >= 0; i--){
    var q = G.particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    var k = Math.pow(q.drag, dt);
    q.vx *= k; q.vy *= k;
    q.life -= dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
}
function stepFloaters(dt){
  for (var i = G.floaters.length - 1; i >= 0; i--){
    var f = G.floaters[i];
    f.y += f.vy * dt;
    f.vy *= Math.pow(0.05, dt);
    f.life -= dt;
    if (f.life <= 0) G.floaters.splice(i, 1);
  }
}

/* ============ ACCIONES ============ */
function tryReload(){
  if (!G || G.state !== 'playing') return;
  var p = G.player;
  if (p.reloading || p.mag === p.magSize) return;
  p.reloading = true;
  p.reloadT = p.reloadTime;
}

function tryDash(){
  if (!G || G.state !== 'playing') return;
  var p = G.player;
  if (p.dashCd > 0 || p.dashT > 0) return;

  var dx = 0, dy = 0;
  if (sticks.move && sticks.move.mag > 0.15){
    dx = sticks.move.nx; dy = sticks.move.ny;
  } else {
    if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (keys['KeyW'] || keys['ArrowUp'])    dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  dy += 1;
  }
  if (!dx && !dy){ dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
  var l = Math.hypot(dx, dy) || 1;
  p.dashDX = dx / l; p.dashDY = dy / l;
  p.dashT = 0.16; p.dashCd = 1.05;
  p.invuln = Math.max(p.invuln, 0.28);

  for (var i = 0; i < 14; i++){
    var a = Math.random() * Math.PI * 2;
    spawnParticle(p.x, p.y, 'rgba(120,190,255,0.75)', rand(2,4), rand(0.2,0.45),
                  Math.cos(a)*130, Math.sin(a)*130);
  }
}

function shoot(){
  var p = G.player;
  p.fireCd = p.fireRate;
  p.mag--;

  var ang = p.aim;
  var best = null, bestDiff = 0.26;
  for (var i = 0; i < G.zombies.length; i++){
    var z = G.zombies[i];
    if (z.dead) continue;
    var zdx = z.x - p.x, zdy = z.y - p.y;
    if (zdx*zdx + zdy*zdy > 780 * 780) continue;
    var d = Math.abs(angleDiff(Math.atan2(zdy, zdx), p.aim));
    if (d < bestDiff){ bestDiff = d; best = z; }
  }
  if (best) ang = Math.atan2(best.y - p.y, best.x - p.x);

  var a = ang + rand(-0.03, 0.03);
  var spd = 1150;
  G.bullets.push({
    x: p.x + Math.cos(ang) * 22, y: p.y + Math.sin(ang) * 22,
    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
    dmg: 14, life: 0.9, r: 3
  });

  for (var k = 0; k < 5; k++){
    var fa = ang + rand(-0.5, 0.5);
    spawnParticle(p.x + Math.cos(ang)*24, p.y + Math.sin(ang)*24,
                  Math.random() < 0.5 ? '#ffd54f' : '#fff3c4',
                  rand(2,5), rand(0.06,0.15),
                  Math.cos(fa)*rand(80,300), Math.sin(fa)*rand(80,300));
  }
  G.shake = Math.min(G.shake + 2.2, 12);
}

/* ============ DAÑO ============ */
function damageZombie(z, dmg, vx, vy){
  if (z.dead) return;
  z.hp -= dmg;
  z.hitFlash = 0.1;
  z.kx += vx * 0.02; z.ky += vy * 0.02;
  bloodBurst(z.x, z.y, 5, 200);
  addFloater(z.x + rand(-8,8), z.y - z.r - 8, String(Math.round(dmg)), '#ffd54f');
  if (z.hp <= 0) killZombie(z);
}

function killZombie(z){
  z.dead = true;
  G.score += z.score;
  G.kills++;
  G.runCoins++;
  SAVE.coins++;
  G.shake = Math.min(G.shake + 3, 14);
  bloodBurst(z.x, z.y, 16, 340);
  for (var i = 0; i < 10; i++){
    var a = Math.random() * Math.PI * 2;
    spawnParticle(z.x, z.y, z.dark, rand(3,6), rand(0.4,0.9),
                  Math.cos(a)*rand(30,140), Math.sin(a)*rand(30,140));
  }
  if (G.decals.length > 150) G.decals.shift();
  G.decals.push({ x: z.x + rand(-6,6), y: z.y + rand(-6,6), r: z.r * rand(0.9,1.5), a: rand(0.18,0.34) });

  if (Math.random() < 0.12 && G.pickups.length < 12){
    G.pickups.push({ x:z.x, y:z.y, r:13, phase:Math.random()*10, life:18, born:0 });
    for (var j = 0; j < 8; j++){
      var aa = Math.random() * Math.PI * 2;
      spawnParticle(z.x, z.y, '#ff6b81', rand(2,4), rand(0.3,0.6),
                    Math.cos(aa)*rand(40,140), Math.sin(aa)*rand(40,140));
    }
  }
  if (G.kills % 10 === 0) saveGame();
}

function hurtPlayer(dmg){
  var p = G.player;
  if (p.invuln > 0) return;
  p.hp -= dmg;
  p.hurtFlash = 0.3;
  p.invuln = 0.45;
  G.shake = Math.min(G.shake + 9, 22);
  bloodBurst(p.x, p.y, 8, 220);
  if (p.hp <= 0){ p.hp = 0; die(); }
}

function die(){
  G.state = 'dead';
  G.deadT = 0;
  G.shake = 28;
  sticks.move = null; sticks.aim = null;
  saveGame();
  var p = G.player;
  for (var i = 0; i < 70; i++){
    var a = Math.random() * Math.PI * 2, s = rand(50, 380);
    spawnParticle(p.x, p.y, i % 3 ? '#c62828' : SAVE.skin.body,
                  rand(2,6), rand(0.6,1.5), Math.cos(a)*s, Math.sin(a)*s);
  }
}

/* ============ OLEADAS ============ */
function startWave(){
  G.wave++;
  G.spawnQueue = 4 + Math.floor(G.wave * 1.9);
  G.spawnCd = 0.25;
  G.waveTimer = 3.5;
  G.waveMsg = 2.0;
}

function spawnZombie(){
  var p = G.player, w = G.wave;
  var type = 'walker';
  var roll = Math.random();
  var bruteChance  = w >= 4 ? Math.min(0.18, 0.035 * (w - 3)) : 0;
  var runnerChance = Math.min(0.45, 0.08 + w * 0.045);
  if (roll < bruteChance) type = 'brute';
  else if (roll < bruteChance + runnerChance) type = 'runner';

  var def = ZDEF[type];
  var x = 0, y = 0;
  for (var i = 0; i < 26; i++){
    var a = Math.random() * Math.PI * 2;
    var d = Math.max(W, H) * 0.62 + Math.random() * 240;
    x = p.x + Math.cos(a) * d;
    y = p.y + Math.sin(a) * d;
    if (x > 60 && x < WORLD.w - 60 && y > 60 && y < WORLD.h - 60) break;
  }
  x = clamp(x, 60, WORLD.w - 60);
  y = clamp(y, 60, WORLD.h - 60);

  var hpMul = 1 + (w - 1) * 0.09;
  G.zombies.push({
    x: x, y: y, type: type, r: def.r,
    hp: def.hp * hpMul, maxHp: def.hp * hpMul,
    speed: def.speed * (1 + Math.min(0.35, (w - 1) * 0.02)),
    dmg: def.dmg,
    atkRate: type === 'runner' ? 0.7 : 0.9,
    atkCd: 0.6,
    color: def.color, dark: def.dark,
    hitFlash: 0, kx: 0, ky: 0, dead: false,
    phase: Math.random() * 10, score: def.score
  });
}

/* ============ UPDATE ============ */
function update(dt){
  if (!G) return;

  if (G.state === 'dead' || G.state === 'customize'){
    if (G.state === 'dead'){
      G.time += dt;
      G.deadT += dt;
      G.shake = Math.max(0, G.shake - dt * 45);
      for (var bi = 0; bi < buttons.length; bi++){
        if (buttons[bi].press > 0) buttons[bi].press -= dt;
      }
      stepParticles(dt);
      stepFloaters(dt);
    }
    return;
  }

  G.time += dt;

  for (var bj = 0; bj < buttons.length; bj++){
    if (buttons[bj].press > 0) buttons[bj].press -= dt;
  }
  if (G.buyFlash > 0) G.buyFlash -= dt;

  var p = G.player;
  var i;

  /* movimiento */
  var ix = 0, iy = 0;
  if (sticks.move && sticks.move.mag > 0.12){
    ix = sticks.move.nx; iy = sticks.move.ny;
  } else {
    if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if (keys['KeyW'] || keys['ArrowUp'])    iy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  iy += 1;
    var l = Math.hypot(ix, iy);
    if (l > 1){ ix /= l; iy /= l; }
  }

  p.dashCd = Math.max(0, p.dashCd - dt);
  if (p.dashT > 0){
    p.dashT -= dt;
    p.x += p.dashDX * 920 * dt;
    p.y += p.dashDY * 920 * dt;
    if (Math.random() < 0.85)
      spawnParticle(p.x, p.y, 'rgba(120,190,255,0.5)', rand(2,5), 0.3, rand(-30,30), rand(-30,30));
  } else {
    p.x += ix * p.speed * dt;
    p.y += iy * p.speed * dt;
  }
  p.x = clamp(p.x, p.r, WORLD.w - p.r);
  p.y = clamp(p.y, p.r, WORLD.h - p.r);

  updateCamera();

  /* apuntado */
  var firing = false;
  if (sticks.aim && sticks.aim.mag > STICK_DEAD){
    p.aim = Math.atan2(sticks.aim.ny, sticks.aim.nx);
    firing = true;
  } else if (mouse.active){
    p.aim = Math.atan2((mouse.y + G.cam.y) - p.y, (mouse.x + G.cam.x) - p.x);
    firing = mouse.down;
  }

  p.fireCd -= dt;
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.healFlash = Math.max(0, p.healFlash - dt);

  if (p.reloading){
    p.reloadT -= dt;
    if (p.reloadT <= 0){ p.reloading = false; p.mag = p.magSize; }
  }
  if (firing && p.fireCd <= 0 && !p.reloading){
    if (p.mag > 0) shoot();
    else tryReload();
  }

  /* balas */
  for (i = G.bullets.length - 1; i >= 0; i--){
    var bl = G.bullets[i];
    bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
    if (bl.life <= 0 || bl.x < 0 || bl.x > WORLD.w || bl.y < 0 || bl.y > WORLD.h){
      G.bullets.splice(i, 1); continue;
    }
    var hit = false;
    for (var j = 0; j < G.zombies.length; j++){
      var zz = G.zombies[j];
      var dx = zz.x - bl.x, dy = zz.y - bl.y, rr2 = zz.r + bl.r;
      if (dx*dx + dy*dy < rr2*rr2){
        damageZombie(zz, bl.dmg, bl.vx, bl.vy); hit = true; break;
      }
    }
    if (hit){
      for (var k = 0; k < 4; k++){
        var a2 = Math.atan2(-bl.vy, -bl.vx) + rand(-0.9, 0.9);
        spawnParticle(bl.x, bl.y, '#e53935', rand(1.5,3), rand(0.15,0.35),
                      Math.cos(a2)*rand(60,220), Math.sin(a2)*rand(60,220));
      }
      G.bullets.splice(i, 1);
    }
  }

  /* zombies */
  for (i = 0; i < G.zombies.length; i++){
    var z = G.zombies[i];
    z.hitFlash = Math.max(0, z.hitFlash - dt);
    z.atkCd -= dt;
    z.phase += dt;
    z.x += z.kx * dt; z.y += z.ky * dt;
    var kd = Math.pow(0.00005, dt);
    z.kx *= kd; z.ky *= kd;

    var ddx = p.x - z.x, ddy = p.y - z.y;
    var dist = Math.hypot(ddx, ddy) || 1;
    var touch = z.r + p.r;
    if (dist > touch){
      z.x += (ddx / dist) * z.speed * dt;
      z.y += (ddy / dist) * z.speed * dt;
    } else if (z.atkCd <= 0 && p.dashT <= 0){
      z.atkCd = z.atkRate;
      hurtPlayer(z.dmg);
    }
    z.x = clamp(z.x, z.r, WORLD.w - z.r);
    z.y = clamp(z.y, z.r, WORLD.h - z.r);
  }

  for (i = 0; i < G.zombies.length; i++){
    for (var m = i + 1; m < G.zombies.length; m++){
      var za = G.zombies[i], zb = G.zombies[m];
      var sx = zb.x - za.x, sy = zb.y - za.y;
      var d2 = sx*sx + sy*sy;
      var minD = za.r + zb.r;
      if (d2 < minD * minD && d2 > 0.01){
        var dd = Math.sqrt(d2);
        var push = (minD - dd) * 0.5;
        sx /= dd; sy /= dd;
        za.x -= sx * push; za.y -= sy * push;
        zb.x += sx * push; zb.y += sy * push;
      }
    }
  }
  for (i = G.zombies.length - 1; i >= 0; i--){
    if (G.zombies[i].dead) G.zombies.splice(i, 1);
  }

  /* corazones */
  for (i = G.pickups.length - 1; i >= 0; i--){
    var pk = G.pickups[i];
    pk.phase += dt;
    pk.life -= dt;
    pk.born = Math.min(1, pk.born + dt * 3);

    var pdx = p.x - pk.x, pdy = p.y - pk.y;
    var pd2 = pdx*pdx + pdy*pdy;

    if (pd2 < 110 * 110 && pd2 > 1){
      var pd = Math.sqrt(pd2);
      var pull = (1 - pd/110) * 260;
      pk.x += (pdx/pd) * pull * dt;
      pk.y += (pdy/pd) * pull * dt;
    }

    var touchR = p.r + pk.r;
    if (pd2 < touchR * touchR){
      var healed = Math.min(10, p.maxHp - p.hp);
      if (healed > 0){
        p.hp += healed;
        p.healFlash = 0.35;
        addFloater(p.x, p.y - 28, '+' + healed, '#4caf50', 18);
      }
      for (var q = 0; q < 14; q++){
        var qa = Math.random() * Math.PI * 2;
        spawnParticle(pk.x, pk.y, Math.random() < 0.5 ? '#4caf50' : '#81c784',
                      rand(2,4), rand(0.3,0.7),
                      Math.cos(qa)*rand(60,200), Math.sin(qa)*rand(60,200));
      }
      G.pickups.splice(i, 1);
      continue;
    }
    if (pk.life <= 0) G.pickups.splice(i, 1);
  }

  /* oleadas */
  if (G.spawnQueue === 0 && G.zombies.length === 0){
    G.waveTimer -= dt;
    if (G.waveTimer <= 0) startWave();
  } else if (G.spawnQueue > 0){
    G.spawnCd -= dt;
    if (G.spawnCd <= 0){ spawnZombie(); G.spawnQueue--; G.spawnCd = 0.32; }
  }

  if (G.waveMsg > 0) G.waveMsg -= dt;
  if (G.hintT > 0) G.hintT -= dt;
  G.shake = Math.max(0, G.shake - dt * 45);

  stepParticles(dt);
  stepFloaters(dt);
}

/* ============ RENDER ============ */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0d0f12';
  ctx.fillRect(0, 0, W, H);
  if (!G) return;

  var sx = (Math.random() - 0.5) * G.shake;
  var sy = (Math.random() - 0.5) * G.shake;

  ctx.save();
  ctx.translate(-G.cam.x + sx, -G.cam.y + sy);

  var step = 100;
  var vx0 = G.cam.x - 80, vx1 = G.cam.x + W + 80;
  var vy0 = G.cam.y - 80, vy1 = G.cam.y + H + 80;
  ctx.strokeStyle = '#171b21';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = Math.floor(vx0/step)*step; x < vx1; x += step){ ctx.moveTo(x, vy0); ctx.lineTo(x, vy1); }
  for (var y = Math.floor(vy0/step)*step; y < vy1; y += step){ ctx.moveTo(vx0, y); ctx.lineTo(vx1, y); }
  ctx.stroke();

  for (var i = 0; i < G.decals.length; i++){
    var d = G.decals[i];
    ctx.fillStyle = 'rgba(90,10,10,' + d.a + ')';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
  }

  for (i = 0; i < G.particles.length; i++){
    var q = G.particles[i];
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (i = 0; i < G.pickups.length; i++){
    var pk = G.pickups[i];
    var fade = pk.life < 4 ? (0.45 + 0.55 * Math.abs(Math.sin(pk.life * 8))) : 1;
    ctx.globalAlpha = Math.min(pk.born, fade);
    var grd = ctx.createRadialGradient(pk.x, pk.y, 0, pk.x, pk.y, 34);
    grd.addColorStop(0, 'rgba(229,57,53,0.35)');
    grd.addColorStop(1, 'rgba(229,57,53,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(pk.x, pk.y, 34, 0, 7); ctx.fill();
    drawHeart(pk.x, pk.y, 11, pk.phase);
    ctx.globalAlpha = 1;
  }

  for (i = 0; i < G.zombies.length; i++) drawZombie(G.zombies[i]);
  drawPlayer();

  ctx.strokeStyle = '#ffe082';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  for (i = 0; i < G.bullets.length; i++){
    var b = G.bullets[i];
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
    ctx.stroke();
  }

  ctx.textAlign = 'center';
  for (i = 0; i < G.floaters.length; i++){
    var f = G.floaters[i];
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    ctx.fillStyle = f.color;
    ctx.font = 'bold ' + f.size + 'px system-ui';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = '#2a3038';
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

  ctx.restore();

  if (G.state === 'playing' && G.player.healFlash > 0){
    ctx.fillStyle = 'rgba(76,175,80,' + (G.player.healFlash * 0.22) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  if (G.state === 'playing'){
    drawStick(sticks.move, 'rgba(74,144,217,0.55)');
    drawStick(sticks.aim,  'rgba(229,57,53,0.55)');
    drawButtons();
  }

  drawHUD();
}

function drawHeart(x, y, s, phase){
  var pulse = 1 + Math.sin(phase * 5) * 0.12;
  s *= pulse;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.arc(-s*0.34, -s*0.20, s*0.50, 0, Math.PI*2);
  ctx.arc( s*0.34, -s*0.20, s*0.50, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*0.80, -s*0.06);
  ctx.lineTo( s*0.80, -s*0.06);
  ctx.lineTo(0, s*0.92);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7f1010';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s*0.80, -s*0.06);
  ctx.lineTo(0, s*0.92);
  ctx.lineTo( s*0.80, -s*0.06);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.arc(-s*0.30, -s*0.36, s*0.16, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCoin(x, y, r){
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = '#ffd54f'; ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = Math.max(1.5, r * 0.22); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, 7);
  ctx.fillStyle = 'rgba(184,134,11,0.75)'; ctx.fill();
}

/* ============ SOMBREROS ============ */
function drawHatShape(r, hat, accent, bodyColor){
  if (hat === 1){ /* casco */
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.16, r * 0.22, 0, 7); ctx.fill();
  } else if (hat === 2){ /* gorra */
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.88, -Math.PI * 0.55, Math.PI * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = darken(accent, 0.35);
    ctx.beginPath();
    ctx.ellipse(r * 0.94, 0, r * 0.42, r * 0.55, 0, 0, 7);
    ctx.fill();
  } else if (hat === 3){ /* cinta */
    ctx.fillStyle = accent;
    ctx.fillRect(-r, -r * 0.28, r * 2, r * 0.56);
    ctx.beginPath();
    ctx.arc(-r * 0.92, 0, r * 0.32, 0, 7);
    ctx.fill();
  } else if (hat === 4){ /* cuernos */
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(r * 0.15, -r * 0.62);
    ctx.lineTo(r * 0.95, -r * 1.05);
    ctx.lineTo(r * 0.52, -r * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.15, r * 0.62);
    ctx.lineTo(r * 0.95, r * 1.05);
    ctx.lineTo(r * 0.52, r * 0.35);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCharacter(x, y, r, bodyColor, hat, aim){
  var accent = darken(bodyColor, 0.42);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.32, r * 1.05, r * 0.85, 0, 0, 7); ctx.fill();

  /* cañón */
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(aim);
  ctx.fillStyle = '#22262e';
  rr(r * 0.2, -3.5, 24 * (r / 15), 7 * (r / 15), 2);
  ctx.fill();
  ctx.restore();

  /* cuerpo */
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.2);
  ctx.strokeStyle = accent;
  ctx.stroke();

  /* sombrero */
  if (hat > 0){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(aim);
    drawHatShape(r, hat, accent, bodyColor);
    ctx.restore();
  }

  /* indicador de dirección */
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.arc(x + Math.cos(aim) * r * 0.55, y + Math.sin(aim) * r * 0.55, Math.max(2.5, r * 0.22), 0, 7);
  ctx.fill();
}

function drawHatButtonContent(cx, cy, r, hat, bodyColor){
  var accent = darken(bodyColor, 0.42);
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.2);
  ctx.strokeStyle = accent; ctx.stroke();
  if (hat > 0){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI / 2);
    drawHatShape(r, hat, accent, bodyColor);
    ctx.restore();
  }
}

/* ============ JUGADOR ============ */
function drawPlayer(){
  var p = G.player;
  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 5, p.r*1.05, p.r*0.85, 0, 0, 7); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(Math.cos(p.aim)*26, Math.sin(p.aim)*26);
  ctx.lineTo(Math.cos(p.aim)*240, Math.sin(p.aim)*240);
  ctx.stroke();

  var rx = Math.cos(p.aim) * 150, ry = Math.sin(p.aim) * 150;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(rx, ry, 9, 0, 7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rx - 14, ry); ctx.lineTo(rx - 5, ry);
  ctx.moveTo(rx + 5, ry);  ctx.lineTo(rx + 14, ry);
  ctx.moveTo(rx, ry - 14); ctx.lineTo(rx, ry - 5);
  ctx.moveTo(rx, ry + 5);  ctx.lineTo(rx, ry + 14);
  ctx.stroke();

  ctx.save();
  ctx.rotate(p.aim);
  ctx.fillStyle = '#22262e';
  rr(p.r*0.2, -3.5, 24, 7, 2); ctx.fill();
  ctx.restore();

  var hurt = p.hurtFlash > 0 && Math.floor(p.hurtFlash * 26) % 2 === 0;
  var inv = p.invuln > 0 && !hurt;
  var bodyCol = hurt ? '#ff6b6b' : (p.healFlash > 0 ? '#66bb6a' : SAVE.skin.body);
  var accent  = hurt ? '#ffb3b3' : darken(SAVE.skin.body, 0.42);

  ctx.globalAlpha = inv ? 0.55 : 1;
  ctx.fillStyle = bodyCol;
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = accent;
  ctx.stroke();

  if (!hurt && SAVE.skin.hat > 0){
    ctx.save();
    ctx.rotate(p.aim);
    drawHatShape(p.r, SAVE.skin.hat, accent, SAVE.skin.body);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.arc(Math.cos(p.aim)*p.r*0.55, Math.sin(p.aim)*p.r*0.55, Math.max(2.5, p.r*0.22), 0, 7);
  ctx.fill();

  ctx.restore();
}

function drawZombie(z){
  var a = Math.atan2(G.player.y - z.y, G.player.x - z.x);
  var bob = 1 + Math.sin(z.phase * 9) * 0.045;
  ctx.save();
  ctx.translate(z.x, z.y);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 5, z.r*1.05, z.r*0.85, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.rotate(a);
  ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : z.dark;
  ctx.beginPath(); ctx.arc(z.r*0.75, -z.r*0.6, z.r*0.32, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r*0.75,  z.r*0.6, z.r*0.32, 0, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : z.color;
  ctx.beginPath(); ctx.arc(0, 0, z.r * bob, 0, 7); ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = z.hitFlash > 0 ? '#ffffff' : z.dark;
  ctx.stroke();
  ctx.save();
  ctx.rotate(a);
  ctx.fillStyle = '#ff5252';
  ctx.beginPath(); ctx.arc(z.r*0.45, -z.r*0.32, z.r*0.13, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r*0.45,  z.r*0.32, z.r*0.13, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
  if (z.hp < z.maxHp){
    var bw = z.r * 2.2, bh = 4;
    var bx = z.x - bw/2, by = z.y - z.r - 13;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(bx, by, bw, bh, 2); ctx.fill();
    ctx.fillStyle = '#e53935';
    rr(bx, by, bw * (z.hp / z.maxHp), bh, 2); ctx.fill();
  }
}

function drawStick(s, color){
  if (!s) return;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_MAX, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_MAX, 0, 7); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(s.ox + s.dx, s.oy + s.dy, 26, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawButtons(){
  var p = G ? G.player : null;
  buttons[0].cd  = p ? p.dashCd : 0; buttons[0].max = 1.05;
  buttons[1].cd  = (p && p.reloading) ? p.reloadT : 0; buttons[1].max = p ? p.reloadTime : 1;

  for (var i = 0; i < buttons.length; i++){
    var b = buttons[i];
    var ready = b.cd <= 0.001;
    ctx.save();
    ctx.globalAlpha = ready ? 0.95 : 0.45;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
    ctx.fillStyle = b.press > 0 ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.09)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.stroke();
    if (!ready){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - b.cd/b.max));
      ctx.strokeStyle = '#64b5f6'; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y + 1);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
}

function drawGearIcon(){
  ctx.save();
  ctx.translate(GEAR.x, GEAR.y);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  var r = GEAR.r * 0.9;
  for (var i = 0; i < 6; i++){
    var a = i * Math.PI / 3 + 0.4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55);
    ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, 7); ctx.stroke();
  ctx.restore();
}

/* ============ SHOP (MUERTE) ============ */
function drawShop(){
  uiRects = [];

  ctx.fillStyle = 'rgba(10,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);

  var small  = Math.min(W, H) < 420;
  var rowH   = small ? 34 : 40;
  var headH  = small ? 52 : 60;
  var footH  = small ? 40 : 46;
  var panelW = Math.min(W * 0.94, 520);
  var panelH = headH + rowH * UPGRADES.length + footH;
  var px = (W - panelW) / 2;
  var py = (H - panelH) / 2;
  var i;

  ctx.fillStyle = 'rgba(10,12,16,0.97)';
  rr(px, py, panelW, panelH, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(229,57,53,0.55)';
  ctx.lineWidth = 2; ctx.stroke();

  /* cabecera */
  var hx = px + (small ? 14 : 20);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e53935';
  ctx.font = 'bold ' + (small ? 18 : 24) + 'px system-ui';
  ctx.fillText('HAS MUERTO', hx, py + (small ? 24 : 30));

  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillText('Oleada ' + G.wave + '  \u00B7  ' + G.kills + ' zombies  \u00B7  +' + G.runCoins + ' esta partida',
               hx, py + (small ? 40 : 50));

  /* monedas */
  var cx = px + panelW - (small ? 14 : 20);
  ctx.font = 'bold ' + (small ? 18 : 22) + 'px system-ui';
  var coinTxt = String(SAVE.coins);
  var ctw = ctx.measureText(coinTxt).width;
  var cR = small ? 8 : 10;
  var totalW = cR * 2 + 7 + ctw;
  var cSx = cx - totalW;
  drawCoin(cSx + cR, py + (small ? 19 : 24), cR);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(coinTxt, cSx + cR * 2 + 7, py + (small ? 25 : 31));

  /* separador */
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 12, py + headH);
  ctx.lineTo(px + panelW - 12, py + headH);
  ctx.stroke();

  /* filas de mejoras */
  for (i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i];
    var ry = py + headH + i * rowH;
    var rect = { x: px + 10, y: ry + 3, w: panelW - 20, h: rowH - 6, key: u.key };
    uiRects.push(rect);

    var lvl = SAVE.up[u.key];
    var maxed = lvl >= u.max;
    var cost = upgradeCost(u);
    var canBuy = !maxed && SAVE.coins >= cost;

    if (canBuy){
      ctx.fillStyle = 'rgba(76,175,80,0.15)';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,80,0.45)';
      ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
    }

    if (G.buyFlash > 0 && G.buyKey === u.key){
      ctx.fillStyle = 'rgba(76,175,80,' + Math.min(1, G.buyFlash * 2.4) + ')';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? '#81c784' : (canBuy ? '#ffffff' : '#cfd8dc');
    ctx.font = 'bold ' + (small ? 13 : 15) + 'px system-ui';
    ctx.fillText(u.name, rect.x + 14, rect.y + rect.h/2 + (small ? 4 : 5));

    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.font = 'bold ' + (small ? 10 : 12) + 'px system-ui';
    ctx.fillText('Nv.' + lvl + '/' + u.max, rect.x + rect.w * 0.58, rect.y + rect.h/2 + (small ? 4 : 5));

    ctx.textAlign = 'right';
    if (maxed){
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold ' + (small ? 12 : 14) + 'px system-ui';
      ctx.fillText('MAX', rect.x + rect.w - 14, rect.y + rect.h/2 + (small ? 4 : 5));
    } else {
      var txt = String(cost);
      ctx.font = 'bold ' + (small ? 13 : 15) + 'px system-ui';
      var tw = ctx.measureText(txt).width;
      var r = small ? 6 : 7;
      var startX = rect.x + rect.w - 14 - tw - r*2 - 5;
      drawCoin(startX + r, rect.y + rect.h/2 - 1, r);
      ctx.textAlign = 'left';
      ctx.fillStyle = canBuy ? '#ffd54f' : '#5a5f66';
      ctx.fillText(txt, startX + r*2 + 5, rect.y + rect.h/2 + (small ? 4 : 5));
    }
  }

  /* botones inferiores: PERSONALIZAR | REINICIAR */
  var btnH = small ? 30 : 34;
  var btnGap = 8;
  var btnW = (panelW - 20 - btnGap) / 2;
  var btnY = py + panelH - footH + (footH - btnH) / 2;

  var bx1 = px + 10;
  ctx.fillStyle = 'rgba(126,87,194,0.92)';
  rr(bx1, btnY, btnW, btnH, 9); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (small ? 13 : 15) + 'px system-ui';
  ctx.fillText('PERSONALIZAR', bx1 + btnW/2, btnY + btnH/2 + (small ? 5 : 6));
  uiRects.push({ x: bx1, y: btnY, w: btnW, h: btnH, key: 'customize' });

  var bx2 = bx1 + btnW + btnGap;
  ctx.fillStyle = 'rgba(74,144,217,0.92)';
  rr(bx2, btnY, btnW, btnH, 9); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('REINICIAR', bx2 + btnW/2, btnY + btnH/2 + (small ? 5 : 6));
  uiRects.push({ x: bx2, y: btnY, w: btnW, h: btnH, key: 'restart' });
}

/* ============ CUSTOMIZE ============ */
function drawCustomize(){
  uiRects = [];

  ctx.fillStyle = 'rgba(8,10,18,0.9)';
  ctx.fillRect(0, 0, W, H);

  var small = Math.min(W, H) < 420;
  var panelW = Math.min(W * 0.94, 540);
  var panelH = Math.min(H * 0.94, small ? 230 : 270);
  var px = (W - panelW) / 2;
  var py = (H - panelH) / 2;

  ctx.fillStyle = 'rgba(10,12,16,0.98)';
  rr(px, py, panelW, panelH, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(126,87,194,0.65)';
  ctx.lineWidth = 2; ctx.stroke();

  /* cabecera */
  var titleY = py + (small ? 24 : 30);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#b39ddb';
  ctx.font = 'bold ' + (small ? 15 : 19) + 'px system-ui';
  ctx.fillText('PERSONALIZA TU PERSONAJE', px + 16, titleY);

  /* vista previa arriba a la derecha */
  var pvR = small ? 20 : 26;
  var pvX = px + panelW - 22 - pvR;
  var pvY = titleY - pvR * 0.35;
  drawCharacter(pvX, pvY, pvR, SAVE.skin.body, SAVE.skin.hat, -Math.PI / 2);

  /* separador */
  var sepY = py + (small ? 44 : 52);
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 12, sepY);
  ctx.lineTo(px + panelW - 12, sepY);
  ctx.stroke();

  /* --- COLOR --- */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold ' + (small ? 10 : 12) + 'px system-ui';
  var colLblY = sepY + (small ? 16 : 20);
  ctx.fillText('COLOR', px + 16, colLblY);

  var swatchSize = small ? 24 : 30;
  var swGap = small ? 5 : 7;
  var totalSw = SKIN_COLORS.length * swatchSize + (SKIN_COLORS.length - 1) * swGap;
  var swStartX = px + (panelW - totalSw) / 2;
  var swY = colLblY + (small ? 6 : 8);

  for (var i = 0; i < SKIN_COLORS.length; i++){
    var col = SKIN_COLORS[i];
    var sxc = swStartX + i * (swatchSize + swGap) + swatchSize / 2;
    var syc = swY + swatchSize / 2;
    var selected = (col.toLowerCase() === SAVE.skin.body.toLowerCase());

    ctx.beginPath(); ctx.arc(sxc, syc, swatchSize / 2, 0, 7);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = selected ? 3 : 1.5;
    ctx.strokeStyle = selected ? '#ffffff' : 'rgba(0,0,0,0.5)';
    ctx.stroke();

    if (selected){
      ctx.beginPath(); ctx.arc(sxc, syc, 3.2, 0, 7);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
    uiRects.push({ x: sxc - swatchSize/2, y: syc - swatchSize/2,
                   w: swatchSize, h: swatchSize, key: 'color:' + col });
  }

  /* --- SOMBRERO --- */
  var hatLblY = swY + swatchSize + (small ? 18 : 22);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillText('SOMBRERO', px + 16, hatLblY);

  var hatBtnSize = small ? 40 : 48;
  var hatGap = small ? 6 : 10;
  var totalHat = HAT_COUNT * hatBtnSize + (HAT_COUNT - 1) * hatGap;
  var hatStartX = px + (panelW - totalHat) / 2;
  var hatY = hatLblY + (small ? 6 : 8);

  for (var h = 0; h < HAT_COUNT; h++){
    var hx = hatStartX + h * (hatBtnSize + hatGap);
    var hc = hx + hatBtnSize / 2;
    var hv = hatY + hatBtnSize / 2;
    var sel = (h === SAVE.skin.hat);

    ctx.fillStyle = sel ? 'rgba(126,87,194,0.28)' : 'rgba(255,255,255,0.04)';
    rr(hx, hatY, hatBtnSize, hatBtnSize, 8); ctx.fill();
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeStyle = sel ? '#b39ddb' : 'rgba(255,255,255,0.1)';
    ctx.stroke();

    drawHatButtonContent(hc, hv, hatBtnSize * 0.27, h, SAVE.skin.body);

    uiRects.push({ x: hx, y: hatY, w: hatBtnSize, h: hatBtnSize, key: 'hat:' + h });
  }

  /* botón volver */
  var btnW = small ? 110 : 130;
  var btnH = small ? 30 : 34;
  var btnX = px + panelW/2 - btnW/2;
  var btnY = py + panelH - btnH - (small ? 10 : 12);
  ctx.fillStyle = 'rgba(74,144,217,0.92)';
  rr(btnX, btnY, btnW, btnH, 9); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (small ? 13 : 15) + 'px system-ui';
  ctx.fillText('VOLVER', btnX + btnW/2, btnY + btnH/2 + (small ? 5 : 6));
  uiRects.push({ x: btnX, y: btnY, w: btnW, h: btnH, key: 'back' });
}

/* ============ HUD ============ */
function drawHUD(){
  if (!G) return;

  if (G.state === 'customize'){ drawCustomize(); return; }
  if (G.state === 'dead'){ drawShop(); return; }

  var p = G.player;
  var small = Math.min(W, H) < 420;
  var pad = small ? 14 : 22;

  /* vida */
  var bw = Math.min(small ? 150 : 260, W * 0.42);
  var bh = small ? 16 : 20;
  var bx = pad, by = pad;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(bx - 5, by - 5, bw + 10, bh + 10, 9); ctx.fill();
  ctx.fillStyle = '#241717';
  rr(bx, by, bw, bh, 6); ctx.fill();

  var frac = Math.max(0, p.hp / p.maxHp);
  ctx.fillStyle = frac > 0.5 ? '#43a047' : (frac > 0.25 ? '#f9a825' : '#e53935');
  rr(bx, by, bw * frac, bh, 6); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (small ? 11 : 13) + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, bx + bw/2, by + bh - (small ? 4 : 5));

  /* botón engranaje */
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  ctx.beginPath(); ctx.arc(GEAR.x, GEAR.y, GEAR.r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(GEAR.x, GEAR.y, GEAR.r, 0, 7); ctx.stroke();
  drawGearIcon();

  /* puntuación */
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (small ? 22 : 30) + 'px system-ui';
  ctx.fillText(fmt(G.score), W - pad, pad + (small ? 20 : 26));
  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold ' + (small ? 11 : 14) + 'px system-ui';
  ctx.fillText('OLEADA ' + G.wave, W - pad, pad + (small ? 38 : 48));

  /* monedas */
  ctx.font = 'bold ' + (small ? 13 : 16) + 'px system-ui';
  var coinTxt = String(SAVE.coins);
  var ctw = ctx.measureText(coinTxt).width;
  var cr = small ? 7 : 8;
  var cxp = W - pad - ctw - cr*2 - 6;
  var cyp = pad + (small ? 52 : 68);
  drawCoin(cxp + cr, cyp - (small ? 4 : 5), cr);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(coinTxt, cxp + cr*2 + 6, cyp);

  /* munición */
  ctx.textAlign = 'center';
  var ax = W/2, ay = pad + (small ? 16 : 22);
  if (p.reloading){
    ctx.fillStyle = '#ffb300';
    ctx.font = 'bold ' + (small ? 13 : 17) + 'px system-ui';
    ctx.fillText('RECARGANDO', ax, ay);
    var rw = small ? 100 : 150;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(ax - rw/2, ay + 8, rw, 7, 4); ctx.fill();
    ctx.fillStyle = '#ffb300';
    rr(ax - rw/2, ay + 8, rw * (1 - p.reloadT / p.reloadTime), 7, 4); ctx.fill();
  } else {
    ctx.fillStyle = p.mag <= 4 ? '#e53935' : '#fff';
    ctx.font = 'bold ' + (small ? 26 : 34) + 'px system-ui';
    ctx.fillText(String(p.mag), ax - 14, ay + 6);
    ctx.fillStyle = '#6e7681';
    ctx.font = 'bold ' + (small ? 15 : 20) + 'px system-ui';
    ctx.fillText('/ \u221E', ax + 20, ay + 6);
  }

  /* pista */
  if (G.hintT > 0 && G.wave <= 1){
    ctx.globalAlpha = Math.min(1, G.hintT / 1.5) * 0.8;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfd8dc';
    ctx.font = 'bold ' + (small ? 12 : 15) + 'px system-ui';
    ctx.fillText('Izquierda: moverte  \u00B7  Derecha: apuntar y disparar', W/2, H * 0.60);
    ctx.globalAlpha = 1;
  }

  /* aviso oleada */
  if (G.waveMsg > 0){
    ctx.globalAlpha = Math.min(1, G.waveMsg * 1.6);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e53935';
    ctx.font = 'bold ' + (small ? 40 : 58) + 'px system-ui';
    ctx.fillText('OLEADA ' + G.wave, W/2, H * 0.30);
    ctx.globalAlpha = 1;
  }
}

/* ============ LOOP ============ */
var last = 0;
function loop(now){
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  try { update(dt); render(); }
  catch (err) { showErr(err && err.message ? err.message : String(err)); }
  requestAnimationFrame(loop);
}

function boot(){
  try {
    resize();
    setTimeout(resize, 60);
    setTimeout(resize, 300);
    reset();
    requestAnimationFrame(loop);
  } catch (e) { showErr(e && e.message ? e.message : String(e)); }
