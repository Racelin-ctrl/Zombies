var errBox = document.getElementById('err');
function showErr(msg){
  errBox.style.display = 'block';
  errBox.textContent = 'ERROR: ' + msg;
}
window.addEventListener('error', function(e){
  showErr((e.message || 'desconocido') + (e.lineno ? '  (línea ' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e){ showErr(String(e.reason)); });

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d', { alpha:false });
var W = 0, H = 0, DPR = 1, vignette = null;

function measureViewport(){
  var w = 0, h = 0;
  if (window.visualViewport && window.visualViewport.width && window.visualViewport.height){
    w = window.visualViewport.width; h = window.visualViewport.height;
  }
  if (!w || !h){
    w = window.innerWidth  || document.documentElement.clientWidth  || (document.body && document.body.clientWidth)  || 0;
    h = window.innerHeight || document.documentElement.clientHeight || (document.body && document.body.clientHeight) || 0;
  }
  if (!w || !h){ w = window.outerWidth || 480; h = window.outerHeight || 320; }
  return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
}

function resize(){
  var vp = measureViewport();
  if (vp.w === W && vp.h === H && canvas.width){ updateRotateUI(); layoutUI(); return; }
  W = vp.w; H = vp.h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = ctx.createRadialGradient(
    W/2, H/2, Math.min(W,H) * 0.30, W/2, H/2, Math.max(W,H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.72)');
  layoutUI();
  updateRotateUI();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 60); setTimeout(resize, 260); });
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
if (window.ResizeObserver){
  try { new ResizeObserver(resize).observe(document.documentElement); } catch(e){}
  try { new ResizeObserver(resize).observe(document.body); } catch(e){}
}
setInterval(function(){
  var vp = measureViewport();
  if (vp.w !== W || vp.h !== H) resize();
}, 400);

var rotateEl = document.getElementById('rotate');
var fsBtn = document.getElementById('fsBtn');
function isPortrait(){ return H > W * 1.05; }
function updateRotateUI(){
  if (isPortrait() && W > 0 && H > 0) rotateEl.classList.add('on');
  else rotateEl.classList.remove('on');
}
function lockLandscape(){
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  var p = fs ? fs.call(el) : null;
  function tryLock(){
    if (screen.orientation && screen.orientation.lock){
      var r = screen.orientation.lock('landscape');
      if (r && r.catch) r.catch(function(){});
    }
    setTimeout(resize, 200); setTimeout(resize, 600);
  }
  if (p && p.then) p.then(tryLock).catch(function(){ tryLock(); });
  else tryLock();
}
fsBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); lockLandscape(); });

var CREATOR_CODE = 'Racelin67';
var codePanelEl = document.getElementById('codePanel');
var codeInputEl = document.getElementById('codeInput');
var codeMsgEl = document.getElementById('codeMsg');
var codeOpen = false;

function openCodePanel(){
  codeOpen = true;
  codePanelEl.classList.add('on');
  codeMsgEl.textContent = '';
  codeInputEl.value = '';
  setTimeout(function(){ try { codeInputEl.focus(); } catch(e){} }, 80);
}
function closeCodePanel(){
  codeOpen = false;
  codePanelEl.classList.remove('on');
  try { codeInputEl.blur(); } catch(e){}
}
function tryCode(){
  var v = (codeInputEl.value || '').trim();
  if (!v){ codeMsgEl.style.color = '#ff8a80'; codeMsgEl.textContent = 'Escribe un código'; return; }
  if (v.toLowerCase() !== CREATOR_CODE.toLowerCase()){
    codeMsgEl.style.color = '#ff8a80';
    codeMsgEl.textContent = 'Código inválido';
    return;
  }
  if (SAVE.codeUsed){
    codeMsgEl.style.color = '#ffd54f';
    codeMsgEl.textContent = 'Ya canjeado anteriormente';
    return;
  }
  SAVE.codeUsed = true;
  SAVE.goldenUnlocked = true;
  SAVE.coins += 1000;
  saveGame();
  codeMsgEl.style.color = '#81c784';
  codeMsgEl.textContent = '+1000 monedas y skin dorada desbloqueada';
  setTimeout(closeCodePanel, 1400);
}
document.getElementById('codeSubmit').addEventListener('click', function(e){ e.preventDefault(); tryCode(); });
document.getElementById('codeCancel').addEventListener('click', function(e){ e.preventDefault(); closeCodePanel(); });
codeInputEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); tryCode(); }
  e.stopPropagation();
});
codeInputEl.addEventListener('keyup', function(e){ e.stopPropagation(); });

function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function rand(a,b){ return a + Math.random() * (b - a); }
function angleDiff(a,b){
  var d = a - b;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function fmt(n){
  var s = String(Math.floor(n)), out = '';
  while (s.length > 3){ out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}
function rr(x,y,w,h,r){
  r = Math.max(0, Math.min(r, Math.min(Math.abs(w), Math.abs(h)) / 2));
  if (w < 0){ x += w; w = -w; }
  if (h < 0){ y += h; h = -h; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function hexByte(v){ v = Math.max(0, Math.min(255, Math.round(v))); var s = v.toString(16); return s.length < 2 ? '0' + s : s; }
function darken(hex, amount){
  if (hex === 'GOLD') return '#8b6914';
  if (!hex || hex.length < 7) return '#222222';
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  r *= (1 - amount); g *= (1 - amount); b *= (1 - amount);
  return '#' + hexByte(r) + hexByte(g) + hexByte(b);
}

var GAME_TITLE = 'ÚLTIMA OLEADA';
var GAME_SUBTITLE = 'SUPERVIVENCIA POR OLEADAS';

var SAVE_KEY = 'zombies_save_v1';
var SAVE = {
  coins: 0, best: 0, bestWave: 0,
  up: { speed: 0, reload: 0, mag: 0, fire: 0, damage: 0 },
  skin: { body: '#4a90d9', hat: 0 },
  ownedWeapons: { pistol: true },
  currentWeapon: 'pistol',
  goldenUnlocked: false,
  codeUsed: false,
  savedPowerups: { shield: 0, dash: 0, damage: 0, speed: 0, fireRate: 0 }
};

function loadSave(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d) return;
    SAVE.coins    = Math.max(0, d.coins | 0);
    SAVE.best     = Math.max(0, d.best  | 0);
    SAVE.bestWave = Math.max(0, d.bestWave | 0);
    SAVE.goldenUnlocked = !!d.goldenUnlocked;
    SAVE.codeUsed = !!d.codeUsed;
    if (d.up){
      SAVE.up.speed  = Math.max(0, d.up.speed  | 0);
      SAVE.up.reload = Math.max(0, d.up.reload | 0);
      SAVE.up.mag    = Math.max(0, d.up.mag    | 0);
      SAVE.up.fire   = Math.max(0, d.up.fire   | 0);
      SAVE.up.damage = Math.max(0, d.up.damage | 0);
    }
    if (d.skin){
      if (typeof d.skin.body === 'string' &&
          (/^#[0-9a-fA-F]{6}$/.test(d.skin.body) || d.skin.body === 'GOLD'))
        SAVE.skin.body = d.skin.body;
      SAVE.skin.hat = Math.max(0, Math.min(4, d.skin.hat | 0));
    }
    if (d.ownedWeapons && typeof d.ownedWeapons === 'object'){
      SAVE.ownedWeapons = { pistol: true };
      for (var k in d.ownedWeapons){
        if (d.ownedWeapons[k] && WEAPONS[k]) SAVE.ownedWeapons[k] = true;
      }
    }
    if (d.currentWeapon && WEAPONS[d.currentWeapon] && SAVE.ownedWeapons[d.currentWeapon])
      SAVE.currentWeapon = d.currentWeapon;

    /* Power-ups guardados */
    if (d.savedPowerups && typeof d.savedPowerups === 'object'){
      SAVE.savedPowerups = {
        shield:   Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.shield   | 0)),
        dash:     Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.dash     | 0)),
        damage:   Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.damage   | 0)),
        speed:    Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.speed    | 0)),
        fireRate: Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.fireRate | 0))
      };
    }

    if (SAVE.skin.body === 'GOLD' && !SAVE.goldenUnlocked) SAVE.skin.body = '#4a90d9';
  } catch(e){}
}
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch(e){}
}

/* Sincroniza los power-ups del jugador con el guardado */
function syncPowerupsToSave(){
  if (!G || !G.player) return;
  var p = G.player.powerups;
  SAVE.savedPowerups = {
    shield:   p.shield   | 0,
    dash:     p.dash     | 0,
    damage:   p.damage   | 0,
    speed:    p.speed    | 0,
    fireRate: p.fireRate | 0
  };
  saveGame();
}

var UPGRADES = [
  { key:'speed',  name:'VELOCIDAD', max:6, base:8,  step:8  },
  { key:'reload', name:'RECARGA',   max:8, base:10, step:10 },
  { key:'mag',    name:'CAPACIDAD', max:6, base:12, step:12 },

];

function upgradeCost(u){ return u.base + u.step * SAVE.up[u.key]; }
function isMaxed(u){ return SAVE.up[u.key] >= u.max; }

function buyUpgrade(key){
  for (var i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i];
    if (u.key !== key) continue;
    if (isMaxed(u)) return false;
    var c = upgradeCost(u);
    if (SAVE.coins < c) return false;
    SAVE.coins -= c;
    SAVE.up[key]++;
    saveGame();
    if (G){ G.buyFlash = 0.35; G.buyKey = key; }
    return true;
  }
  return false;
}

  smg:     { key:'smg',     name:'SUBFUSIL', cost:250, dmg:9,  fireRate:0.070, magSize:30, reloadTime:1.60, pellets:1, spread:0.100, color:'#81d4fa' },
  shotgun: { key:'shotgun', name:'ESCOPETA', cost:400, dmg:11, fireRate:0.80,  magSize:6,  reloadTime:2.40, pellets:6, spread:0.220, color:'#ffab91' },
  rifle:   { key:'rifle',   name:'RIFLE',    cost:600, dmg:44, fireRate:0.60,  magSize:10, reloadTime:2.00, pellets:1, spread:0.008, color:'#c5e1a5' }
};
var WEAPON_ORDER = ['pistol', 'smg', 'shotgun', 'rifle'];

function buyWeapon(k){
  var w = WEAPONS[k];
  if (!w || SAVE.ownedWeapons[k] || SAVE.coins < w.cost) return false;
  SAVE.coins -= w.cost;
  SAVE.ownedWeapons[k] = true;
  SAVE.currentWeapon = k;
  saveGame();
  if (G){ G.buyFlash = 0.35; G.buyKey = 'weapon:' + k; }
  return true;
}
function equipWeapon(k){
  if (!SAVE.ownedWeapons[k]) return false;
  SAVE.currentWeapon = k;
  saveGame();
  return true;
}

function applyUpgrades(){
  var u = SAVE.up;
  var w = WEAPONS[SAVE.currentWeapon] || WEAPONS.pistol;
  return {
    speed:      (262 + u.speed * 15),
    reloadTime: Math.max(0.40, w.reloadTime - u.reload * 0.14),
    magSize:    w.magSize + u.mag * 3,
    fireRate:   Math.max(0.040, w.fireRate - u.fire * 0.012),
    dmg:        w.dmg + u.damage * 3,
    weapon:     w
  };
}

function layoutUI(){
  var small = Math.min(W, H) < 420;

  var pad = 34 + 16;
  buttons[0].x = W - pad;
  buttons[0].y = H - pad;

  var slotR = small ? 16 : 19;
  var spacing = small ? 44 : 52;
  var startY = H - (small ? 42 : 48);
  var curveX = [26, 10, 0, 10, 26];
  var baseX = small ? 28 : 32;
  for (var i = 0; i < 5; i++){
    powerSlots[i].x = baseX + curveX[i];
    powerSlots[i].y = startY - i * spacing;
    powerSlots[i].r = slotR;
  }
}

var SCENERY = [];
function generateScenery(){
  SCENERY = [];
  var seed = 987654;
  function nr(){
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }
  for (var i = 0; i < 180; i++){
    SCENERY.push({ type:'patch', x: nr()*WORLD.w, y: nr()*WORLD.h,
      r: 40 + nr()*90, a: 0.04 + nr()*0.06, hue: nr() });
  }
  for (var i2 = 0; i2 < 42; i2++){
    SCENERY.push({ type:'rock', x: nr()*WORLD.w, y: nr()*WORLD.h,
      s: 8 + nr()*14, rot: nr()*Math.PI*2, shade: nr() });
  }
  for (var i3 = 0; i3 < 24; i3++){
    SCENERY.push({ type:'tree', x: nr()*WORLD.w, y: nr()*WORLD.h,
      s: 22 + nr()*22, rot: nr()*Math.PI*2 });
  }
  for (var i4 = 0; i4 < 18; i4++){
    SCENERY.push({ type:'grave', x: nr()*WORLD.w, y: nr()*WORLD.h,
      s: 10 + nr()*8, rot: (nr()-0.5)*0.4 });
  }
  for (var i5 = 0; i5 < 24; i5++){
    SCENERY.push({ type:'blood', x: nr()*WORLD.w, y: nr()*WORLD.h,
      r: 14 + nr()*34, a: 0.10 + nr()*0.18 });
  }
}
generateScenery();

function makeStick(id, x, y){
  return { id:id, ox:x, oy:y, x:x, y:y, dx:0, dy:0, mag:0, nx:0, ny:0 };
}
function updateStick(s){
  var dx = s.x - s.ox, dy = s.y - s.oy;
  var d = Math.sqrt(dx*dx + dy*dy);
  if (d > STICK_MAX){
    var k = (d - STICK_MAX) / d;
    s.ox += dx * k; s.oy += dy * k;
    dx = s.x - s.ox; dy = s.y - s.oy;
    d = STICK_MAX;
  }
  s.dx = dx; s.dy = dy;
  s.mag = Math.min(1, d / STICK_MAX);
  s.nx = dx / STICK_MAX; s.ny = dy / STICK_MAX;
}

function handleUITap(x, y){
  for (var i = 0; i < uiRects.length; i++){
    var r = uiRects[i];
    if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) continue;
    var k = r.key;
    if (k === 'play'){ startNewRun(); return true; }
    if (k === 'menu'){ goMenu(); return true; }
    if (k === 'shop'){ openShop('mejoras', 'menu'); return true; }
    if (k === 'close-shop'){ closeShop(); return true; }
    if (k === 'open-code'){ openCodePanel(); return true; }
    if (k.indexOf('tab:') === 0){ G.shopTab = k.slice(4); return true; }
    if (k.indexOf('color:') === 0){ SAVE.skin.body = k.slice(6); saveGame(); return true; }
    if (k.indexOf('hat:') === 0){ SAVE.skin.hat = parseInt(k.slice(4), 10) || 0; saveGame(); return true; }
    if (k.indexOf('buyweapon:') === 0){ buyWeapon(k.slice(10)); return true; }
    if (k.indexOf('equip:') === 0){ equipWeapon(k.slice(6)); return true; }
    buyUpgrade(k);
    return true;
  }
  return false;
}

function handleGameplayTap(x, y){
  for (var si = 0; si < powerSlots.length; si++){
    var sl = powerSlots[si];
    if (Math.hypot(x - sl.x, y - sl.y) < sl.r * 1.5){
      activatePowerup(POWERUP_ORDER[si]);
      return true;
    }
  }
  for (var i = 0; i < buttons.length; i++){
    var b = buttons[i];
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.45){
      b.press = 0.2;
      if (b.id === 'reload') tryReload();
      return true;
    }
  }
  return false;
}

function onPointerDown(id, x, y){
  if (handleGameplayTap(x, y)) return true;
  if (x < W * 0.5){
    if (!sticks.move) sticks.move = makeStick(id, x, y);
  } else {
    if (!sticks.aim) sticks.aim = makeStick(id, x, y);
  }
  return false;
}
function onPointerMove(id, x, y){
  if (sticks.move && sticks.move.id === id){ sticks.move.x = x; sticks.move.y = y; updateStick(sticks.move); }
  if (sticks.aim  && sticks.aim.id  === id){ sticks.aim.x  = x; sticks.aim.y  = y; updateStick(sticks.aim);  }
}
function onPointerUp(id){
  if (sticks.move && sticks.move.id === id) sticks.move = null;
  if (sticks.aim  && sticks.aim.id  === id) sticks.aim  = null;
}

function isUIMode(){
  return G && (G.state === 'menu' || G.state === 'shop');
}

canvas.addEventListener('touchstart', function(e){
  if (codeOpen) return;
  e.preventDefault();
  if (!landscapeAsked){ landscapeAsked = true; if (isPortrait()) lockLandscape(); }
  if (isUIMode()){
    for (var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      handleUITap(t.clientX, t.clientY);
    }
    return;
  }
  for (var j = 0; j < e.changedTouches.length; j++){
    var tt = e.changedTouches[j];
    onPointerDown(tt.identifier, tt.clientX, tt.clientY);
  }
}, { passive:false });
canvas.addEventListener('touchmove', function(e){
  if (codeOpen) return;
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    onPointerMove(t.identifier, t.clientX, t.clientY);
  }
}, { passive:false });
function endTouches(e){
  if (codeOpen) return;
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) onPointerUp(e.changedTouches[i].identifier);
}
canvas.addEventListener('touchend', endTouches, { passive:false });
canvas.addEventListener('touchcancel', endTouches, { passive:false });

window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });

window.addEventListener('mousedown', function(e){
  if (codeOpen) return;
  if (e.button !== 0) return;

  if (isUIMode()){ handleUITap(e.clientX, e.clientY); return; }

  if (G && G.state === 'playing'){
    if (handleGameplayTap(e.clientX, e.clientY)) return;
  }

  mouse.down = true; mouse.active = true;
});

window.addEventListener('mouseup', function(e){ if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if (codeOpen) return;
  keys[e.code] = true;

  if (e.code === 'Space'){ e.preventDefault(); tryDash(); }
  if (e.code === 'KeyR') tryReload();

  if (G && G.state === 'playing'){
    if (e.code === 'Digit1' || e.code === 'Numpad1') activatePowerup('shield');
    if (e.code === 'Digit2' || e.code === 'Numpad2') activatePowerup('dash');
    if (e.code === 'Digit3' || e.code === 'Numpad3') activatePowerup('damage');
    if (e.code === 'Digit4' || e.code === 'Numpad4') activatePowerup('speed');
    if (e.code === 'Digit5' || e.code === 'Numpad5') activatePowerup('fireRate');
  }

  if (e.code === 'KeyM' && G && G.state === 'playing'){
    goMenu();
  }

  if (e.code === 'Enter'){
    if (G && (G.state === 'menu' || G.state === 'shop')) startNewRun();
  }
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });

var G = null;
var menuTime = 0;

function goMenu(){ reset(); G.state = 'menu'; }
function openShop(tab, from){
  reset();
  G.state = 'shop';
  G.shopTab = tab || 'mejoras';
  G.shopFrom = from || 'menu';
  G.showStats = (from === 'dead');
}
function closeShop(){
  if (G.shopFrom === 'dead') startNewRun();
  else goMenu();
}
function startNewRun(){ reset(); G.state = 'playing'; }

function reset(){
  var U = applyUpgrades();

  /* Cargar power-ups guardados */
  var sp = SAVE.savedPowerups || { shield:0, dash:0, damage:0, speed:0, fireRate:0 };

  G = {
    player: {
      x: WORLD.w/2, y: WORLD.h/2, r: 15,
      speed: U.speed, hp: 100, maxHp: 100,
      aim: -Math.PI/2,
      hurtFlash: 0, invuln: 0, healFlash: 0,
      magSize: U.magSize, mag: U.magSize,
      reloading: false, reloadT: 0, reloadTime: U.reloadTime,
      fireCd: 0, fireRate: U.fireRate, dmg: U.dmg, weapon: U.weapon,
      dashCd: 0, dashT: 0, dashDX: 0, dashDY: 1,
      powerups: {
        shield:   Math.max(0, Math.min(POWERUP_MAX_STACK, sp.shield   | 0)),
        dash:     Math.max(0, Math.min(POWERUP_MAX_STACK, sp.dash     | 0)),
        damage:   Math.max(0, Math.min(POWERUP_MAX_STACK, sp.damage   | 0)),
        speed:    Math.max(0, Math.min(POWERUP_MAX_STACK, sp.speed    | 0)),
        fireRate: Math.max(0, Math.min(POWERUP_MAX_STACK, sp.fireRate | 0))
      },
      active:   { shield:0, damage:0, speed:0, fireRate:0 }
    },
    zombies: [], bullets: [], ebullets: [], particles: [], floaters: [], decals: [],
    pickups: [], powerDrops: [],
    score: 0, kills: 0, runCoins: 0,
    wave: 0, waveTimer: 2.0, spawnQueue: 0, spawnCd: 0,
    state: 'menu', shake: 0, waveMsg: 0, hintT: 7, deadT: 0, time: 0,
    buyFlash: 0, buyKey: '',
    bloodRound: false, bloodMsg: 0,
    shopTab: 'mejoras', shopFrom: 'menu', showStats: false,
    newRecord: false, slotFlashKey: '', slotFlashT: 0,
    cam: { x: 0, y: 0 }
  };
  sticks.move = null; sticks.aim = null; uiRects = [];
  updateCamera();
  layoutUI();
}

function updateCamera(){
  if (!G) return;
  var p = G.player, cx, cy;
  if (WORLD.w <= W) cx = (WORLD.w - W) / 2; else cx = clamp(p.x - W/2, 0, WORLD.w - W);
  if (WORLD.h <= H) cy = (WORLD.h - H) / 2; else cy = clamp(p.y - H/2, 0, WORLD.h - H);
  G.cam.x = cx; G.cam.y = cy;
}

function spawnParticle(x, y, color, size, life, vx, vy, drag){
  if (G.particles.length > 560) return;
  G.particles.push({ x:x, y:y, vx:vx || 0, vy:vy || 0, color:color, size:size,
                     life:life, max:life, drag:(drag === undefined ? 0.15 : drag) });
}
function bloodBurst(x, y, amount, power){
  for (var i = 0; i < amount; i++){
    var a = Math.random() * Math.PI * 2;
    var s = rand(50, power);
    spawnParticle(x, y, Math.random() < 0.75 ? '#b71c1c' : '#7f1010',
                  rand(1.5, 4), rand(0.35, 0.8), Math.cos(a)*s, Math.sin(a)*s);
  }
}
function addFloater(x, y, text, color, size){
  G.floaters.push({ x:x, y:y, vy:-58, life:0.8, max:0.8, text:text, color:color, size:size || 15 });
}
function stepParticles(dt){
  for (var i = G.particles.length - 1; i >= 0; i--){
    var q = G.particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    var k = Math.pow(q.drag, dt);
    q.vx *= k; q.vy *= k;
    q.life -= dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
}
function stepFloaters(dt){
  for (var i = G.floaters.length - 1; i >= 0; i--){
    var f = G.floaters[i];
    f.y += f.vy * dt;
    f.vy *= Math.pow(0.05, dt);
    f.life -= dt;
    if (f.life <= 0) G.floaters.splice(i, 1);
  }
}

function tryReload(){
  if (!G || G.state !== 'playing') return;
  var p = G.player;
  if (p.reloading || p.mag === p.magSize) return;
  p.reloading = true; p.reloadT = p.reloadTime;
}

function tryDash(){
  if (!G || G.state !== 'playing') return;
  var p = G.player;
  if (p.dashCd > 0 || p.dashT > 0) return;
  var dx = 0, dy = 0;
  if (sticks.move && sticks.move.mag > 0.15){ dx = sticks.move.nx; dy = sticks.move.ny; }
  else {
    if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (keys['KeyW'] || keys['ArrowUp'])    dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  dy += 1;
  }
  if (!dx && !dy){ dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
  var l = Math.hypot(dx, dy) || 1;
  p.dashDX = dx / l; p.dashDY = dy / l;
  p.dashT = 0.16; p.dashCd = 1.05;
  p.invuln = Math.max(p.invuln, 0.28);
  for (var i = 0; i < 14; i++){
    var a = Math.random() * Math.PI * 2;
    spawnParticle(p.x, p.y, 'rgba(120,190,255,0.75)', rand(2,4), rand(0.2,0.45),
                  Math.cos(a)*130, Math.sin(a)*130);
  }
}

function activatePowerup(key){
  if (!G || G.state !== 'playing') return false;
  var p = G.player;
  if (p.powerups[key] <= 0) return false;
  var pu = POWERUPS[key];
  p.powerups[key]--;

  /* Persistir inmediatamente */
  syncPowerupsToSave();

  if (pu.type === 'instant'){
    var dx = 0, dy = 0;
    if (sticks.move && sticks.move.mag > 0.15){
      dx = sticks.move.nx; dy = sticks.move.ny;
    } else {
      dx = Math.cos(p.aim); dy = Math.sin(p.aim);
    }
    var l = Math.hypot(dx, dy) || 1;
    p.dashDX = dx / l;
    p.dashDY = dy / l;
    p.dashT = 0.18;
    p.dashCd = 0;
    p.invuln = Math.max(p.invuln, 0.6);

    for (var i = 0; i < 26; i++){
      var a = Math.random() * Math.PI * 2;
      spawnParticle(p.x, p.y, pu.color, rand(2,5), rand(0.3,0.6),
                    Math.cos(a)*rand(80,280), Math.sin(a)*rand(80,280));
    }
    addFloater(p.x, p.y - 32, '¡DASH!', pu.color, 19);
    G.shake = Math.min(G.shake + 4, 12);
  } else {
    p.active[key] = pu.duration;
    addFloater(p.x, p.y - 32, pu.name, pu.color, 18);
    for (var j = 0; j < 20; j++){
      var a2 = Math.random() * Math.PI * 2;
      spawnParticle(p.x, p.y, pu.color, rand(2,4), rand(0.3,0.7),
                    Math.cos(a2)*rand(80,240), Math.sin(a2)*rand(80,240));
    }
  }
  G.slotFlashKey = key; G.slotFlashT = 0.4;
  return true;
}

function shoot(){
  var p = G.player;
  var w = p.weapon;
  var dmgMul = p.active.damage > 0 ? 2 : 1;
  var rateMul = p.active.fireRate > 0 ? 0.5 : 1;
  p.fireCd = p.fireRate * rateMul;
  p.mag--;

  var targetAng = p.aim;
  var best = null, bestDiff = 0.26;
  for (var i = 0; i < G.zombies.length; i++){
    var z = G.zombies[i];
    if (z.dead) continue;
    var zdx = z.x - p.x, zdy = z.y - p.y;
    if (zdx*zdx + zdy*zdy > 820 * 820) continue;
    var d = Math.abs(angleDiff(Math.atan2(zdy, zdx), p.aim));
    if (d < bestDiff){ bestDiff = d; best = z; }
  }
  if (best) targetAng = Math.atan2(best.y - p.y, best.x - p.x);

  var spd = 1150;
  var bulletColor = p.active.damage > 0 ? '#ff5722' : w.color;
  for (var k = 0; k < w.pellets; k++){
    var a = targetAng + rand(-w.spread, w.spread);
    G.bullets.push({
      x: p.x + Math.cos(targetAng) * 22,
      y: p.y + Math.sin(targetAng) * 22,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      dmg: p.dmg * dmgMul, life: 0.9, r: 3, color: bulletColor
    });
  }
  for (var f = 0; f < 5 + w.pellets * 2; f++){
    var fa = targetAng + rand(-0.5, 0.5);
    spawnParticle(p.x + Math.cos(targetAng)*24, p.y + Math.sin(targetAng)*24,
                  Math.random() < 0.5 ? '#ffd54f' : '#fff3c4',
                  rand(2,5), rand(0.06,0.15),
                  Math.cos(fa)*rand(80,300), Math.sin(fa)*rand(80,300));
  }
  G.shake = Math.min(G.shake + 2.2 + w.pellets * 0.6, 14);
}

function damageZombie(z, dmg, vx, vy){
  if (z.dead) return;
  z.hp -= dmg;
  z.hitFlash = 0.1;
  if (z.type !== 'tank'){ z.kx += vx * 0.02; z.ky += vy * 0.02; }
  bloodBurst(z.x, z.y, 5, 200);
  addFloater(z.x + rand(-8,8), z.y - z.r - 8, String(Math.round(dmg)), '#ffd54f');
  if (z.hp <= 0) killZombie(z);
}

function killZombie(z){
  if (z.dead) return;
  z.dead = true;
  var mult = G.bloodRound ? 2 : 1;
  G.score += z.score * mult;
  G.kills++;
  G.runCoins += mult;
  SAVE.coins += mult;
  G.shake = Math.min(G.shake + 3, 14);
  bloodBurst(z.x, z.y, 16, 340);
  for (var i = 0; i < 10; i++){
    var a = Math.random() * Math.PI * 2;
    spawnParticle(z.x, z.y, z.dark, rand(3,6), rand(0.4,0.9),
                  Math.cos(a)*rand(30,140), Math.sin(a)*rand(30,140));
  }
  if (G.decals.length > 150) G.decals.shift();
  G.decals.push({ x: z.x + rand(-6,6), y: z.y + rand(-6,6), r: z.r * rand(0.9,1.5), a: rand(0.18,0.34) });

  if (z.type === 'exploder') createExplosion(z.x, z.y);

  if (Math.random() < 0.12 && G.pickups.length < 12){
    G.pickups.push({ x:z.x, y:z.y, r:13, phase:Math.random()*10, life:18, born:0 });
    for (var j = 0; j < 8; j++){
      var aa = Math.random() * Math.PI * 2;
      spawnParticle(z.x, z.y, '#ff6b81', rand(2,4), rand(0.3,0.6),
                    Math.cos(aa)*rand(40,140), Math.sin(aa)*rand(40,140));
    }
  }

  if (Math.random() < POWERUP_DROP_CHANCE && G.powerDrops.length < 10){
    var pk = POWERUP_ORDER[Math.floor(Math.random() * POWERUP_ORDER.length)];
    G.powerDrops.push({ x: z.x, y: z.y, key: pk, r: 15, phase: Math.random()*10, life: 20, born: 0 });
    var pu = POWERUPS[pk];
    for (var q = 0; q < 14; q++){
      var qa = Math.random() * Math.PI * 2;
      spawnParticle(z.x, z.y, pu.color, rand(2,5), rand(0.3,0.7),
                    Math.cos(qa)*rand(50,200), Math.sin(qa)*rand(50,200));
    }
  }

  if (G.kills % 10 === 0) saveGame();
}

function createExplosion(x, y){
  for (var i = 0; i < 46; i++){
    var a = Math.random() * Math.PI * 2;
    var s = rand(80, 420);
    spawnParticle(x, y,
      Math.random() < 0.4 ? '#ff6d00' : (Math.random() < 0.5 ? '#ffab40' : '#ffe082'),
      rand(3, 7), rand(0.4, 0.9), Math.cos(a)*s, Math.sin(a)*s);
  }
  G.shake = Math.min(G.shake + 14, 26);
  var p = G.player;
  var dx = p.x - x, dy = p.y - y;
  var d = Math.hypot(dx, dy);
  var R = 95;
  var dmgMax = 30 * (G.bloodRound ? 2 : 1);
  if (d < R + p.r){
    var dmg = Math.round(dmgMax * (1 - d / (R + p.r)));
    if (dmg > 0) hurtPlayer(dmg);
  }
}

function hurtPlayer(dmg){
  var p = G.player;
  if (p.invuln > 0) return;
  if (p.active.shield > 0){
    p.active.shield = Math.max(0, p.active.shield - 1.5);
    G.shake = Math.min(G.shake + 5, 14);
    for (var i = 0; i < 16; i++){
      var a = Math.random() * Math.PI * 2;
      spawnParticle(p.x, p.y, '#64b5f6', rand(2,4), rand(0.3,0.6),
                    Math.cos(a)*rand(80,240), Math.sin(a)*rand(80,240));
    }
    addFloater(p.x, p.y - 28, '¡BLOQUEADO!', '#64b5f6', 15);
    return;
  }
  p.hp -= dmg;
  p.hurtFlash = 0.3;
  p.invuln = 0.45;
  G.shake = Math.min(G.shake + 9, 22);
  bloodBurst(p.x, p.y, 8, 220);
  if (p.hp <= 0){ p.hp = 0; die(); }
}

function die(){
  G.state = 'dying'; G.deadT = 0; G.shake = 28;
  sticks.move = null; sticks.aim = null;
  G.ebullets.length = 0;
  if (G.score > SAVE.best){ SAVE.best = G.score; G.newRecord = true; }
  else G.newRecord = false;
  if (G.wave > SAVE.bestWave) SAVE.bestWave = G.wave;

  /* Sincronizar power-ups antes de guardar */
  syncPowerupsToSave();

  var p = G.player;
  for (var i = 0; i < 70; i++){
    var a = Math.random() * Math.PI * 2, s = rand(50, 380);
    spawnParticle(p.x, p.y, i % 3 ? '#c62828' : (SAVE.skin.body === 'GOLD' ? '#ffd700' : SAVE.skin.body),
                  rand(2,6), rand(0.6,1.5), Math.cos(a)*s, Math.sin(a)*s);
  }
}

function startWave(){
  G.wave++;
  G.bloodRound = (G.wave % BLOOD_ROUND_EVERY === 0);
  G.spawnQueue = 4 + Math.floor(G.wave * 1.9);
  G.spawnCd = 0.25;
  G.waveTimer = 3.5;
  G.waveMsg = 2.0;
  G.bloodMsg = G.bloodRound ? 3.5 : 0;
}

function pickZombieType(w){
  var roll = Math.random();
  var acc = 0;
  if (w >= 10){ acc += 0.05; if (roll < acc) return 'tank'; }
  if (w >= 8) { acc += 0.05; if (roll < acc) return 'screamer'; }
  if (w >= 6) { acc += 0.09; if (roll < acc) return 'exploder'; }
  if (w >= 5) { acc += 0.08; if (roll < acc) return 'spitter'; }
  if (w >= 4){
    acc += Math.min(0.18, 0.035 * (w - 3));
    if (roll < acc) return 'brute';
  }
  acc += Math.min(0.38, 0.05 + w * 0.035);
  if (roll < acc) return 'runner';
  return 'walker';
}

function spawnZombie(){
  var p = G.player, w = G.wave;
  var type = pickZombieType(w);
  var def = ZDEF[type];
  var bloodMul = G.bloodRound ? 2 : 1;
  var bloodSpd = G.bloodRound ? 1.25 : 1;
  var x = 0, y = 0;
  for (var i = 0; i < 26; i++){
    var a = Math.random() * Math.PI * 2;
    var d = Math.max(W, H) * 0.62 + Math.random() * 240;
    x = p.x + Math.cos(a) * d;
    y = p.y + Math.sin(a) * d;
    if (x > 60 && x < WORLD.w - 60 && y > 60 && y < WORLD.h - 60) break;
  }
  x = clamp(x, 60, WORLD.w - 60);
  y = clamp(y, 60, WORLD.h - 60);
  var hpMul = (1 + (w - 1) * 0.09) * bloodMul;
  var atkRate = 0.9;
  if (type === 'runner') atkRate = 0.7;
  else if (type === 'spitter') atkRate = 1.5;
  else if (type === 'tank') atkRate = 1.4;
  G.zombies.push({
    x: x, y: y, type: type, r: def.r,
    hp: def.hp * hpMul, maxHp: def.hp * hpMul,
    speed: def.speed * (1 + Math.min(0.35, (w - 1) * 0.02)) * bloodSpd,
    dmg: def.dmg * bloodMul,
    atkRate: atkRate, atkCd: 0.6,
    color: def.color, dark: def.dark,
    hitFlash: 0, kx: 0, ky: 0, dead: false,
    phase: Math.random() * 10, score: def.score,
    fireCd: type === 'spitter' ? rand(0.8, 1.6) : 0,
    summonCd: type === 'screamer' ? rand(1.5, 2.6) : 0,
    telegraph: 0
  });
}

function doSummon(z){
  var n = 2 + Math.floor(Math.random() * 2);
  var bloodMul = G.bloodRound ? 2 : 1;
  var bloodSpd = G.bloodRound ? 1.25 : 1;
  for (var i = 0; i < n; i++){
    if (G.zombies.length >= 32) break;
    var a = Math.random() * Math.PI * 2;
    var d = 46 + Math.random() * 30;
    var sx = clamp(z.x + Math.cos(a) * d, 40, WORLD.w - 40);
    var sy = clamp(z.y + Math.sin(a) * d, 40, WORLD.h - 40);
    var def = ZDEF.walker;
    var hpMul = (1 + (G.wave - 1) * 0.09) * bloodMul;
    G.zombies.push({
      x: sx, y: sy, type: 'walker', r: def.r,
      hp: def.hp * hpMul, maxHp: def.hp * hpMul,
      speed: def.speed * (1 + Math.min(0.35, (G.wave - 1) * 0.02)) * bloodSpd,
      dmg: def.dmg * bloodMul, atkRate: 0.9, atkCd: 0.7,
      color: def.color, dark: def.dark,
      hitFlash: 0, kx: 0, ky: 0, dead: false,
      phase: Math.random() * 10, score: def.score,
      fireCd: 0, summonCd: 0, telegraph: 0
    });
    for (var j = 0; j < 12; j++){
      var pa = Math.random() * Math.PI * 2;
      spawnParticle(sx, sy, '#4db6ac', rand(2,4), rand(0.3,0.6),
                    Math.cos(pa)*rand(40,140), Math.sin(pa)*rand(40,140));
    }
  }
  for (var k = 0; k < 18; k++){
    var ka = Math.random() * Math.PI * 2;
    spawnParticle(z.x, z.y, '#26a69a', rand(2,5), rand(0.3,0.6),
                  Math.cos(ka)*rand(80,220), Math.sin(ka)*rand(80,220));
  }
  G.shake = Math.min(G.shake + 4, 14);
}

function update(dt){
  if (!G) return;
  if (G.state === 'menu'){ menuTime += dt; return; }

  if (G.state === 'dying'){
    G.deadT += dt;
    G.shake = Math.max(0, G.shake - dt * 45);
    stepParticles(dt); stepFloaters(dt);
    if (G.deadT > 0.85){
      G.state = 'shop'; G.shopTab = 'mejoras';
      G.shopFrom = 'dead'; G.showStats = true;
    }
    return;
  }
  if (G.state === 'shop'){
    if (G.buyFlash > 0) G.buyFlash -= dt;
    return;
  }

  G.time += dt;
  for (var bj = 0; bj < buttons.length; bj++){
    if (buttons[bj].press > 0) buttons[bj].press -= dt;
  }
  if (G.buyFlash > 0) G.buyFlash -= dt;
  if (G.slotFlashT > 0) G.slotFlashT -= dt;

  var p = G.player;
  var i;

  for (var kk in p.active){
    if (p.active[kk] > 0) p.active[kk] = Math.max(0, p.active[kk] - dt);
  }

  var ix = 0, iy = 0;
  if (sticks.move && sticks.move.mag > 0.12){
    ix = sticks.move.nx; iy = sticks.move.ny;
  } else {
    if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if (keys['KeyW'] || keys['ArrowUp'])    iy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  iy += 1;
    var l = Math.hypot(ix, iy);
    if (l > 1){ ix /= l; iy /= l; }
  }

  var spdMul = p.active.speed > 0 ? 2 : 1;

  p.dashCd = Math.max(0, p.dashCd - dt);
  if (p.dashT > 0){
    p.dashT -= dt;
    p.x += p.dashDX * 920 * dt;
    p.y += p.dashDY * 920 * dt;
    if (Math.random() < 0.85)
      spawnParticle(p.x, p.y, 'rgba(120,190,255,0.5)', rand(2,5), 0.3, rand(-30,30), rand(-30,30));
  } else {
    p.x += ix * p.speed * spdMul * dt;
    p.y += iy * p.speed * spdMul * dt;
    if (spdMul > 1 && (ix !== 0 || iy !== 0) && Math.random() < 0.4){
      spawnParticle(p.x, p.y, 'rgba(67,160,71,0.4)', rand(2,4), 0.35, rand(-20,20), rand(-20,20));
    }
  }
  p.x = clamp(p.x, p.r, WORLD.w - p.r);
  p.y = clamp(p.y, p.r, WORLD.h - p.r);
  updateCamera();

  var firing = false;
  if (sticks.aim && sticks.aim.mag > STICK_DEAD){
    p.aim = Math.atan2(sticks.aim.ny, sticks.aim.nx);
    firing = true;
  } else if (mouse.active){
    p.aim = Math.atan2((mouse.y + G.cam.y) - p.y, (mouse.x + G.cam.x) - p.x);
    firing = mouse.down;
  }

  p.fireCd -= dt;
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.healFlash = Math.max(0, p.healFlash - dt);

  if (p.reloading){
    p.reloadT -= dt;
    if (p.reloadT <= 0){ p.reloading = false; p.mag = p.magSize; }
  }
  if (firing && p.fireCd <= 0 && !p.reloading){
    if (p.mag > 0) shoot();
    else tryReload();
  }

  for (i = G.bullets.length - 1; i >= 0; i--){
    var bl = G.bullets[i];
    bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
    if (bl.life <= 0 || bl.x < 0 || bl.x > WORLD.w || bl.y < 0 || bl.y > WORLD.h){
      G.bullets.splice(i, 1); continue;
    }
    var hit = false;
    for (var j = 0; j < G.zombies.length; j++){
      var zz = G.zombies[j];
      var dx = zz.x - bl.x, dy = zz.y - bl.y, rr2 = zz.r + bl.r;
      if (dx*dx + dy*dy < rr2*rr2){
        damageZombie(zz, bl.dmg, bl.vx, bl.vy); hit = true; break;
      }
    }
    if (hit){
      for (var k2 = 0; k2 < 4; k2++){
        var a2 = Math.atan2(-bl.vy, -bl.vx) + rand(-0.9, 0.9);
        spawnParticle(bl.x, bl.y, '#e53935', rand(1.5,3), rand(0.15,0.35),
                      Math.cos(a2)*rand(60,220), Math.sin(a2)*rand(60,220));
      }
      G.bullets.splice(i, 1);
    }
  }

  for (i = G.ebullets.length - 1; i >= 0; i--){
    var eb = G.ebullets[i];
    eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
    if (eb.life <= 0 || eb.x < 0 || eb.x > WORLD.w || eb.y < 0 || eb.y > WORLD.h){
      G.ebullets.splice(i, 1); continue;
    }
    var edx = p.x - eb.x, edy = p.y - eb.y, err = eb.r + p.r;
    if (edx*edx + edy*edy < err*err){
      hurtPlayer(eb.dmg);
      for (var kk2 = 0; kk2 < 10; kk2++){
        var ea = Math.random() * Math.PI * 2;
        spawnParticle(eb.x, eb.y, '#b388ff', rand(2,4), rand(0.2,0.5),
                      Math.cos(ea)*rand(60,180), Math.sin(ea)*rand(60,180));
      }
      G.ebullets.splice(i, 1);
      continue;
    }
  }

  for (i = 0; i < G.zombies.length; i++){
    var z = G.zombies[i];
    z.hitFlash = Math.max(0, z.hitFlash - dt);
    z.atkCd -= dt;
    z.phase += dt;
    z.x += z.kx * dt; z.y += z.ky * dt;
    var kd = Math.pow(0.00005, dt);
    z.kx *= kd; z.ky *= kd;

    var ddx = p.x - z.x, ddy = p.y - z.y;
    var dist = Math.hypot(ddx, ddy) || 1;
    var touch = z.r + p.r;

    if (z.type === 'spitter'){
      if (dist > 320){
        z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt;
      } else if (dist < 180){
        z.x -= (ddx/dist) * z.speed * dt; z.y -= (ddy/dist) * z.speed * dt;
      } else {
        z.x += (-ddy/dist) * z.speed * 0.55 * dt; z.y += (ddx/dist) * z.speed * 0.55 * dt;
      }
      z.fireCd -= dt;
      if (z.fireCd <= 0 && dist < 460){
        z.fireCd = rand(2.0, 2.6);
        var ang = Math.atan2(ddy, ddx);
        G.ebullets.push({
          x: z.x + Math.cos(ang) * (z.r + 6),
          y: z.y + Math.sin(ang) * (z.r + 6),
          vx: Math.cos(ang) * 250, vy: Math.sin(ang) * 250,
          dmg: z.dmg, r: 5, life: 3.5, color: '#b388ff'
        });
        for (var fk = 0; fk < 10; fk++){
          var fa = ang + rand(-0.6, 0.6);
          spawnParticle(z.x + Math.cos(ang)*z.r, z.y + Math.sin(ang)*z.r,
                        '#d1c4e9', rand(1.5, 3), rand(0.15, 0.3),
                        Math.cos(fa)*rand(60, 180), Math.sin(fa)*rand(60, 180));
        }
      }
    } else if (z.type === 'exploder'){
      if (dist > 1){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
      if (dist < 42) killZombie(z);
    } else if (z.type === 'screamer'){
      if (dist > touch){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
      else if (z.atkCd <= 0 && p.dashT <= 0){ z.atkCd = z.atkRate; hurtPlayer(z.dmg); }
      if (z.telegraph > 0){ z.telegraph -= dt; if (z.telegraph <= 0) doSummon(z); }
      else {
        z.summonCd -= dt;
        if (z.summonCd <= 0 && G.zombies.length < 32){ z.summonCd = rand(4.5, 6.5); z.telegraph = 0.8; }
      }
    } else {
      if (dist > touch){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
      else if (z.atkCd <= 0 && p.dashT <= 0){ z.atkCd = z.atkRate; hurtPlayer(z.dmg); }
    }
    z.x = clamp(z.x, z.r, WORLD.w - z.r);
    z.y = clamp(z.y, z.r, WORLD.h - z.r);
  }

  for (i = 0; i < G.zombies.length; i++){
    for (var m = i + 1; m < G.zombies.length; m++){
      var za = G.zombies[i], zb = G.zombies[m];
      var sx = zb.x - za.x, sy = zb.y - za.y;
      var d2 = sx*sx + sy*sy;
      var minD = za.r + zb.r;
      if (d2 < minD * minD && d2 > 0.01){
        var dd = Math.sqrt(d2);
        var push = (minD - dd) * 0.5;
        sx /= dd; sy /= dd;
        za.x -= sx * push; za.y -= sy * push;
        zb.x += sx * push; zb.y += sy * push;
      }
    }
  }
  for (i = G.zombies.length - 1; i >= 0; i--){
    if (G.zombies[i].dead) G.zombies.splice(i, 1);
  }

  for (i = G.pickups.length - 1; i >= 0; i--){
    var pk = G.pickups[i];
    pk.phase += dt; pk.life -= dt;
    pk.born = Math.min(1, pk.born + dt * 3);
    var pdx = p.x - pk.x, pdy = p.y - pk.y;
    var pd2 = pdx*pdx + pdy*pdy;
    if (pd2 < 110 * 110 && pd2 > 1){
      var pd = Math.sqrt(pd2);
      var pull = (1 - pd/110) * 260;
      pk.x += (pdx/pd) * pull * dt;
      pk.y += (pdy/pd) * pull * dt;
    }
    var touchR = p.r + pk.r;
    if (pd2 < touchR * touchR){
      var healed = Math.min(10, p.maxHp - p.hp);
      if (healed > 0){
        p.hp += healed; p.healFlash = 0.35;
        addFloater(p.x, p.y - 28, '+' + healed, '#4caf50', 18);
      }
      for (var q = 0; q < 14; q++){
        var qa = Math.random() * Math.PI * 2;
        spawnParticle(pk.x, pk.y, Math.random() < 0.5 ? '#4caf50' : '#81c784',
                      rand(2,4), rand(0.3,0.7),
                      Math.cos(qa)*rand(60,200), Math.sin(qa)*rand(60,200));
      }
      G.pickups.splice(i, 1); continue;
    }
    if (pk.life <= 0) G.pickups.splice(i, 1);
  }

  for (i = G.powerDrops.length - 1; i >= 0; i--){
    var pdl = G.powerDrops[i];
    pdl.phase += dt; pdl.life -= dt;
    pdl.born = Math.min(1, pdl.born + dt * 4);
    var ppdx = p.x - pdl.x, ppdy = p.y - pdl.y;
    var ppd2 = ppdx*ppdx + ppdy*ppdy;
    if (ppd2 < 120 * 120 && ppd2 > 1){
      var ppd = Math.sqrt(ppd2);
      var ppull = (1 - ppd/120) * 280;
      pdl.x += (ppdx/ppd) * ppull * dt;
      pdl.y += (ppdy/ppd) * ppull * dt;
    }
    var ptR = p.r + pdl.r;
    if (ppd2 < ptR * ptR){
      var puKey = pdl.key;
      if (p.powerups[puKey] < POWERUP_MAX_STACK){
        p.powerups[puKey]++;
        var pu = POWERUPS[puKey];
        addFloater(p.x, p.y - 28, pu.name, pu.color, 15);
        for (var qi = 0; qi < 16; qi++){
          var qa2 = Math.random() * Math.PI * 2;
          spawnParticle(pdl.x, pdl.y, pu.color, rand(2,4), rand(0.3,0.7),
                        Math.cos(qa2)*rand(60,220), Math.sin(qa2)*rand(60,220));
        }
        /* Persistir inmediatamente al recoger */
        syncPowerupsToSave();
        G.powerDrops.splice(i, 1);
        continue;
      }
    }
    if (pdl.life <= 0) G.powerDrops.splice(i, 1);
  }

  if (G.spawnQueue === 0 && G.zombies.length === 0){
    G.waveTimer -= dt;
    if (G.waveTimer <= 0) startWave();
  } else if (G.spawnQueue > 0){
    G.spawnCd -= dt;
    if (G.spawnCd <= 0){ spawnZombie(); G.spawnQueue--; G.spawnCd = 0.32; }
  }

  if (G.waveMsg > 0) G.waveMsg -= dt;
  if (G.bloodMsg > 0) G.bloodMsg -= dt;
  if (G.hintT > 0) G.hintT -= dt;
  G.shake = Math.max(0, G.shake - dt * 45);
  stepParticles(dt);
  stepFloaters(dt);
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0d0f12';
  ctx.fillRect(0, 0, W, H);
  if (!G) return;

  if (G.state === 'menu'){ drawMenu(); return; }
  if (G.state === 'shop'){ drawShopScreen(); return; }

  var sx = (Math.random() - 0.5) * G.shake;
  var sy = (Math.random() - 0.5) * G.shake;

  ctx.save();
  ctx.translate(-G.cam.x + sx, -G.cam.y + sy);

  ctx.fillStyle = '#16130f';
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  for (var si = 0; si < SCENERY.length; si++){
    var sc = SCENERY[si];
    if (sc.type === 'patch'){
      if (sc.x < G.cam.x - 100 || sc.x > G.cam.x + W + 100 ||
          sc.y < G.cam.y - 100 || sc.y > G.cam.y + H + 100) continue;
      ctx.fillStyle = sc.hue > 0.5
        ? 'rgba(30,26,18,' + sc.a + ')'
        : 'rgba(20,17,12,' + sc.a + ')';
      ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r, 0, 7); ctx.fill();
    }
  }

  var step = 100;
  var vx0 = G.cam.x - 80, vx1 = G.cam.x + W + 80;
  var vy0 = G.cam.y - 80, vy1 = G.cam.y + H + 80;
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = Math.floor(vx0/step)*step; x < vx1; x += step){ ctx.moveTo(x, vy0); ctx.lineTo(x, vy1); }
  for (var y = Math.floor(vy0/step)*step; y < vy1; y += step){ ctx.moveTo(vx0, y); ctx.lineTo(vx1, y); }
  ctx.stroke();

  for (var si2 = 0; si2 < SCENERY.length; si2++){
    var s2 = SCENERY[si2];
    if (s2.type === 'patch') continue;
    if (s2.x < G.cam.x - 120 || s2.x > G.cam.x + W + 120 ||
        s2.y < G.cam.y - 120 || s2.y > G.cam.y + H + 120) continue;
    drawSceneryItem(s2);
  }

  for (var i = 0; i < G.decals.length; i++){
    var d = G.decals[i];
    ctx.fillStyle = 'rgba(90,10,10,' + d.a + ')';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
  }

  for (i = 0; i < G.particles.length; i++){
    var q = G.particles[i];
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (i = 0; i < G.pickups.length; i++){
    var pk = G.pickups[i];
    var fade = pk.life < 4 ? (0.45 + 0.55 * Math.abs(Math.sin(pk.life * 8))) : 1;
    ctx.globalAlpha = Math.min(pk.born, fade);
    var grd = ctx.createRadialGradient(pk.x, pk.y, 0, pk.x, pk.y, 34);
    grd.addColorStop(0, 'rgba(229,57,53,0.35)');
    grd.addColorStop(1, 'rgba(229,57,53,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(pk.x, pk.y, 34, 0, 7); ctx.fill();
    drawHeart(pk.x, pk.y, 11, pk.phase);
    ctx.globalAlpha = 1;
  }

  for (i = 0; i < G.powerDrops.length; i++){
    drawPowerDrop(G.powerDrops[i]);
  }

  for (i = 0; i < G.zombies.length; i++) drawZombie(G.zombies[i]);
  drawPlayer();

  ctx.lineCap = 'round';
  for (i = 0; i < G.bullets.length; i++){
    var b = G.bullets[i];
    ctx.strokeStyle = b.color || '#ffe082';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
    ctx.stroke();
  }

  for (i = 0; i < G.ebullets.length; i++){
    var eb = G.ebullets[i];
    ctx.strokeStyle = 'rgba(179,136,255,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(eb.x, eb.y);
    ctx.lineTo(eb.x - eb.vx * 0.05, eb.y - eb.vy * 0.05);
    ctx.stroke();
    ctx.fillStyle = eb.color;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 0.4, 0, 7); ctx.fill();
  }

  ctx.textAlign = 'center';
  for (i = 0; i < G.floaters.length; i++){
    var f = G.floaters[i];
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    ctx.fillStyle = f.color;
    ctx.font = 'bold ' + f.size + 'px system-ui';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = '#2a3038';
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

  ctx.restore();

  if (G.state === 'playing' && G.player.healFlash > 0){
    ctx.fillStyle = 'rgba(76,175,80,' + (G.player.healFlash * 0.22) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (G.bloodRound && G.state === 'playing'){
    var pulse = 0.08 + Math.sin(G.time * 3) * 0.03;
    ctx.fillStyle = 'rgba(180,0,0,' + pulse + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  if (G.state === 'playing'){
    drawStick(sticks.move, 'rgba(74,144,217,0.55)');
    drawStick(sticks.aim,  'rgba(229,57,53,0.55)');
    drawButtons();
    drawPowerSlots();
    drawHUD();
  }
}

function drawSceneryItem(s){
  ctx.save();
  ctx.translate(s.x, s.y);
  if (s.type === 'rock'){
    ctx.rotate(s.rot);
    ctx.fillStyle = 'rgba(60,55,48,0.85)';
    ctx.beginPath();
    ctx.moveTo(-s.s, 0);
    ctx.lineTo(-s.s*0.5, -s.s*0.8);
    ctx.lineTo(s.s*0.3, -s.s*0.9);
    ctx.lineTo(s.s, -s.s*0.2);
    ctx.lineTo(s.s*0.6, s.s*0.5);
    ctx.lineTo(-s.s*0.4, s.s*0.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(-s.s, 0);
    ctx.lineTo(s.s*0.6, s.s*0.5);
    ctx.lineTo(-s.s*0.4, s.s*0.4);
    ctx.closePath();
    ctx.fill();
  } else if (s.type === 'tree'){
    ctx.rotate(s.rot);
    ctx.strokeStyle = 'rgba(25,18,12,0.9)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, s.s * 0.6); ctx.lineTo(0, -s.s * 0.8);
    ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -s.s * 0.4); ctx.lineTo(-s.s * 0.6, -s.s);
    ctx.moveTo(0, -s.s * 0.55); ctx.lineTo(s.s * 0.5, -s.s * 1.05);
    ctx.moveTo(0, -s.s * 0.7); ctx.lineTo(-s.s * 0.4, -s.s * 1.2);
    ctx.stroke();
  } else if (s.type === 'grave'){
    ctx.rotate(s.rot);
    ctx.fillStyle = 'rgba(70,68,62,0.85)';
    ctx.beginPath();
    rr(-s.s*0.5, -s.s, s.s, s.s * 1.4, s.s * 0.35);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-s.s*0.5, -s.s*0.1, s.s, s.s * 0.1);
    ctx.fillRect(-s.s*0.15, -s.s*0.5, s.s*0.3, s.s*0.35);
  } else if (s.type === 'blood'){
    ctx.fillStyle = 'rgba(80,8,8,' + s.a + ')';
    ctx.beginPath();
    ctx.arc(0, 0, s.r, 0, 7);
    ctx.arc(s.r * 0.6, -s.r * 0.3, s.r * 0.5, 0, 7);
    ctx.arc(-s.r * 0.5, s.r * 0.4, s.r * 0.4, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

function drawPowerIcon(key, x, y, s, color, outline){
  color = color || '#ffffff';
  outline = outline || 'rgba(0,0,0,0.55)';
  ctx.save();
  ctx.translate(x, y);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  var lw = Math.max(1, s * 0.13);

  if (key === 'shield'){
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.95);
    ctx.lineTo(s * 0.78, -s * 0.68);
    ctx.lineTo(s * 0.78, s * 0.05);
    ctx.quadraticCurveTo(s * 0.78, s * 0.72, 0, s * 0.98);
    ctx.quadraticCurveTo(-s * 0.78, s * 0.72, -s * 0.78, s * 0.05);
    ctx.lineTo(-s * 0.78, -s * 0.68);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = outline;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.lineWidth = Math.max(1.5, s * 0.22);
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.52); ctx.lineTo(0, s * 0.55);
    ctx.moveTo(-s * 0.34, -s * 0.02); ctx.lineTo(s * 0.34, -s * 0.02);
    ctx.stroke();
  }
  else if (key === 'dash'){
    ctx.beginPath();
    ctx.moveTo(s * 0.22, -s);
    ctx.lineTo(-s * 0.55, s * 0.1);
    ctx.lineTo(-s * 0.08, s * 0.1);
    ctx.lineTo(-s * 0.22, s);
    ctx.lineTo(s * 0.55, -s * 0.1);
    ctx.lineTo(s * 0.08, -s * 0.1);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = outline;
    ctx.stroke();
  }
  else if (key === 'damage'){
    function sword(rot){
      ctx.save();
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(-s * 0.12, -s * 0.55);
      ctx.lineTo(-s * 0.12, s * 0.42);
      ctx.lineTo(s * 0.12, s * 0.42);
      ctx.lineTo(s * 0.12, -s * 0.55);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      ctx.lineWidth = lw * 0.85; ctx.strokeStyle = outline; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.12, -s * 0.55);
      ctx.lineTo(0, -s * 0.98);
      ctx.lineTo(s * 0.12, -s * 0.55);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.rect(-s * 0.42, s * 0.42, s * 0.84, s * 0.14);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.rect(-s * 0.09, s * 0.56, s * 0.18, s * 0.32);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    sword(-Math.PI * 0.28);
    sword(Math.PI * 0.72);
  }
  else if (key === 'speed'){
    ctx.fillStyle = color;
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.98);
    ctx.lineTo(-s * 0.68, -s * 0.26);
    ctx.lineTo(-s * 0.28, -s * 0.26);
    ctx.lineTo(-s * 0.28, s * 0.02);
    ctx.lineTo(s * 0.28, s * 0.02);
    ctx.lineTo(s * 0.28, -s * 0.26);
    ctx.lineTo(s * 0.68, -s * 0.26);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, s * 0.06);
    ctx.lineTo(-s * 0.68, s * 0.72);
    ctx.lineTo(-s * 0.28, s * 0.72);
    ctx.lineTo(-s * 0.28, s * 1.0);
    ctx.lineTo(s * 0.28, s * 1.0);
    ctx.lineTo(s * 0.28, s * 0.72);
    ctx.lineTo(s * 0.68, s * 0.72);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  else if (key === 'fireRate'){
    var teeth = 8;
    var rIn = s * 0.62;
    var rOut = s * 0.95;
    var toothW = s * 0.28;
    ctx.fillStyle = color;
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw * 0.8;
    for (var i = 0; i < teeth; i++){
      var a = (i / teeth) * Math.PI * 2;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.rect(-toothW / 2, -rOut, toothW, rOut - rIn + s * 0.05);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, rIn, 0, 7);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.26, 0, 7);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fill();
  }

  ctx.restore();
}

function drawPowerDrop(pdl){
  var pu = POWERUPS[pdl.key];
  var fade = pdl.life < 4 ? (0.45 + 0.55 * Math.abs(Math.sin(pdl.life * 8))) : 1;
  ctx.globalAlpha = Math.min(pdl.born, fade);
  var fl = Math.sin(pdl.phase * 4) * 3;
  var x = pdl.x, y = pdl.y + fl;

  var grd = ctx.createRadialGradient(x, y, 0, x, y, 42);
  grd.addColorStop(0, pu.color + '99');
  grd.addColorStop(1, pu.color + '00');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(x, y, 42, 0, 7); ctx.fill();

  ctx.beginPath(); ctx.arc(x, y, pdl.r, 0, 7);
  ctx.fillStyle = pu.color2;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = pu.color;
  ctx.stroke();

  drawPowerIcon(pdl.key, x, y, pdl.r * 0.85, '#ffffff', 'rgba(0,0,0,0.6)');

  ctx.globalAlpha = 1;
}

function drawHeart(x, y, s, phase){
  var pulse = 1 + Math.sin(phase * 5) * 0.12;
  s *= pulse;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.arc(-s*0.34, -s*0.20, s*0.50, 0, Math.PI*2);
  ctx.arc( s*0.34, -s*0.20, s*0.50, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*0.80, -s*0.06);
  ctx.lineTo( s*0.80, -s*0.06);
  ctx.lineTo(0, s*0.92);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7f1010';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s*0.80, -s*0.06);
  ctx.lineTo(0, s*0.92);
  ctx.lineTo( s*0.80, -s*0.06);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.arc(-s*0.30, -s*0.36, s*0.16, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCoin(x, y, r){
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = '#ffd54f'; ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = Math.max(1.5, r * 0.22); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, 7);
  ctx.fillStyle = 'rgba(184,134,11,0.75)'; ctx.fill();
}

function drawHatShape(r, hat, accent){
  if (hat === 1){
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.16, r * 0.22, 0, 7); ctx.fill();
  } else if (hat === 2){
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.88, -Math.PI * 0.55, Math.PI * 0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = darken(accent, 0.35);
    ctx.beginPath();
    ctx.ellipse(r * 0.94, 0, r * 0.42, r * 0.55, 0, 0, 7);
    ctx.fill();
  } else if (hat === 3){
    ctx.fillStyle = accent;
    ctx.fillRect(-r, -r * 0.28, r * 2, r * 0.56);
    ctx.beginPath(); ctx.arc(-r * 0.92, 0, r * 0.32, 0, 7); ctx.fill();
  } else if (hat === 4){
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(r * 0.15, -r * 0.62); ctx.lineTo(r * 0.95, -r * 1.05); ctx.lineTo(r * 0.52, -r * 0.35);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.15, r * 0.62); ctx.lineTo(r * 0.95, r * 1.05); ctx.lineTo(r * 0.52, r * 0.35);
    ctx.closePath(); ctx.fill();
  }
}

function paintBody(radius, bodyColor){
  if (bodyColor === 'GOLD'){
    var g = ctx.createLinearGradient(-radius, -radius, radius, radius);
    var t = (Math.sin(menuTime * 3) * 0.5 + 0.5);
    g.addColorStop(0, '#fff7c2');
    g.addColorStop(0.3 + t * 0.2, '#ffd700');
    g.addColorStop(0.7 + t * 0.1, '#daa520');
    g.addColorStop(1, '#8b6914');
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = bodyColor;
  }
}

function drawCharacter(x, y, r, bodyColor, hat, aim){
  var accent = darken(bodyColor, 0.42);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.32, r * 1.05, r * 0.85, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.translate(x, y); ctx.rotate(aim);
  ctx.fillStyle = '#22262e';
  rr(r * 0.2, -3.5, 24 * (r / 15), 7 * (r / 15), 2);
  ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  paintBody(r, bodyColor);
  ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.2);
  ctx.strokeStyle = accent; ctx.stroke();
  if (hat > 0){
    ctx.save();
    ctx.translate(x, y); ctx.rotate(aim);
    drawHatShape(r, hat, accent);
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.arc(x + Math.cos(aim) * r * 0.55, y + Math.sin(aim) * r * 0.55, Math.max(2.5, r * 0.22), 0, 7);
  ctx.fill();
}

function drawHatButtonContent(cx, cy, r, hat, bodyColor){
  var accent = darken(bodyColor, 0.42);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
  paintBody(r, bodyColor);
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.2);
  ctx.strokeStyle = accent; ctx.stroke();
  if (hat > 0){
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2);
    drawHatShape(r, hat, accent);
    ctx.restore();
  }
}

function drawPlayer(){
  var p = G.player;
  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 5, p.r*1.05, p.r*0.85, 0, 0, 7); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(Math.cos(p.aim)*26, Math.sin(p.aim)*26);
  ctx.lineTo(Math.cos(p.aim)*240, Math.sin(p.aim)*240);
  ctx.stroke();

  var rx = Math.cos(p.aim) * 150, ry = Math.sin(p.aim) * 150;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(rx, ry, 9, 0, 7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rx - 14, ry); ctx.lineTo(rx - 5, ry);
  ctx.moveTo(rx + 5, ry);  ctx.lineTo(rx + 14, ry);
  ctx.moveTo(rx, ry - 14); ctx.lineTo(rx, ry - 5);
  ctx.moveTo(rx, ry + 5);  ctx.lineTo(rx, ry + 14);
  ctx.stroke();

  ctx.save();
  ctx.rotate(p.aim);
  ctx.fillStyle = '#22262e';
  rr(p.r*0.2, -3.5, 24, 7, 2); ctx.fill();
  ctx.restore();

  var hurt = p.hurtFlash > 0 && Math.floor(p.hurtFlash * 26) % 2 === 0;
  var inv = (p.invuln > 0 && p.active.shield <= 0 && !hurt);
  var bodyCol = hurt ? '#ff6b6b' : (p.healFlash > 0 ? '#66bb6a' : SAVE.skin.body);
  var accent  = hurt ? '#ffb3b3' : darken(SAVE.skin.body, 0.42);

  ctx.globalAlpha = inv ? 0.55 : 1;
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7);
  if (hurt || p.healFlash > 0) ctx.fillStyle = bodyCol;
  else paintBody(p.r, SAVE.skin.body);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = accent;
  ctx.stroke();

  if (!hurt && SAVE.skin.hat > 0){
    ctx.save();
    ctx.rotate(p.aim);
    drawHatShape(p.r, SAVE.skin.hat, accent);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  if (p.active.shield > 0){
    var sp = 0.6 + Math.sin(G.time * 6) * 0.4;
    var shR = p.r + 8 + Math.sin(G.time * 4) * 2;
    ctx.strokeStyle = 'rgba(100,181,246,' + (0.8 * sp) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, shR, 0, 7); ctx.stroke();
    var g2 = ctx.createRadialGradient(0, 0, p.r, 0, 0, p.r + 16);
    g2.addColorStop(0, 'rgba(100,181,246,0)');
    g2.addColorStop(1, 'rgba(100,181,246,' + (0.35 * sp) + ')');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 16, 0, 7); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.arc(Math.cos(p.aim)*p.r*0.55, Math.sin(p.aim)*p.r*0.55, Math.max(2.5, p.r*0.22), 0, 7);
  ctx.fill();

  ctx.restore();
}

function drawZombie(z){
  var a = Math.atan2(G.player.y - z.y, G.player.x - z.x);
  var bob = 1 + Math.sin(z.phase * 9) * 0.045;
  var extraGlow = 0;
  var bodyScale = bob;

  if (z.type === 'exploder'){
    var pdx = G.player.x - z.x, pdy = G.player.y - z.y;
    var pd = Math.hypot(pdx, pdy);
    var urgency = clamp(1 - pd / 260, 0, 1);
    bodyScale = 1 + Math.sin(z.phase * (10 + urgency * 22)) * (0.06 + urgency * 0.14);
    extraGlow = urgency * 0.9;
  }
  if (z.type === 'spitter' && z.fireCd < 0.55) extraGlow = Math.max(extraGlow, (0.55 - z.fireCd) * 1.6);
  if (z.type === 'screamer' && z.telegraph > 0) extraGlow = Math.max(extraGlow, z.telegraph / 0.8);
  if (G.bloodRound) extraGlow = Math.max(extraGlow, 0.5 + Math.sin(z.phase * 4) * 0.15);

  ctx.save();
  ctx.translate(z.x, z.y);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 5, z.r*1.05, z.r*0.85, 0, 0, 7); ctx.fill();

  if (extraGlow > 0){
    var glowCol = G.bloodRound ? '255,30,30' :
                  z.type === 'exploder' ? '255,112,67' :
                  z.type === 'spitter'  ? '179,136,255' : '38,166,154';
    var grd = ctx.createRadialGradient(0, 0, z.r * 0.4, 0, 0, z.r * 2.3);
    grd.addColorStop(0, 'rgba(' + glowCol + ',' + (extraGlow * 0.5) + ')');
    grd.addColorStop(1, 'rgba(' + glowCol + ',0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, z.r * 2.3, 0, 7); ctx.fill();
  }

  ctx.save();
  ctx.rotate(a);
  ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : (G.bloodRound ? '#3a0a0a' : z.dark);
  ctx.beginPath(); ctx.arc(z.r*0.75, -z.r*0.6, z.r*0.32, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r*0.75,  z.r*0.6, z.r*0.32, 0, 7); ctx.fill();
  ctx.restore();

  ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : (G.bloodRound ? '#8b1010' : z.color);
  ctx.beginPath(); ctx.arc(0, 0, z.r * bodyScale, 0, 7); ctx.fill();
  ctx.lineWidth = z.type === 'tank' ? 5 : 3;
  ctx.strokeStyle = z.hitFlash > 0 ? '#ffffff' : (G.bloodRound ? '#3a0a0a' : z.dark);
  ctx.stroke();

  if (z.type === 'tank'){
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(0, 0, z.r * 0.72, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, z.r * 0.46, 0, 7); ctx.stroke();
  }

  ctx.save();
  ctx.rotate(a);
  ctx.fillStyle = G.bloodRound ? '#ffeb3b' : '#ff5252';
  ctx.beginPath(); ctx.arc(z.r*0.45, -z.r*0.32, z.r*0.13, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r*0.45,  z.r*0.32, z.r*0.13, 0, 7); ctx.fill();
  ctx.restore();

  if (z.type === 'spitter'){
    ctx.save(); ctx.rotate(a);
    var mouthPulse = z.fireCd < 0.55 ? (0.55 - z.fireCd) * 1.8 : 0;
    ctx.fillStyle = '#d1c4e9';
    ctx.beginPath(); ctx.arc(z.r * 0.78, 0, z.r * (0.18 + mouthPulse * 0.16), 0, 7); ctx.fill();
    ctx.restore();
  }

  if (z.type === 'screamer' && z.telegraph > 0){
    var t = 1 - z.telegraph / 0.8;
    ctx.strokeStyle = 'rgba(38,166,154,' + Math.max(0, 1 - t) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, z.r + 10 + t * 40, 0, 7); ctx.stroke();
  }

  ctx.restore();

  if (z.hp < z.maxHp){
    var bw = z.r * 2.2, bh = 4;
    var bx = z.x - bw/2, by = z.y - z.r - 13;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(bx, by, bw, bh, 2); ctx.fill();
    var hpFrac = z.hp / z.maxHp;
    ctx.fillStyle = hpFrac > 0.5 ? '#e53935' : (hpFrac > 0.25 ? '#ff7043' : '#b71c1c');
    rr(bx, by, bw * hpFrac, bh, 2); ctx.fill();
  }
}

function drawStick(s, color){
  if (!s) return;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_MAX, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_MAX, 0, 7); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(s.ox + s.dx, s.oy + s.dy, 26, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawButtons(){
  var p = G ? G.player : null;
  if (buttons[0]){
    buttons[0].cd  = (p && p.reloading) ? p.reloadT : 0;
    buttons[0].max = p ? p.reloadTime : 1;
  }
  for (var i = 0; i < buttons.length; i++){
    var b = buttons[i];
    var ready = b.cd <= 0.001;
    ctx.save();
    ctx.globalAlpha = ready ? 0.95 : 0.45;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
    ctx.fillStyle = b.press > 0 ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.09)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.stroke();
    if (!ready){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - b.cd/b.max));
      ctx.strokeStyle = '#64b5f6'; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y + 1);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
}

function drawPowerSlots(){
  if (!G) return;
  var p = G.player;
  for (var i = 0; i < 5; i++){
    var slot = powerSlots[i];
    var key = POWERUP_ORDER[i];
    var pu = POWERUPS[key];
    var count = p.powerups[key];
    var activeT = p.active[key] || 0;
    var hasActive = activeT > 0;
    var flash = (G.slotFlashKey === key && G.slotFlashT > 0) ? (G.slotFlashT / 0.4) : 0;

    ctx.beginPath(); ctx.arc(slot.x, slot.y, slot.r, 0, 7);
    if (hasActive) ctx.fillStyle = pu.color2 + 'cc';
    else if (count > 0) ctx.fillStyle = pu.color2 + '99';
    else ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();

    ctx.strokeStyle = hasActive ? pu.color :
                     (count > 0 ? pu.color : 'rgba(255,255,255,0.15)');
    ctx.lineWidth = hasActive ? 3 : 1.5;
    ctx.beginPath(); ctx.arc(slot.x, slot.y, slot.r, 0, 7); ctx.stroke();

    if (flash > 0){
      ctx.strokeStyle = 'rgba(255,255,255,' + flash + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, slot.r + 4 * (1 - flash), 0, 7); ctx.stroke();
    }

    var iconColor = (count > 0 || hasActive) ? '#ffffff' : 'rgba(255,255,255,0.32)';
    var iconOutline = (count > 0 || hasActive) ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.35)';
    drawPowerIcon(key, slot.x, slot.y, slot.r * 0.82, iconColor, iconOutline);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = 'bold ' + (slot.r * 0.55) + 'px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), slot.x - slot.r * 0.85, slot.y - slot.r * 0.85);

    if (count > 0 && !hasActive){
      var bx = slot.x + slot.r * 0.82;
      var by = slot.y + slot.r * 0.82;
      ctx.beginPath(); ctx.arc(bx, by, slot.r * 0.48, 0, 7);
      ctx.fillStyle = '#e53935';
      ctx.fill();
      ctx.strokeStyle = '#7f1010';
      ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + (slot.r * 0.68) + 'px system-ui';
      ctx.fillText(String(count), bx, by + 1);
    }

    if (hasActive && pu.duration > 0){
      var pct = activeT / pu.duration;
      ctx.beginPath();
      ctx.arc(slot.x, slot.y, slot.r + 4, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * pct);
      ctx.strokeStyle = pu.color;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
  }
  ctx.textBaseline = 'alphabetic';
}

function drawSilhouetteZombie(x, y, s, seedIdx){
  var sway = Math.sin(menuTime * 1.6 + seedIdx) * 0.06;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(sway);
  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.arc(0, -s * 0.35, s * 0.36, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -s * 1.05, s * 0.30, 0, 7); ctx.fill();
  var armSwing = Math.sin(menuTime * 2 + seedIdx * 1.3) * 0.3;
  ctx.save();
  ctx.translate(-s * 0.20, -s * 0.55);
  ctx.rotate(-0.9 + armSwing);
  ctx.fillRect(-s * 0.07, -s * 0.5, s * 0.14, s * 0.6);
  ctx.restore();
  ctx.save();
  ctx.translate(s * 0.20, -s * 0.55);
  ctx.rotate(0.9 - armSwing);
  ctx.fillRect(-s * 0.07, -s * 0.5, s * 0.14, s * 0.6);
  ctx.restore();
  ctx.restore();
}

function drawMenu(){
  uiRects = [];
  var small = Math.min(W, H) < 420;

  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0,    '#050308');
  bg.addColorStop(0.35, '#180608');
  bg.addColorStop(0.70, '#2a0a0a');
  bg.addColorStop(1,    '#0a0508');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  var moonR = Math.min(W, H) * 0.26;
  var moonX = W * 0.5, moonY = H * 0.42;
  var glowR = moonR * 3.2;
  var glow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, glowR);
  glow.addColorStop(0, 'rgba(229,57,53,0.45)');
  glow.addColorStop(0.35, 'rgba(160,25,25,0.18)');
  glow.addColorStop(1, 'rgba(120,15,15,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(moonX, moonY, glowR, 0, 7); ctx.fill();

  var mg = ctx.createRadialGradient(
    moonX - moonR * 0.35, moonY - moonR * 0.35, moonR * 0.1,
    moonX, moonY, moonR);
  mg.addColorStop(0, '#ff6b4a');
  mg.addColorStop(0.55, '#c62828');
  mg.addColorStop(0.85, '#7f1010');
  mg.addColorStop(1, '#3a0a0a');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 7); ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.arc(moonX - moonR * 0.32, moonY - moonR * 0.18, moonR * 0.20, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + moonR * 0.28, moonY + moonR * 0.10, moonR * 0.14, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX - moonR * 0.08, moonY + moonR * 0.42, moonR * 0.11, 0, 7); ctx.fill();

  var skyY = H * 0.72;
  ctx.fillStyle = '#050305';
  var bx = 0;
  var seed = 12345;
  while (bx < W){
    seed = (seed * 9301 + 49297) % 233280;
    var r = seed / 233280;
    var bw = 24 + r * 70;
    var bh = 40 + ((seed * 7) % 100);
    ctx.fillRect(bx, skyY - bh, bw, bh + 10);
    ctx.fillStyle = 'rgba(200,60,40,0.35)';
    for (var wy = skyY - bh + 8; wy < skyY - 8; wy += 14){
      for (var wx = bx + 6; wx < bx + bw - 6; wx += 12){
        seed = (seed * 9301 + 49297) % 233280;
        if ((seed / 233280) < 0.28) ctx.fillRect(wx, wy, 4, 6);
      }
    }
    ctx.fillStyle = '#050305';
    bx += bw + 4;
  }

  var groundY = skyY;
  var gg = ctx.createLinearGradient(0, groundY, 0, H);
  gg.addColorStop(0, '#120405');
  gg.addColorStop(1, '#000000');
  ctx.fillStyle = gg;
  ctx.fillRect(0, groundY, W, H - groundY);

  var hordeY = groundY + 12;
  for (var i2 = 0; i2 < 14; i2++){
    seed = (seed * 9301 + 49297) % 233280;
    var r2 = seed / 233280;
    var hx = (i2 + 0.3 + r2 * 0.4) * (W / 14);
    var sway = Math.sin(menuTime * (1.2 + r2 * 0.6) + i2) * 3;
    var hsize = 12 + r2 * 14;
    var bob = Math.sin(menuTime * 2 + i2 * 1.4) * 2;
    drawSilhouetteZombie(hx + sway, hordeY + bob, hsize, i2);
  }

  var titleSize = Math.min(W * 0.11, H * 0.17, 96);
  var titleY = H * 0.26;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.font = '900 ' + titleSize + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(GAME_TITLE, W/2 + 4, titleY + 4);

  ctx.save();
  ctx.shadowColor = 'rgba(229,57,53,0.9)';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#8b1010';
  ctx.fillText(GAME_TITLE, W/2, titleY);
  ctx.restore();

  var tg = ctx.createLinearGradient(0, titleY - titleSize * 0.6, 0, titleY + titleSize * 0.6);
  tg.addColorStop(0, '#fff5e0');
  tg.addColorStop(0.45, '#ffb088');
  tg.addColorStop(0.7, '#e53935');
  tg.addColorStop(1, '#7f1010');
  ctx.fillStyle = tg;
  ctx.fillText(GAME_TITLE, W/2, titleY);

  ctx.font = '700 ' + (small ? 10 : 13) + 'px system-ui';
  ctx.fillStyle = 'rgba(200,180,180,0.7)';
  ctx.fillText(GAME_SUBTITLE, W/2, titleY + titleSize * 0.72);

  var lineW = Math.min(W * 0.5, 340);
  var lgrad = ctx.createLinearGradient(W/2 - lineW/2, 0, W/2 + lineW/2, 0);
  lgrad.addColorStop(0, 'rgba(229,57,53,0)');
  lgrad.addColorStop(0.5, 'rgba(229,57,53,0.7)');
  lgrad.addColorStop(1, 'rgba(229,57,53,0)');
  ctx.strokeStyle = lgrad; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(W/2 - lineW/2, titleY + titleSize * 0.9);
  ctx.lineTo(W/2 + lineW/2, titleY + titleSize * 0.9);
  ctx.stroke();

  var statsY = titleY + titleSize * 0.9 + (small ? 20 : 26);
  ctx.font = '700 ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillStyle = 'rgba(160,160,160,0.85)';
  ctx.fillText('RÉCORD', W/2 - (small ? 70 : 100), statsY);
  ctx.font = '900 ' + (small ? 17 : 21) + 'px system-ui';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(fmt(SAVE.best), W/2 - (small ? 70 : 100), statsY + (small ? 17 : 21));
  if (SAVE.bestWave > 0){
    ctx.font = '700 ' + (small ? 9 : 11) + 'px system-ui';
    ctx.fillStyle = 'rgba(160,160,160,0.7)';
    ctx.fillText('OLEADA ' + SAVE.bestWave, W/2 - (small ? 70 : 100), statsY + (small ? 32 : 40));
  }

  ctx.font = '700 ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillStyle = 'rgba(160,160,160,0.85)';
  ctx.fillText('MONEDAS', W/2 + (small ? 70 : 100), statsY);
  var coinTxt = fmt(SAVE.coins);
  ctx.font = '900 ' + (small ? 17 : 21) + 'px system-ui';
  var ctw2 = ctx.measureText(coinTxt).width;
  var cR2 = small ? 7 : 9;
  var cSx2 = W/2 + (small ? 70 : 100) - (ctw2 + cR2*2 + 8) / 2;
  drawCoin(cSx2 + cR2, statsY + (small ? 11 : 13), cR2);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(coinTxt, cSx2 + cR2*2 + 8, statsY + (small ? 17 : 21));
  ctx.textAlign = 'center';

  var btnGap = small ? 10 : 14;
  var btnW = Math.min((W - btnGap * 3) / 2, small ? 180 : 240);
  var btnH = small ? 42 : 52;
  var totalBtnW = btnW * 2 + btnGap;
  var btnStartX = (W - totalBtnW) / 2;
  var btnY = H - (small ? 60 : 78);

  function drawBtn(bx, label, bgCol, borderCol, key){
    var pg = ctx.createLinearGradient(0, btnY, 0, btnY + btnH);
    pg.addColorStop(0, bgCol[0]);
    pg.addColorStop(1, bgCol[1]);
    ctx.fillStyle = pg;
    rr(bx, btnY, btnW, btnH, 12); ctx.fill();
    ctx.strokeStyle = borderCol;
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + (small ? 15 : 18) + 'px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + btnW/2, btnY + btnH/2 + 1);
    uiRects.push({ x: bx, y: btnY, w: btnW, h: btnH, key: key });
  }

  var playPulse = 1 + Math.sin(menuTime * 3) * 0.02;
  ctx.save();
  ctx.translate(btnStartX + btnW/2, btnY + btnH/2);
  ctx.scale(playPulse, playPulse);
  ctx.translate(-(btnStartX + btnW/2), -(btnY + btnH/2));
  drawBtn(btnStartX, 'JUGAR', ['#e53935', '#8b1010'], 'rgba(255,150,150,0.4)', 'play');
  ctx.restore();

  drawBtn(btnStartX + btnW + btnGap, 'TIENDA', ['#7e57c2', '#4a2a8a'], 'rgba(200,160,255,0.4)', 'shop');

  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 10px system-ui';
  ctx.fillStyle = 'rgba(120,120,120,0.45)';
  ctx.textAlign = 'right';
  ctx.fillText('v1.2', W - 10, H - 8);
  ctx.textAlign = 'center';
}

  else if (G.shopTab === 'armas') contentH = WEAPON_ORDER.length * (small ? 44 : 52);
  else if (G.shopTab === 'aspectos') contentH = (small ? 150 : 180);

  ctx.strokeStyle = 'rgba(229,57,53,0.55)';
  ctx.lineWidth = 2; ctx.stroke();

  var cursorY = py + (small ? 12 : 16);
  if (hasStats){
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e53935';

    ctx.fillText('HAS MUERTO', px + 16, cursorY + (small ? 16 : 20));

    if (G.newRecord){

      ctx.font = '900 ' + (small ? 10 : 12) + 'px system-ui';
