var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d', { alpha:false });
var W = 0, H = 0, DPR = 1, vignette = null;

function measureViewport(){
  var w = 0, h = 0;
  if (window.visualViewport && window.visualViewport.width && window.visualViewport.height){
    w = window.visualViewport.width; h = window.visualViewport.height;
  }
  if (!w || !h){
    w = window.innerWidth || document.documentElement.clientWidth || 0;
    h = window.innerHeight || document.documentElement.clientHeight || 0;
  }
  if (!w || !h){ w = window.outerWidth || 480; h = window.outerHeight || 320; }
  return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
}
function resize(){
  var vp = measureViewport();
  if (vp.w === W && vp.h === H && canvas.width){ updateRotateUI(); layoutUI(); return; }
  W = vp.w; H = vp.h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.30, W/2, H/2, Math.max(W,H)*0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.72)');
  layoutUI();
  updateRotateUI();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 60); setTimeout(resize, 260); });
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
setInterval(function(){
  var vp = measureViewport();
  if (vp.w !== W || vp.h !== H) resize();
}, 400);

function isPortrait(){ return H > W * 1.05; }
function updateRotateUI(){
  if (isPortrait() && W > 0 && H > 0) rotateEl.classList.add('on');
  else rotateEl.classList.remove('on');
}
function lockLandscape(){
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  var p = fs ? fs.call(el) : null;
  function tryLock(){
    if (screen.orientation && screen.orientation.lock){
      var r = screen.orientation.lock('landscape');
      if (r && r.catch) r.catch(function(){});
    }
    setTimeout(resize, 200); setTimeout(resize, 600);
  }
  if (p && p.then) p.then(tryLock).catch(function(){ tryLock(); });
  else tryLock();
}
fsBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); lockLandscape(); });

function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function rand(a,b){ return a + Math.random() * (b - a); }
function angleDiff(a,b){
  var d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function fmt(n){
  var s = String(Math.floor(n)), out = '';
  while (s.length > 3){ out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}
function rr(x,y,w,h,r){
  r = Math.max(0, Math.min(r, Math.min(Math.abs(w), Math.abs(h)) / 2));
  if (w < 0){ x += w; w = -w; }
  if (h < 0){ y += h; h = -h; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function hexByte(v){ v = Math.max(0, Math.min(255, Math.round(v))); var s = v.toString(16); return s.length < 2 ? '0' + s : s; }
function darken(hex, amount){
  if (hex === 'GOLD') return '#8b6914';
  if (!hex || hex.length < 7) return '#222222';
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  r *= (1 - amount); g *= (1 - amount); b *= (1 - amount);
  return '#' + hexByte(r) + hexByte(g) + hexByte(b);
}

function loadSaveLocal(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d) return;
    if (typeof d.coins === 'number') SAVE.coins = Math.max(0, d.coins | 0);
    if (typeof d.best === 'number') SAVE.best = Math.max(0, d.best | 0);
    if (typeof d.bestWave === 'number') SAVE.bestWave = Math.max(0, d.bestWave | 0);
    SAVE.goldenUnlocked = !!d.goldenUnlocked;
    SAVE.codeUsed = !!d.codeUsed;
    SAVE.rebirths = Math.max(0, d.rebirths | 0);
    if (d.up){
      SAVE.up.speed = Math.max(0, d.up.speed | 0);
      SAVE.up.reload = Math.max(0, d.up.reload | 0);
      SAVE.up.mag = Math.max(0, d.up.mag | 0);
      SAVE.up.fire = Math.max(0, d.up.fire | 0);
      SAVE.up.damage = Math.max(0, d.up.damage | 0);
    }
    if (d.skin){
      if (typeof d.skin.body === 'string' &&
          (/^#[0-9a-fA-F]{6}$/.test(d.skin.body) || d.skin.body === 'GOLD'))
        SAVE.skin.body = d.skin.body;
      SAVE.skin.hat = Math.max(0, Math.min(4, d.skin.hat | 0));
    }
    if (d.ownedSkins){ SAVE.ownedSkins = {}; for (var sk in d.ownedSkins){ if (d.ownedSkins[sk]) SAVE.ownedSkins[sk] = true; } }
    SAVE.ownedSkins['#4a90d9'] = true;
    if (SAVE.skin.body && SAVE.skin.body !== 'GOLD') SAVE.ownedSkins[SAVE.skin.body] = true;
    if (d.ownedHats){ SAVE.ownedHats = {}; for (var hk in d.ownedHats){ if (d.ownedHats[hk]) SAVE.ownedHats[String(hk)] = true; } }
    SAVE.ownedHats['0'] = true;
    SAVE.ownedHats[String(SAVE.skin.hat)] = true;
    if (d.ownedWeapons){
      SAVE.ownedWeapons = { pistol:true };
      for (var k in d.ownedWeapons){ if (d.ownedWeapons[k] && WEAPONS[k]) SAVE.ownedWeapons[k] = true; }
    }
    if (d.currentWeapon && WEAPONS[d.currentWeapon] && SAVE.ownedWeapons[d.currentWeapon])
      SAVE.currentWeapon = d.currentWeapon;
    if (d.ownedWeaponSkins){
      SAVE.ownedWeaponSkins = { default:true };
      for (var wsk in d.ownedWeaponSkins){
        if (d.ownedWeaponSkins[wsk] && WEAPON_SKINS[wsk]) SAVE.ownedWeaponSkins[wsk] = true;
      }
    }
    SAVE.ownedWeaponSkins['default'] = true;
    if (typeof d.currentWeaponSkin === 'string' && WEAPON_SKINS[d.currentWeaponSkin])
      SAVE.currentWeaponSkin = d.currentWeaponSkin;
    if (d.ownedBackgrounds){
      SAVE.ownedBackgrounds = { cemetery:true };
      for (var bgk in d.ownedBackgrounds){ if (d.ownedBackgrounds[bgk] && BACKGROUNDS[bgk]) SAVE.ownedBackgrounds[bgk] = true; }
    }
    SAVE.ownedBackgrounds['cemetery'] = true;
    if (typeof d.currentBackground === 'string' && BACKGROUNDS[d.currentBackground] && SAVE.ownedBackgrounds[d.currentBackground])
      SAVE.currentBackground = d.currentBackground;
    if (d.savedPowerups && typeof d.savedPowerups === 'object'){
      SAVE.savedPowerups = {
        shield: Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.shield | 0)),
        dash: Math.max(0, Math.min(POWERUP_MAX_STACK, d.savedPowerups.dash | 0)),

function initFirebase(){
  if (typeof firebase === 'undefined') return false;
  try {
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    cloudReady = true;

  } catch(e){

function cloudSave(){
  if (!cloudReady || !currentUser || !fbDb) return;
  fbDb.collection('users').doc(currentUser.uid).set({
    save: SAVE, email: currentUser.email || '', updatedAt: Date.now()
  }, { merge: true }).catch(function(e){ console.warn('cloudSave:', e); });
}
function cloudLoad(){
  if (!cloudReady || !currentUser || !fbDb) return Promise.resolve(false);
  return fbDb.collection('users').doc(currentUser.uid).get().then(function(snap){
    if (snap.exists){
      var data = snap.data();
      if (data && data.save && typeof data.save === 'object'){
        mergeCloudSave(data.save);
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch(e){}
        generateScenery();
        return true;
      }
    } else {
      cloudSave();
    }
    return false;
  }).catch(function(e){ console.warn('cloudLoad:', e); return false; });
}
function mergeCloudSave(cloud){
  if (typeof cloud.coins === 'number') SAVE.coins = Math.max(0, cloud.coins | 0);
  if (typeof cloud.best === 'number') SAVE.best = Math.max(0, cloud.best | 0);
  if (typeof cloud.bestWave === 'number') SAVE.bestWave = Math.max(0, cloud.bestWave | 0);
  if (typeof cloud.goldenUnlocked === 'boolean') SAVE.goldenUnlocked = cloud.goldenUnlocked;
  if (typeof cloud.codeUsed === 'boolean') SAVE.codeUsed = cloud.codeUsed;
  if (typeof cloud.rebirths === 'number') SAVE.rebirths = Math.max(0, cloud.rebirths | 0);
  if (cloud.up && typeof cloud.up === 'object'){
    for (var i = 0; i < UPGRADES.length; i++){
      var k = UPGRADES[i].key;
      if (typeof cloud.up[k] === 'number')
        SAVE.up[k] = Math.max(0, Math.min(UPGRADES[i].max, cloud.up[k] | 0));
    }
  }
  if (cloud.skin && typeof cloud.skin === 'object'){
    if (typeof cloud.skin.body === 'string' &&
        (/^#[0-9a-fA-F]{6}$/.test(cloud.skin.body) || cloud.skin.body === 'GOLD'))
      SAVE.skin.body = cloud.skin.body;
    if (typeof cloud.skin.hat === 'number')
      SAVE.skin.hat = Math.max(0, Math.min(4, cloud.skin.hat | 0));
  }
  if (cloud.ownedSkins && typeof cloud.ownedSkins === 'object'){
    for (var sk in cloud.ownedSkins){ if (cloud.ownedSkins[sk]) SAVE.ownedSkins[sk] = true; }
  }
  if (cloud.ownedHats && typeof cloud.ownedHats === 'object'){
    for (var hk in cloud.ownedHats){ if (cloud.ownedHats[hk]) SAVE.ownedHats[String(hk)] = true; }
  }
  if (cloud.ownedWeapons && typeof cloud.ownedWeapons === 'object'){
    for (var wk in cloud.ownedWeapons){
      if (cloud.ownedWeapons[wk] && WEAPONS[wk]) SAVE.ownedWeapons[wk] = true;
    }
  }
  if (cloud.ownedWeaponSkins && typeof cloud.ownedWeaponSkins === 'object'){
    for (var wsk2 in cloud.ownedWeaponSkins){
      if (cloud.ownedWeaponSkins[wsk2] && WEAPON_SKINS[wsk2]) SAVE.ownedWeaponSkins[wsk2] = true;
    }
  }
  if (typeof cloud.currentWeaponSkin === 'string' && WEAPON_SKINS[cloud.currentWeaponSkin])
    SAVE.currentWeaponSkin = cloud.currentWeaponSkin;
  if (cloud.ownedBackgrounds && typeof cloud.ownedBackgrounds === 'object'){
    for (var bk in cloud.ownedBackgrounds){
      if (cloud.ownedBackgrounds[bk] && BACKGROUNDS[bk]) SAVE.ownedBackgrounds[bk] = true;
    }
  }
  if (typeof cloud.currentWeapon === 'string' && WEAPONS[cloud.currentWeapon])
    SAVE.currentWeapon = cloud.currentWeapon;
  if (typeof cloud.currentBackground === 'string' && BACKGROUNDS[cloud.currentBackground])
    SAVE.currentBackground = cloud.currentBackground;
  if (cloud.savedPowerups && typeof cloud.savedPowerups === 'object'){
    var sp = cloud.savedPowerups;
    SAVE.savedPowerups = {
      shield: Math.max(0, Math.min(POWERUP_MAX_STACK, sp.shield | 0)),
      dash: Math.max(0, Math.min(POWERUP_MAX_STACK, sp.dash | 0)),
      damage: Math.max(0, Math.min(POWERUP_MAX_STACK, sp.damage | 0)),
      speed: Math.max(0, Math.min(POWERUP_MAX_STACK, sp.speed | 0)),
      fireRate: Math.max(0, Math.min(POWERUP_MAX_STACK, sp.fireRate | 0))
    };
  }
  SAVE.ownedSkins['#4a90d9'] = true;
  SAVE.ownedHats['0'] = true;
  SAVE.ownedWeapons.pistol = true;
  SAVE.ownedWeaponSkins['default'] = true;
  SAVE.ownedBackgrounds.cemetery = true;
}

var loginPanelEl, loginEmailEl, loginPasswordEl, loginMsgEl, loginUserEl;
function setupLoginUI(){
  loginPanelEl = document.getElementById('loginPanel');
  loginEmailEl = document.getElementById('loginEmail');
  loginPasswordEl = document.getElementById('loginPassword');
  loginMsgEl = document.getElementById('loginMsg');
  loginUserEl = document.getElementById('loginUser');
  document.getElementById('loginBtn').addEventListener('click', function(e){ e.preventDefault(); doLogin(); });
  document.getElementById('registerBtn').addEventListener('click', function(e){ e.preventDefault(); doRegister(); });
  document.getElementById('guestBtn').addEventListener('click', function(e){ e.preventDefault(); doGuest(); });
  [loginEmailEl, loginPasswordEl].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); doLogin(); }
      e.stopPropagation();
    });
    el.addEventListener('keyup', function(e){ e.stopPropagation(); });
  });
}
function showLoginPanel(){
  loginPanelEl.classList.add('on');
  if (G) G.state = 'login';
  updateLoginUserLabel();
}
function hideLoginPanel(){
  loginPanelEl.classList.remove('on');
  if (G && G.state === 'login') G.state = 'menu';
}
function updateLoginUserLabel(){
  if (currentUser){
    loginUserEl.innerHTML = 'Sesión: <b>' + (currentUser.email || 'invitado') +
      '</b><br><button class="lp-btn" style="margin-top:8px;font-size:12px;padding:8px;" id="logoutBtn">CERRAR SESIÓN</button>';
    var lo = document.getElementById('logoutBtn');
    if (lo) lo.addEventListener('click', function(){ if (fbAuth) fbAuth.signOut(); });
  } else {
    loginUserEl.textContent = '';
  }
}
function loginMsg(txt, color){
  loginMsgEl.style.color = color || '#ff8a80';
  loginMsgEl.textContent = txt || '';
}
function getCreds(){
  var email = (loginEmailEl.value || '').trim();
  var password = (loginPasswordEl.value || '');
  if (!email){ loginMsg('Escribe tu email'); return null; }
  if (email.indexOf('@') < 0){ loginMsg('Email no válido'); return null; }
  if (password.length < 6){ loginMsg('La contraseña debe tener al menos 6 caracteres'); return null; }
  return { email: email, password: password };
}
function doLogin(){
  if (!cloudReady){ loginMsg('Firebase no está configurado'); return; }
  var c = getCreds(); if (!c) return;
  loginMsg('Entrando...', '#8b949e');
  fbAuth.signInWithEmailAndPassword(c.email, c.password).catch(function(e){
    var m = (e && e.code) ? e.code : '';
    if (m.indexOf('user-not-found') >= 0) loginMsg('No existe ninguna cuenta con ese email');
    else if (m.indexOf('wrong-password') >= 0) loginMsg('Contraseña incorrecta');
    else if (m.indexOf('invalid-email') >= 0) loginMsg('Email no válido');
    else loginMsg('Error: ' + (e.message || 'desconocido'));
  });
}
function doRegister(){
  if (!cloudReady){ loginMsg('Firebase no está configurado'); return; }
  var c = getCreds(); if (!c) return;
  loginMsg('Creando cuenta...', '#8b949e');
  fbAuth.createUserWithEmailAndPassword(c.email, c.password).catch(function(e){
    var m = (e && e.code) ? e.code : '';
    if (m.indexOf('email-already-in-use') >= 0) loginMsg('Ya existe una cuenta con ese email');
    else if (m.indexOf('weak-password') >= 0) loginMsg('Contraseña demasiado débil');
    else loginMsg('Error: ' + (e.message || 'desconocido'));
  });
}
function doGuest(){
  hideLoginPanel();
  if (G) G.state = 'menu';
}

  { key:'speed', name:'VELOCIDAD', max:6, base:8, step:8 },
  { key:'reload', name:'RECARGA', max:8, base:10, step:10 },

  { key:'damage', name:'DAÑO', max:8, base:12, step:14 }
];
function upgradeCost(u){ return u.base + u.step * SAVE.up[u.key]; }
function isMaxed(u){ return SAVE.up[u.key] >= u.max; }
function allMaxed(){
  for (var i = 0; i < UPGRADES.length; i++) if (SAVE.up[UPGRADES[i].key] < UPGRADES[i].max) return false;
  return true;
}
function canRebirth(){ return allMaxed() && SAVE.coins >= REBIRTH_COST; }
function doRebirth(){
  if (!canRebirth()) return false;
  SAVE.coins -= REBIRTH_COST;
  SAVE.rebirths++;
  for (var i = 0; i < UPGRADES.length; i++) SAVE.up[UPGRADES[i].key] = 0;
  saveGame();
  if (G) G.rebirthFlash = 1.2;
  return true;
}
function buyUpgrade(key){
  for (var i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i];
    if (u.key !== key) continue;
    if (isMaxed(u)) return false;
    var c = upgradeCost(u);
    if (SAVE.coins < c) return false;
    SAVE.coins -= c; SAVE.up[key]++; saveGame();
    if (G){ G.buyFlash = 0.35; G.buyKey = key; }
    return true;
  }
  return false;
}

var SCENERY = [];
function generateScenery(){
  SCENERY = [];
  var bg = BACKGROUNDS[SAVE.currentBackground] || BACKGROUNDS.cemetery;
  var mix = bg.mix;
  var seed = 987654;
  function nr(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var i = 0; i < mix.patch; i++)
    SCENERY.push({ type:'patch', x:nr()*WORLD.w, y:nr()*WORLD.h, r:40+nr()*90, alpha:0.04+nr()*0.06, color: bg.patchColors[nr() > 0.5 ? 0 : 1] });
  for (var i2 = 0; i2 < mix.rock; i2++)
    SCENERY.push({ type:'rock', x:nr()*WORLD.w, y:nr()*WORLD.h, s:8+nr()*14, rot:nr()*Math.PI*2, fill:bg.rock.fill, shadow:bg.rock.shadow });
  for (var i3 = 0; i3 < mix.tree; i3++)

var keys = {};
var mouse = { x:0, y:0, down:false, active:false };
var sticks = { move:null, aim:null };
var landscapeAsked = false;
var uiRects = [];

function makeStick(id, x, y){ return { id:id, ox:x, oy:y, x:x, y:y, dx:0, dy:0, mag:0, nx:0, ny:0 }; }
function updateStick(s){
  var dx = s.x - s.ox, dy = s.y - s.oy;
  var d = Math.sqrt(dx*dx + dy*dy);
  if (d > STICK_MAX){
    var k = (d - STICK_MAX) / d;
    s.ox += dx * k; s.oy += dy * k;
    dx = s.x - s.ox; dy = s.y - s.oy; d = STICK_MAX;
  }
  s.dx = dx; s.dy = dy;
  s.mag = Math.min(1, d / STICK_MAX);
  s.nx = dx / STICK_MAX; s.ny = dy / STICK_MAX;
}

function handleUITap(x, y){
  for (var i = 0; i < uiRects.length; i++){
    var r = uiRects[i];
    if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) continue;
    var k = r.key;
    if (k === 'play'){ startNewRun(); return true; }
    if (k === 'menu'){ goMenu(); return true; }
    if (k === 'shop'){ openShop('mejoras', 'menu'); return true; }
    if (k === 'multiplayer'){ showMultiplayerPanel(); return true; }
    if (k === 'open-code'){ openCodePanel(); return true; }
    if (k === 'resume'){ if (G) G.state = 'playing'; return true; }
    if (k === 'pause-menu'){ goMenu(); return true; }
    if (k === 'rebirth'){ doRebirth(); return true; }
    if (k === 'show-login'){ showLoginPanel(); return true; }
    if (k.indexOf('tab:') === 0){ G.shopTab = k.slice(4); return true; }
    if (k.indexOf('color:') === 0){
      var col = k.slice(6);
      if (col === 'GOLD'){ if (SAVE.goldenUnlocked){ SAVE.skin.body = 'GOLD'; saveGame(); } }
      else if (SAVE.ownedSkins[col]){ SAVE.skin.body = col; saveGame(); }
      else buySkinColor(col);
      return true;
    }
    if (k.indexOf('hat:') === 0){
      var idx = parseInt(k.slice(4), 10) || 0;
      if (SAVE.ownedHats[String(idx)]){ SAVE.skin.hat = idx; saveGame(); }
      else buyHat(idx);
      return true;
    }
    if (k.indexOf('ws:') === 0){
      var wsk3 = k.slice(3);
      if (SAVE.ownedWeaponSkins[wsk3]) equipWeaponSkin(wsk3);
      else buyWeaponSkin(wsk3);
      return true;
    }
    if (k.indexOf('bg:') === 0){
      var bgk = k.slice(3);
      if (SAVE.ownedBackgrounds[bgk]) equipBackground(bgk);
      else buyBackground(bgk);
      return true;
    }
    if (k.indexOf('buyweapon:') === 0){ buyWeapon(k.slice(10)); return true; }
    if (k.indexOf('equip:') === 0){ equipWeapon(k.slice(6)); return true; }
    buyUpgrade(k);
    return true;
  }
  return false;
}

function handleGameplayTap(x, y){
  if (Math.hypot(x - PAUSE_BTN.x, y - PAUSE_BTN.y) < PAUSE_BTN.r * 1.6){
    if (G && G.state === 'playing'){ G.state = 'paused'; sticks.move = null; sticks.aim = null; }
    return true;
  }
  for (var si = 0; si < powerSlots.length; si++){
    var sl = powerSlots[si];
    if (Math.hypot(x - sl.x, y - sl.y) < sl.r * 1.5){ activatePowerup(POWERUP_ORDER[si]); return true; }
  }
  for (var i = 0; i < buttons.length; i++){
    var b = buttons[i];
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.45){ b.press = 0.2; tryReload(); return true; }
  }
  return false;
}
function onPointerDown(id, x, y){
  if (handleGameplayTap(x, y)) return true;
  if (x < W * 0.5){ if (!sticks.move) sticks.move = makeStick(id, x, y); }
  else { if (!sticks.aim) sticks.aim = makeStick(id, x, y); }
  return false;
}
function onPointerMove(id, x, y){
  if (sticks.move && sticks.move.id === id){ sticks.move.x = x; sticks.move.y = y; updateStick(sticks.move); }
  if (sticks.aim && sticks.aim.id === id){ sticks.aim.x = x; sticks.aim.y = y; updateStick(sticks.aim); }
}
function onPointerUp(id){
  if (sticks.move && sticks.move.id === id) sticks.move = null;
  if (sticks.aim && sticks.aim.id === id) sticks.aim = null;
}
function isUIMode(){ return G && (G.state === 'menu' || G.state === 'shop' || G.state === 'paused' || G.state === 'login' || G.state === 'multiplayer'); }

canvas.addEventListener('touchstart', function(e){
  if (codeOpen) return;
  e.preventDefault();
  if (!landscapeAsked){ landscapeAsked = true; if (isPortrait()) lockLandscape(); }
  if (isUIMode()){
    for (var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      handleUITap(t.clientX, t.clientY);
    }
    return;
  }
  for (var j = 0; j < e.changedTouches.length; j++){
    var tt = e.changedTouches[j];
    onPointerDown(tt.identifier, tt.clientX, tt.clientY);
  }
}, { passive:false });
canvas.addEventListener('touchmove', function(e){
  if (codeOpen) return;
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    onPointerMove(t.identifier, t.clientX, t.clientY);
  }
}, { passive:false });
function endTouches(e){
  if (codeOpen) return;
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) onPointerUp(e.changedTouches[i].identifier);
}
canvas.addEventListener('touchend', endTouches, { passive:false });
canvas.addEventListener('touchcancel', endTouches, { passive:false });

window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mousedown', function(e){
  if (codeOpen) return;
  if (e.button !== 0) return;
  if (isUIMode()){ handleUITap(e.clientX, e.clientY); return; }
  if (G && G.state === 'playing'){ if (handleGameplayTap(e.clientX, e.clientY)) return; }
  mouse.down = true; mouse.active = true;
});
window.addEventListener('mouseup', function(e){ if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
window.addEventListener('keydown', function(e){
  if (codeOpen) return;
  keys[e.code] = true;
  if (e.code === 'Escape' || e.code === 'KeyP'){
    if (G && G.state === 'playing'){ G.state = 'paused'; sticks.move = null; sticks.aim = null; }
    else if (G && G.state === 'paused'){ G.state = 'playing'; }
    return;
  }
  if (e.code === 'Space'){ e.preventDefault(); tryDash(); }
  if (e.code === 'KeyR') tryReload();
  if (G && G.state === 'playing'){
    if (e.code === 'Digit1') activatePowerup('shield');
    if (e.code === 'Digit2') activatePowerup('dash');
    if (e.code === 'Digit3') activatePowerup('damage');
    if (e.code === 'Digit4') activatePowerup('speed');
    if (e.code === 'Digit5') activatePowerup('fireRate');
  }
  if (e.code === 'KeyM' && G && G.state === 'playing') goMenu();
  if (e.code === 'Enter'){ if (G && (G.state === 'menu' || G.state === 'shop')) startNewRun(); }
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });

var mpPanelEl = null, mpNameEl = null, mpMsgEl = null, mpRoomCodeDisplayEl = null;
var mpPlayerListEl = null, mpRoomCodeInputEl = null;
var mpTabCreateEl = null, mpTabJoinEl = null, mpCreateSectionEl = null, mpJoinSectionEl = null;
var mpRoomRef = null, mpPlayersRef = null, mpStateRef = null;
var mpRole = null;
var mpRoomCode = null;
var mpPlayers = {};
var mpMyUid = null;
var mpSendTimer = 0;

function setupMultiplayerUI(){

    mpJoinSectionEl.style.display = 'none';

  });
  mpTabJoinEl.addEventListener('click', function(){

function showMultiplayerPanel(){
  mpPanelEl.classList.add('on');
  if (G) G.state = 'multiplayer';
  mpMsgEl.textContent = '';
  mpRoomCodeDisplayEl.textContent = '';
  mpPlayerListEl.innerHTML = '';
  mpMsgEl.style.color = '#ff8a80';
}

function generateRoomCode(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

function getMyUid(){
  if (!mpMyUid) mpMyUid = (currentUser ? currentUser.uid : 'g' + Date.now() + Math.floor(Math.random()*1000));
  return mpMyUid;
}

function createRoom(){
  if (!cloudReady) { mpMsgEl.textContent = 'Firebase no está listo.'; return; }
  var name = (mpNameEl.value || '').trim();
  if (!name) { mpMsgEl.textContent = 'Escribe tu nombre.'; return; }

  mpRoomCode = generateRoomCode();
  mpRoomCodeDisplayEl.textContent = mpRoomCode;
  mpRole = 'host';
  mpPlayers = {};

  var dbRef = firebase.database();
  mpRoomRef = dbRef.ref('rooms/' + mpRoomCode);
  mpPlayersRef = mpRoomRef.child('players');
  mpStateRef = mpRoomRef.child('gameState');

  var myUid = getMyUid();
  mpPlayersRef.child(myUid).set({
    name: name, isHost: true,
    skin: SAVE.skin.body, hat: SAVE.skin.hat
  });

  mpPlayersRef.on('value', function(snapshot){
    mpPlayers = snapshot.val() || {};
    var uids = Object.keys(mpPlayers);
    if (uids.length > 3){
      mpMsgEl.textContent = 'Sala llena (máximo 3)';
    }
    updateMpPlayerList();
  });

  mpStateRef.on('value', function(snapshot){
    var state = snapshot.val();
    if (state && G && G.state === 'playing' && mpRole === 'client'){
      applyGameState(state);
    }
  });

  mpMsgEl.style.color = '#81c784';
  mpMsgEl.textContent = 'Sala ' + mpRoomCode + '. Comparte el código.';
  setTimeout(function(){
    mpPanelEl.classList.remove('on');
    startNewRun();
    G.state = 'playing';
    G.isMultiplayer = true;
    G.mpRole = 'host';
    initMultiplayerPlayers();
  }, 500);
}

function joinRoom(){
  if (!cloudReady) { mpMsgEl.textContent = 'Firebase no está listo.'; return; }
  var name = (mpNameEl.value || '').trim();
  if (!name) { mpMsgEl.textContent = 'Escribe tu nombre.'; return; }
  var code = (mpRoomCodeInputEl.value || '').trim().toUpperCase();
  if (code.length !== 4) { mpMsgEl.textContent = 'Código de 4 caracteres.'; return; }

  mpRole = 'client';
  mpRoomCode = code;
  mpPlayers = {};

  var dbRef = firebase.database();
  mpRoomRef = dbRef.ref('rooms/' + mpRoomCode);
  mpPlayersRef = mpRoomRef.child('players');
  mpStateRef = mpRoomRef.child('gameState');

  mpPlayersRef.once('value').then(function(snapshot){
    var players = snapshot.val() || {};
    var uids = Object.keys(players);
    if (uids.length >= 3){
      mpMsgEl.textContent = 'La sala está llena (máximo 3).';
      return;
    }
    var myUid = getMyUid();
    mpPlayersRef.child(myUid).set({
      name: name, isHost: false,
      skin: SAVE.skin.body, hat: SAVE.skin.hat
    });

    mpPlayersRef.on('value', function(snap){
      mpPlayers = snap.val() || {};
      updateMpPlayerList();
    });

    mpStateRef.on('value', function(snap){
      var state = snap.val();
      if (state && G && G.state === 'playing'){
        applyGameState(state);
      }
    });

    mpMsgEl.style.color = '#81c784';
    mpMsgEl.textContent = 'Conectado. Esperando al host...';
    setTimeout(function(){
      mpPanelEl.classList.remove('on');
      startNewRun();
      G.state = 'playing';
      G.isMultiplayer = true;
      G.mpRole = 'client';
      initMultiplayerPlayers();
    }, 500);
  }).catch(function(err){
    mpMsgEl.textContent = 'Error: ' + (err.message || 'desconocido');
  });
}

function initMultiplayerPlayers(){
  if (!G) return;
  G.remotePlayers = {};
  var uids = Object.keys(mpPlayers);
  for (var i = 0; i < uids.length; i++){
    var uid = uids[i];
    if (uid === getMyUid()) continue;
    var info = mpPlayers[uid];
    G.remotePlayers[uid] = {
      name: info.name || 'Jugador',
      skin: info.skin || '#4a90d9',
      hat: info.hat || 0,
      x: G.player.x + rand(-100, 100),
      y: G.player.y + rand(-100, 100),
      targetX: G.player.x,
      targetY: G.player.y,
      aim: 0, hp: 100, maxHp: 100, isDead: false
    };
  }
}

function updateMpPlayerList(){
  if (!mpPlayerListEl) return;
  var html = '<div style="margin-top:15px;text-align:left;font-size:12px;color:#8b949e;">Jugadores conectados:</div>';
  var uids = Object.keys(mpPlayers);
  for (var i = 0; i < uids.length; i++){
    var p = mpPlayers[uids[i]];
    var isMe = (uids[i] === getMyUid());
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;">' +
      '<span>' + (p.name || 'Jugador') + (isMe ? ' (tú)' : '') + '</span>' +
      '<span style="color:#81c784;">' + (p.isHost ? 'HOST' : 'CLIENTE') + '</span>' +
    '</div>';
  }
  mpPlayerListEl.innerHTML = html;
}

function leaveRoom(){
  if (mpPlayersRef){
    var myUid = getMyUid();
    mpPlayersRef.child(myUid).remove();
    mpPlayersRef.off();
  }
  if (mpStateRef) mpStateRef.off();
  if (mpRoomRef) mpRoomRef.off();
  mpRoomRef = null; mpPlayersRef = null; mpStateRef = null;
  mpRole = null; mpRoomCode = null; mpPlayers = {};
  if (G){ G.isMultiplayer = false; G.mpRole = null; G.remotePlayers = {}; }
}

function applyGameState(state){
  if (!G || !G.player) return;
  if (state.players){
    var uids = Object.keys(state.players);
    for (var i = 0; i < uids.length; i++){
      var uid = uids[i];
      if (uid === getMyUid()) continue;
      var data = state.players[uid];
      if (!data) continue;
      if (!G.remotePlayers[uid]){
        G.remotePlayers[uid] = {
          name: data.name || 'Jugador', skin: data.skin || '#4a90d9', hat: data.hat || 0,
          x: data.x, y: data.y, targetX: data.x, targetY: data.y,
          aim: data.aim || 0, hp: data.hp, maxHp: data.maxHp, isDead: data.isDead || false
        };
      } else {
        var rp = G.remotePlayers[uid];
        rp.targetX = data.x; rp.targetY = data.y; rp.aim = data.aim || 0;
        rp.hp = data.hp; rp.maxHp = data.maxHp; rp.isDead = data.isDead || false;
        rp.skin = data.skin || rp.skin; rp.hat = data.hat || rp.hat;
        rp.name = data.name || rp.name;
      }
    }
  }
  if (state.zombies && mpRole === 'client'){
    G.zombies = [];
    for (var zi = 0; zi < state.zombies.length; zi++){
      var z = state.zombies[zi];
      G.zombies.push({
        x: z.x, y: z.y, type: z.type, r: z.r, hp: z.hp, maxHp: z.maxHp,
        speed: z.speed || 50, dmg: z.dmg || 10, atkRate: 0.9, atkCd: 0,
        color: z.color, dark: z.dark, hitFlash: 0, kx: 0, ky: 0, dead: false,
        phase: z.phase || 0, score: z.score || 10, fireCd: 0, summonCd: 0, telegraph: 0
      });
    }
    G.boss = null;
    for (var bi = 0; bi < G.zombies.length; bi++){
      if (G.zombies[bi].type === 'boss'){ G.boss = G.zombies[bi]; break; }
    }
  }
  if (state.ebullets && mpRole === 'client') G.ebullets = state.ebullets.slice();
  if (typeof state.wave === 'number' && mpRole === 'client') G.wave = state.wave;
  if (state.bloodRound !== undefined && mpRole === 'client') G.bloodRound = state.bloodRound;
  if (state.bossRound !== undefined && mpRole === 'client') G.bossRound = state.bossRound;
}

function sendPlayerState(){
  if (!mpPlayersRef || !G || !G.player) return;
  var p = G.player;
  mpPlayersRef.child(getMyUid()).update({
    x: p.x, y: p.y, hp: p.hp, maxHp: p.maxHp, aim: p.aim,
    skin: SAVE.skin.body, hat: SAVE.skin.hat,
    isDead: p.hp <= 0, lastUpdate: Date.now()
  });
}

function sendGameState(){
  if (mpRole !== 'host' || !mpStateRef || !G) return;
  var players = {};
  var uids = Object.keys(mpPlayers);
  for (var i = 0; i < uids.length; i++){
    var uid = uids[i];
    var info = mpPlayers[uid];
    if (uid === getMyUid()){
      players[uid] = {
        name: info.name, isHost: true, x: G.player.x, y: G.player.y,
        hp: G.player.hp, maxHp: G.player.maxHp, aim: G.player.aim,
        skin: SAVE.skin.body, hat: SAVE.skin.hat, isDead: G.player.hp <= 0
      };
    } else {
      var rp = G.remotePlayers[uid];
      if (rp){
        players[uid] = {
          name: rp.name, isHost: false, x: rp.x, y: rp.y,
          hp: rp.hp, maxHp: rp.maxHp, aim: rp.aim,
          skin: rp.skin, hat: rp.hat, isDead: rp.isDead
        };
      }
    }
  }
  var zombiesData = [];
  for (var zi = 0; zi < G.zombies.length; zi++){
    var z = G.zombies[zi];
    zombiesData.push({
      x: Math.round(z.x), y: Math.round(z.y), type: z.type, r: z.r,
      hp: Math.round(z.hp), maxHp: z.maxHp, speed: z.speed, dmg: z.dmg,
      color: z.color, dark: z.dark, phase: z.phase, score: z.score
    });
  }
  var ebulletsData = [];
  for (var ei = 0; ei < G.ebullets.length; ei++){
    var eb = G.ebullets[ei];
    ebulletsData.push({
      x: Math.round(eb.x), y: Math.round(eb.y), vx: eb.vx, vy: eb.vy,
      dmg: eb.dmg, r: eb.r, life: eb.life, color: eb.color
    });
  }
  mpStateRef.set({
    players: players, zombies: zombiesData, ebullets: ebulletsData,
    wave: G.wave, bloodRound: G.bloodRound, bossRound: G.bossRound, updatedAt: Date.now()
  });
}

function drawOtherPlayers(){
  if (!G || G.state !== 'playing' || !G.isMultiplayer) return;
  if (!G.remotePlayers) return;
  var uids = Object.keys(G.remotePlayers);
  for (var i = 0; i < uids.length; i++){
    var uid = uids[i];
    var rp = G.remotePlayers[uid];
    if (!rp) continue;
    rp.x += (rp.targetX - rp.x) * 0.3;
    rp.y += (rp.targetY - rp.y) * 0.3;

    ctx.save();
    ctx.translate(rp.x, rp.y);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 5, 15*1.05, 15*0.85, 0, 0, 7); ctx.fill();
    var bodyColor = rp.isDead ? '#444444' : (rp.skin === 'GOLD' ? '#ffd700' : rp.skin);
    var accent = rp.isDead ? '#222' : (rp.skin === 'GOLD' ? '#8b6914' : darken(rp.skin, 0.42));
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7);
    ctx.fillStyle = bodyColor; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = accent; ctx.stroke();
    ctx.save(); ctx.rotate(rp.aim || 0);
    ctx.fillStyle = '#22262e'; rr(3, -3.5, 24, 7, 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(Math.cos(rp.aim||0)*8.25, Math.sin(rp.aim||0)*8.25, 3.3, 0, 7); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(rp.x, rp.y);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(rp.name, 0, -32);
    if (!rp.isDead){
      var bw = 34, bh = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; rr(-bw/2-1, -29, bw+2, bh+2, 2); ctx.fill();
      ctx.fillStyle = 'rgba(60,60,60,0.9)'; rr(-bw/2, -28, bw, bh, 1.5); ctx.fill();
      var hpf = Math.max(0, Math.min(1, rp.hp / rp.maxHp));
      ctx.fillStyle = hpf > 0.5 ? '#43a047' : (hpf > 0.25 ? '#f9a825' : '#e53935');
      rr(-bw/2, -28, bw * hpf, bh, 1.5); ctx.fill();
    } else {

    }
    ctx.restore();

    var screenX = rp.x - G.cam.x, screenY = rp.y - G.cam.y;
    var margin = 60;

    if (!onScreen){
      var cxs = W/2, cys = H/2;
      var dxa = screenX - cxs, dya = screenY - cys;
      var angA = Math.atan2(dya, dxa);
      var radius = Math.min(W/2 - margin, H/2 - margin);
      var axp = cxs + Math.cos(angA) * radius;
      var ayp = cys + Math.sin(angA) * radius;
      var arrowColor = rp.isDead ? '#e53935' : (rp.skin === 'GOLD' ? '#ffd700' : rp.skin);
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.translate(axp, ayp); ctx.rotate(angA);

      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(22, 0); ctx.lineTo(-12, -15); ctx.lineTo(-5, 0); ctx.lineTo(-12, 15);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(rp.name, axp, ayp + 28);

      phase: Math.random() * 10, score: def.score,
      fireCd: 0, summonCd: 0, telegraph: 0
    });
    for (var k = 0; k < 20; k++){
      var ka = Math.random() * Math.PI * 2;
      spawnParticle(positions[i][0], positions[i][1], '#5d4037',
                    rand(3,6), rand(0.5,1.0), Math.cos(ka)*rand(80,250), Math.sin(ka)*rand(80,250));
    }
  }
  for (var k2 = 0; k2 < 30; k2++){
    var ka2 = Math.random() * Math.PI * 2;
    spawnParticle(boss.x, boss.y, '#ff1744', rand(3,7), rand(0.5,1.1),
                  Math.cos(ka2)*rand(100,350), Math.sin(ka2)*rand(100,350));

  G.shake = Math.min(G.shake + 12, 24);
  addFloater(boss.x, boss.y - boss.r - 20, '¡BRUTOS!', '#8a3b3b', 20);
}
function pickZombieType(w){
  var roll = Math.random(), acc = 0;
  if (w >= 10){ acc += 0.05; if (roll < acc) return 'tank'; }
  if (w >= 8) { acc += 0.05; if (roll < acc) return 'screamer'; }
  if (w >= 6) { acc += 0.09; if (roll < acc) return 'exploder'; }
  if (w >= 5) { acc += 0.08; if (roll < acc) return 'spitter'; }
  if (w >= 4){ acc += Math.min(0.18, 0.035 * (w - 3)); if (roll < acc) return 'brute'; }
  acc += Math.min(0.38, 0.05 + w * 0.035);
  if (roll < acc) return 'runner';
  return 'walker';
}
function spawnZombie(){
  var p = G.player, w = G.wave;
  var type = pickZombieType(w), def = ZDEF[type];
  var bloodMul = G.bloodRound ? 2 : 1;
  var bloodSpd = G.bloodRound ? 1.25 : 1;
  var x = 0, y = 0;
  for (var i = 0; i < 26; i++){
    var a = Math.random() * Math.PI * 2;
    var d = Math.max(W, H) * 0.62 + Math.random() * 240;
    x = p.x + Math.cos(a) * d; y = p.y + Math.sin(a) * d;
    if (x > 60 && x < WORLD.w - 60 && y > 60 && y < WORLD.h - 60) break;
  }
  x = clamp(x, 60, WORLD.w - 60); y = clamp(y, 60, WORLD.h - 60);
  var hpMul = (1 + (w - 1) * 0.09) * bloodMul;
  var atkRate = 0.9;
  if (type === 'runner') atkRate = 0.7;
  else if (type === 'spitter') atkRate = 1.5;
  else if (type === 'tank') atkRate = 1.4;
  G.zombies.push({
    x: x, y: y, type: type, r: def.r,
    hp: def.hp * hpMul, maxHp: def.hp * hpMul,
    speed: def.speed * (1 + Math.min(0.35, (w - 1) * 0.02)) * bloodSpd,
    dmg: def.dmg * bloodMul, atkRate: atkRate, atkCd: 0.6,
    color: def.color, dark: def.dark,
    hitFlash: 0, kx: 0, ky: 0, dead: false,
    phase: Math.random() * 10, score: def.score,
    fireCd: type === 'spitter' ? rand(0.8, 1.6) : 0,
    summonCd: type === 'screamer' ? rand(1.5, 2.6) : 0,
    telegraph: 0
  });
}
function doSummon(z){
  var n = 2 + Math.floor(Math.random() * 2);
  var bloodMul = G.bloodRound ? 2 : 1;
  var bloodSpd = G.bloodRound ? 1.25 : 1;
  for (var i = 0; i < n; i++){
    if (G.zombies.length >= 32) break;
    var a = Math.random() * Math.PI * 2;
    var d = 46 + Math.random() * 30;
    var sx = clamp(z.x + Math.cos(a) * d, 40, WORLD.w - 40);
    var sy = clamp(z.y + Math.sin(a) * d, 40, WORLD.h - 40);
    var def = ZDEF.walker;
    var hpMul = (1 + (G.wave - 1) * 0.09) * bloodMul;
    G.zombies.push({
      x: sx, y: sy, type: 'walker', r: def.r,
      hp: def.hp * hpMul, maxHp: def.hp * hpMul,
      speed: def.speed * (1 + Math.min(0.35, (G.wave - 1) * 0.02)) * bloodSpd,
      dmg: def.dmg * bloodMul, atkRate: 0.9, atkCd: 0.7,
      color: def.color, dark: def.dark,
      hitFlash: 0, kx: 0, ky: 0, dead: false,
      phase: Math.random() * 10, score: def.score,
      fireCd: 0, summonCd: 0, telegraph: 0
    });
    for (var j = 0; j < 12; j++){
      var pa = Math.random() * Math.PI * 2;
      spawnParticle(sx, sy, '#4db6ac', rand(2,4), rand(0.3,0.6), Math.cos(pa)*rand(40,140), Math.sin(pa)*rand(40,140));
    }
  }
  for (var k = 0; k < 18; k++){
    var ka = Math.random() * Math.PI * 2;
    spawnParticle(z.x, z.y, '#26a69a', rand(2,5), rand(0.3,0.6), Math.cos(ka)*rand(80,220), Math.sin(ka)*rand(80,220));
  }
  G.shake = Math.min(G.shake + 4, 14);

function update(dt){
  if (!G) return;
  if (G.state === 'menu'){ menuTime += dt; return; }
  if (G.state === 'paused' || G.state === 'login' || G.state === 'multiplayer') return;
  if (G.state === 'dying'){
    G.deadT += dt;
    G.shake = Math.max(0, G.shake - dt * 45);
    stepParticles(dt); stepFloaters(dt);
    if (G.deadT > 0.85){
      G.state = 'shop'; G.shopTab = 'mejoras';
      G.shopFrom = 'dead'; G.showStats = true;
    }
    return;
  }
  if (G.state === 'shop'){
    if (G.buyFlash > 0) G.buyFlash -= dt;
    if (G.rebirthFlash > 0) G.rebirthFlash -= dt;
    return;
  }
  G.time += dt;
  for (var bj = 0; bj < buttons.length; bj++){
    if (buttons[bj].press > 0) buttons[bj].press -= dt;
  }
  if (G.buyFlash > 0) G.buyFlash -= dt;
  if (G.slotFlashT > 0) G.slotFlashT -= dt;
  if (G.rebirthFlash > 0) G.rebirthFlash -= dt;
  var p = G.player, i;
  for (var kk in p.active){ if (p.active[kk] > 0) p.active[kk] = Math.max(0, p.active[kk] - dt); }
  var ix = 0, iy = 0;
  if (sticks.move && sticks.move.mag > 0.12){ ix = sticks.move.nx; iy = sticks.move.ny; }
  else {
    if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if (keys['KeyW'] || keys['ArrowUp']) iy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) iy += 1;
    var l = Math.hypot(ix, iy);
    if (l > 1){ ix /= l; iy /= l; }
  }
  var spdMul = p.active.speed > 0 ? 2 : 1;
  p.dashCd = Math.max(0, p.dashCd - dt);
  if (p.dashT > 0){
    p.dashT -= dt;
    p.x += p.dashDX * 920 * dt; p.y += p.dashDY * 920 * dt;
    if (Math.random() < 0.85)
      spawnParticle(p.x, p.y, 'rgba(120,190,255,0.5)', rand(2,5), 0.3, rand(-30,30), rand(-30,30));
  } else {
    p.x += ix * p.speed * spdMul * dt;
    p.y += iy * p.speed * spdMul * dt;
    if (spdMul > 1 && (ix !== 0 || iy !== 0) && Math.random() < 0.4){
      spawnParticle(p.x, p.y, 'rgba(67,160,71,0.4)', rand(2,4), 0.35, rand(-20,20), rand(-20,20));
    }
  }
  p.x = clamp(p.x, p.r, WORLD.w - p.r);
  p.y = clamp(p.y, p.r, WORLD.h - p.r);
  updateCamera();
  var firing = false;
  if (sticks.aim && sticks.aim.mag > STICK_DEAD){ p.aim = Math.atan2(sticks.aim.ny, sticks.aim.nx); firing = true; }
  else if (mouse.active){
    p.aim = Math.atan2((mouse.y + G.cam.y) - p.y, (mouse.x + G.cam.x) - p.x);
    firing = mouse.down;
  }
  p.fireCd -= dt;
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.healFlash = Math.max(0, p.healFlash - dt);
  if (p.reloading){ p.reloadT -= dt; if (p.reloadT <= 0){ p.reloading = false; p.mag = p.magSize; } }
  if (firing && p.fireCd <= 0 && !p.reloading){ if (p.mag > 0) shoot(); else tryReload(); }

  if (G.isMultiplayer){
    mpSendTimer += dt;
    if (mpSendTimer >= 0.05){
      mpSendTimer = 0;
      sendPlayerState();
      if (mpRole === 'host') sendGameState();
    }
  }

  for (i = G.bullets.length - 1; i >= 0; i--){
    var bl = G.bullets[i];
    bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
    if (bl.life <= 0 || bl.x < 0 || bl.x > WORLD.w || bl.y < 0 || bl.y > WORLD.h){ G.bullets.splice(i, 1); continue; }
    var hit = false;
    for (var j = 0; j < G.zombies.length; j++){
      var zz = G.zombies[j];
      var dx = zz.x - bl.x, dy = zz.y - bl.y, rr2 = zz.r + bl.r;
      if (dx*dx + dy*dy < rr2*rr2){ damageZombie(zz, bl.dmg, bl.vx, bl.vy); hit = true; break; }
    }
    if (hit){
      for (var k2 = 0; k2 < 4; k2++){
        var a2 = Math.atan2(-bl.vy, -bl.vx) + rand(-0.9, 0.9);
        spawnParticle(bl.x, bl.y, '#e53935', rand(1.5,3), rand(0.15,0.35), Math.cos(a2)*rand(60,220), Math.sin(a2)*rand(60,220));
      }
      G.bullets.splice(i, 1);
    }
  }
  for (i = G.ebullets.length - 1; i >= 0; i--){
    var eb = G.ebullets[i];
    eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
    if (eb.life <= 0 || eb.x < 0 || eb.x > WORLD.w || eb.y < 0 || eb.y > WORLD.h){ G.ebullets.splice(i, 1); continue; }
    var edx = p.x - eb.x, edy = p.y - eb.y, err = eb.r + p.r;
    if (edx*edx + edy*edy < err*err){
      hurtPlayer(eb.dmg);
      for (var kk2 = 0; kk2 < 10; kk2++){
        var ea = Math.random() * Math.PI * 2;
        spawnParticle(eb.x, eb.y, '#b388ff', rand(2,4), rand(0.2,0.5), Math.cos(ea)*rand(60,180), Math.sin(ea)*rand(60,180));
      }
      G.ebullets.splice(i, 1); continue;
    }
  }
  if (mpRole !== 'client'){
    for (i = 0; i < G.zombies.length; i++){
      var z = G.zombies[i];
      z.hitFlash = Math.max(0, z.hitFlash - dt);
      z.atkCd -= dt; z.phase += dt;
      z.x += z.kx * dt; z.y += z.ky * dt;
      var kd = Math.pow(0.00005, dt);
      z.kx *= kd; z.ky *= kd;
      var ddx = p.x - z.x, ddy = p.y - z.y;
      var dist = Math.hypot(ddx, ddy) || 1;
      var touch = z.r + p.r;
      if (z.type === 'spitter'){
        if (dist > 320){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
        else if (dist < 180){ z.x -= (ddx/dist) * z.speed * dt; z.y -= (ddy/dist) * z.speed * dt; }
        else { z.x += (-ddy/dist) * z.speed * 0.55 * dt; z.y += (ddx/dist) * z.speed * 0.55 * dt; }
        z.fireCd -= dt;
        if (z.fireCd <= 0 && dist < 460){
          z.fireCd = rand(2.0, 2.6);
          var ang = Math.atan2(ddy, ddx);
          G.ebullets.push({
            x: z.x + Math.cos(ang) * (z.r + 6), y: z.y + Math.sin(ang) * (z.r + 6),
            vx: Math.cos(ang) * 250, vy: Math.sin(ang) * 250,
            dmg: z.dmg, r: 5, life: 3.5, color: '#b388ff'
          });
        }
      } else if (z.type === 'exploder'){
        if (dist > 1){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
        if (dist < 42) killZombie(z);
      } else if (z.type === 'screamer'){
        if (dist > touch){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
        else if (z.atkCd <= 0 && p.dashT <= 0){ z.atkCd = z.atkRate; hurtPlayer(z.dmg); }
        if (z.telegraph > 0){ z.telegraph -= dt; if (z.telegraph <= 0) doSummon(z); }
        else {
          z.summonCd -= dt;
          if (z.summonCd <= 0 && G.zombies.length < 32){ z.summonCd = rand(4.5, 6.5); z.telegraph = 0.8; }
        }
      } else if (z.type === 'boss'){
        if (dist > touch){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
        else if (z.atkCd <= 0 && p.dashT <= 0){ z.atkCd = z.atkRate; hurtPlayer(z.dmg); }
        z.bossTimer30 -= dt; z.bossTimer60 -= dt;
        if (z.bossTimer30 <= 0){ z.bossTimer30 = 30; bossSummonWave(z); }
        if (z.bossTimer60 <= 0){ z.bossTimer60 = 60; bossSummonTanks(z); }
      } else {
        if (dist > touch){ z.x += (ddx/dist) * z.speed * dt; z.y += (ddy/dist) * z.speed * dt; }
        else if (z.atkCd <= 0 && p.dashT <= 0){ z.atkCd = z.atkRate; hurtPlayer(z.dmg); }
      }
      z.x = clamp(z.x, z.r, WORLD.w - z.r);
      z.y = clamp(z.y, z.r, WORLD.h - z.r);
    }
    for (i = 0; i < G.zombies.length; i++){
      for (var m = i + 1; m < G.zombies.length; m++){
        var za = G.zombies[i], zb = G.zombies[m];
        var sx = zb.x - za.x, sy = zb.y - za.y;
        var d2 = sx*sx + sy*sy, minD = za.r + zb.r;
        if (d2 < minD * minD && d2 > 0.01){
          var dd = Math.sqrt(d2), push = (minD - dd) * 0.5;
          sx /= dd; sy /= dd;
          za.x -= sx * push; za.y -= sy * push;
          zb.x += sx * push; zb.y += sy * push;
        }
      }
    }
  }
  for (i = G.zombies.length - 1; i >= 0; i--){ if (G.zombies[i].dead) G.zombies.splice(i, 1); }
  for (i = G.pickups.length - 1; i >= 0; i--){
    var pk = G.pickups[i];
    pk.phase += dt; pk.life -= dt;
    pk.born = Math.min(1, pk.born + dt * 3);
    var pdx = p.x - pk.x, pdy = p.y - pk.y;
    var pd2 = pdx*pdx + pdy*pdy;
    if (pd2 < 110 * 110 && pd2 > 1){
      var pd = Math.sqrt(pd2);
      var pull = (1 - pd/110) * 260;
      pk.x += (pdx/pd) * pull * dt; pk.y += (pdy/pd) * pull * dt;
    }
    var touchR = p.r + pk.r;
    if (pd2 < touchR * touchR){
      var healed = Math.min(10, p.maxHp - p.hp);
      if (healed > 0){ p.hp += healed; p.healFlash = 0.35; addFloater(p.x, p.y - 28, '+' + healed, '#4caf50', 18); }
      for (var q = 0; q < 14; q++){
        var qa = Math.random() * Math.PI * 2;
        spawnParticle(pk.x, pk.y, Math.random() < 0.5 ? '#4caf50' : '#81c784',
                      rand(2,4), rand(0.3,0.7), Math.cos(qa)*rand(60,200), Math.sin(qa)*rand(60,200));
      }
      G.pickups.splice(i, 1); continue;
    }
    if (pk.life <= 0) G.pickups.splice(i, 1);
  }
  for (i = G.powerDrops.length - 1; i >= 0; i--){
    var pdl = G.powerDrops[i];
    pdl.phase += dt; pdl.life -= dt;
    pdl.born = Math.min(1, pdl.born + dt * 4);
    var ppdx = p.x - pdl.x, ppdy = p.y - pdl.y;
    var ppd2 = ppdx*ppdx + ppdy*ppdy;
    if (ppd2 < 120 * 120 && ppd2 > 1){
      var ppd = Math.sqrt(ppd2), ppull = (1 - ppd/120) * 280;
      pdl.x += (ppdx/ppd) * ppull * dt; pdl.y += (ppdy/ppd) * ppull * dt;
    }
    var ptR = p.r + pdl.r;
    if (ppd2 < ptR * ptR){
      var puKey = pdl.key;
      if (p.powerups[puKey] < POWERUP_MAX_STACK){
        p.powerups[puKey]++;
        SAVE.savedPowerups[puKey] = p.powerups[puKey];
        var pu = POWERUPS[puKey];
        addFloater(p.x, p.y - 28, pu.name, pu.color, 15);
        for (var qi = 0; qi < 16; qi++){
          var qa2 = Math.random() * Math.PI * 2;
          spawnParticle(pdl.x, pdl.y, pu.color, rand(2,4), rand(0.3,0.7), Math.cos(qa2)*rand(60,220), Math.sin(qa2)*rand(60,220));
        }
        saveGame();
        G.powerDrops.splice(i, 1); continue;
      }
    }
    if (pdl.life <= 0) G.powerDrops.splice(i, 1);
  }
  if (mpRole !== 'client'){
    if (G.spawnQueue === 0 && G.zombies.length === 0){
      G.waveTimer -= dt;
      if (G.waveTimer <= 0) startWave();
    } else if (G.spawnQueue > 0){
      G.spawnCd -= dt;
      if (G.spawnCd <= 0){ spawnZombie(); G.spawnQueue--; G.spawnCd = 0.32; }
    }
  }
  if (G.waveMsg > 0) G.waveMsg -= dt;
  if (G.bloodMsg > 0) G.bloodMsg -= dt;
  if (G.bossMsg > 0) G.bossMsg -= dt;
  if (G.hintT > 0) G.hintT -= dt;
  G.shake = Math.max(0, G.shake - dt * 45);
  stepParticles(dt); stepFloaters(dt);
}
  
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0d0f12';
  ctx.fillRect(0, 0, W, H);
  if (!G) return;
  if (G.state === 'menu'){ drawMenu(); return; }
  if (G.state === 'shop'){ drawShopScreen(); return; }
  if (G.state === 'paused'){ drawPauseScreen(); return; }
  if (G.state === 'login' || G.state === 'multiplayer') return;

  var bg = BACKGROUNDS[SAVE.currentBackground] || BACKGROUNDS.cemetery;
  var sx = (Math.random() - 0.5) * G.shake;
  var sy = (Math.random() - 0.5) * G.shake;
  ctx.save();
  ctx.translate(-G.cam.x + sx, -G.cam.y + sy);
  ctx.fillStyle = bg.ground;
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);
  for (var si = 0; si < SCENERY.length; si++){
    var sc = SCENERY[si];
    if (sc.type !== 'patch') continue;
    if (sc.x < G.cam.x - 100 || sc.x > G.cam.x + W + 100 || sc.y < G.cam.y - 100 || sc.y > G.cam.y + H + 100) continue;
    ctx.fillStyle = sc.color + sc.alpha + ')';
    ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r, 0, 7); ctx.fill();
  }
  var step = 100;
  var vx0 = G.cam.x - 80, vx1 = G.cam.x + W + 80;
  var vy0 = G.cam.y - 80, vy1 = G.cam.y + H + 80;
  ctx.strokeStyle = bg.gridColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = Math.floor(vx0/step)*step; x < vx1; x += step){ ctx.moveTo(x, vy0); ctx.lineTo(x, vy1); }
  for (var y = Math.floor(vy0/step)*step; y < vy1; y += step){ ctx.moveTo(vx0, y); ctx.lineTo(vx1, y); }
  ctx.stroke();
  for (var si2 = 0; si2 < SCENERY.length; si2++){
    var s2 = SCENERY[si2];
    if (s2.type === 'patch') continue;
    if (s2.x < G.cam.x - 120 || s2.x > G.cam.x + W + 120 || s2.y < G.cam.y - 120 || s2.y > G.cam.y + H + 120) continue;
    drawSceneryItem(s2);
  }
  for (var i = 0; i < G.decals.length; i++){
    var d = G.decals[i];
    ctx.fillStyle = 'rgba(90,10,10,' + d.a + ')';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
  }
  for (i = 0; i < G.particles.length; i++){
    var q = G.particles[i];
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < G.pickups.length; i++){
    var pk = G.pickups[i];
    var fade = pk.life < 4 ? (0.45 + 0.55 * Math.abs(Math.sin(pk.life * 8))) : 1;
    ctx.globalAlpha = Math.min(pk.born, fade);
    var grd = ctx.createRadialGradient(pk.x, pk.y, 0, pk.x, pk.y, 34);
    grd.addColorStop(0, 'rgba(229,57,53,0.35)');
    grd.addColorStop(1, 'rgba(229,57,53,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(pk.x, pk.y, 34, 0, 7); ctx.fill();
    drawHeart(pk.x, pk.y, 11, pk.phase);
    ctx.globalAlpha = 1;
  }
  for (i = 0; i < G.powerDrops.length; i++) drawPowerDrop(G.powerDrops[i]);
  for (i = 0; i < G.zombies.length; i++) drawZombie(G.zombies[i]);
  drawOtherPlayers();
  drawPlayer();
  ctx.lineCap = 'round';
  for (i = 0; i < G.bullets.length; i++){
    var b = G.bullets[i];
    ctx.strokeStyle = b.color || '#ffe082';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
    ctx.stroke();
  }
  for (i = 0; i < G.ebullets.length; i++){
    var eb = G.ebullets[i];
    ctx.strokeStyle = 'rgba(179,136,255,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(eb.x, eb.y);

function drawPowerIcon(key, x, y, s, color, outline){
  color = color || '#ffffff'; outline = outline || 'rgba(0,0,0,0.55)';
  ctx.save(); ctx.translate(x, y);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  var lw = Math.max(1, s * 0.13);
  if (key === 'shield'){
    ctx.beginPath();
    ctx.moveTo(0, -s*0.95); ctx.lineTo(s*0.78, -s*0.68);
    ctx.lineTo(s*0.78, s*0.05);
    ctx.quadraticCurveTo(s*0.78, s*0.72, 0, s*0.98);
    ctx.quadraticCurveTo(-s*0.78, s*0.72, -s*0.78, s*0.05);
    ctx.lineTo(-s*0.78, -s*0.68); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = outline; ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = Math.max(1.5, s*0.22);
    ctx.beginPath();
    ctx.moveTo(0, -s*0.52); ctx.lineTo(0, s*0.55);
    ctx.moveTo(-s*0.34, -s*0.02); ctx.lineTo(s*0.34, -s*0.02);
    ctx.stroke();
  } else if (key === 'dash'){
    ctx.beginPath();
    ctx.moveTo(s*0.22, -s); ctx.lineTo(-s*0.55, s*0.1);
    ctx.lineTo(-s*0.08, s*0.1); ctx.lineTo(-s*0.22, s);
    ctx.lineTo(s*0.55, -s*0.1); ctx.lineTo(s*0.08, -s*0.1);
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = outline; ctx.stroke();
  } else if (key === 'damage'){
    function sword(rot){
      ctx.save(); ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(-s*0.12, -s*0.55); ctx.lineTo(-s*0.12, s*0.42);
      ctx.lineTo(s*0.12, s*0.42); ctx.lineTo(s*0.12, -s*0.55);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      ctx.lineWidth = lw*0.85; ctx.strokeStyle = outline; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*0.12, -s*0.55); ctx.lineTo(0, -s*0.98); ctx.lineTo(s*0.12, -s*0.55);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-s*0.42, s*0.42, s*0.84, s*0.14); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-s*0.09, s*0.56, s*0.18, s*0.32); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    sword(-Math.PI*0.28); sword(Math.PI*0.72);
  } else if (key === 'speed'){
    ctx.fillStyle = color; ctx.strokeStyle = outline; ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(0, -s*0.98); ctx.lineTo(-s*0.68, -s*0.26);
    ctx.lineTo(-s*0.28, -s*0.26); ctx.lineTo(-s*0.28, s*0.02);
    ctx.lineTo(s*0.28, s*0.02); ctx.lineTo(s*0.28, -s*0.26);
    ctx.lineTo(s*0.68, -s*0.26); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, s*0.06); ctx.lineTo(-s*0.68, s*0.72);
    ctx.lineTo(-s*0.28, s*0.72); ctx.lineTo(-s*0.28, s*1.0);
    ctx.lineTo(s*0.28, s*1.0); ctx.lineTo(s*0.28, s*0.72);
    ctx.lineTo(s*0.68, s*0.72); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (key === 'fireRate'){
    var teeth = 8, rIn = s*0.62, rOut = s*0.95, toothW = s*0.28;
    ctx.fillStyle = color; ctx.strokeStyle = outline; ctx.lineWidth = lw*0.8;
    for (var i = 0; i < teeth; i++){
      var a = (i / teeth) * Math.PI * 2;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.rect(-toothW/2, -rOut, toothW, rOut - rIn + s*0.05);
      ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, rIn, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s*0.26, 0, 7);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
  }
  ctx.restore();
}
function drawPowerSlots(){
  if (!G) return;
  var p = G.player;
  for (var i = 0; i < 5; i++){
    var slot = powerSlots[i];
    var key = POWERUP_ORDER[i];
    var pu = POWERUPS[key];
    var count = p.powerups[key];
    var activeT = p.active[key] || 0;
    var hasActive = activeT > 0;
    var flash = (G.slotFlashKey === key && G.slotFlashT > 0) ? (G.slotFlashT / 0.4) : 0;
    ctx.beginPath(); ctx.arc(slot.x, slot.y, slot.r, 0, 7);
    if (hasActive) ctx.fillStyle = pu.color2 + 'cc';
    else if (count > 0) ctx.fillStyle = pu.color2 + '99';
    else ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = hasActive ? pu.color : (count > 0 ? pu.color : 'rgba(255,255,255,0.15)');
    ctx.lineWidth = hasActive ? 3 : 1.5;

function drawMejorasTab(px, py, pw, small){
  var rowH = small ? 30 : 36;
  for (var i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i];
    var ry = py + i * rowH;
    var rect = { x: px, y: ry + 2, w: pw, h: rowH - 4, key: u.key };
    uiRects.push(rect);
    var lvl = SAVE.up[u.key];
    var maxed = lvl >= u.max;
    var cost = upgradeCost(u);
    var canBuy = !maxed && SAVE.coins >= cost;
    if (canBuy){
      ctx.fillStyle = 'rgba(76,175,80,0.15)';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,80,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
    }
    if (G.buyFlash > 0 && G.buyKey === u.key){
      ctx.fillStyle = 'rgba(76,175,80,' + Math.min(1, G.buyFlash * 2.4) + ')';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? '#81c784' : (canBuy ? '#ffffff' : '#cfd8dc');
    ctx.font = 'bold ' + (small ? 12 : 14) + 'px system-ui';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.name, rect.x + 12, rect.y + rect.h/2);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.font = 'bold ' + (small ? 9 : 11) + 'px system-ui';
    ctx.fillText('Nv.' + lvl + '/' + u.max, rect.x + rect.w * 0.60, rect.y + rect.h/2);
    ctx.textAlign = 'right';
    if (maxed){
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold ' + (small ? 11 : 13) + 'px system-ui';
      ctx.fillText('MAX', rect.x + rect.w - 12, rect.y + rect.h/2);
    } else {
      var txt = String(cost);
      ctx.font = 'bold ' + (small ? 12 : 14) + 'px system-ui';
      var tw = ctx.measureText(txt).width;
      var r = small ? 5 : 7;
      var startX = rect.x + rect.w - 12 - tw - r*2 - 5;
      drawCoin(startX + r, rect.y + rect.h/2, r);
      ctx.textAlign = 'left';
      ctx.fillStyle = canBuy ? '#ffd54f' : '#5a5f66';
      ctx.fillText(txt, startX + r*2 + 5, rect.y + rect.h/2);
    }
    ctx.textBaseline = 'alphabetic';
  }
  var rbY = py + UPGRADES.length * rowH + (small ? 10 : 14);
  var rbH = small ? 50 : 58;
  var ready = canRebirth();
  var maxed2 = allMaxed();
  var enoughCoins = SAVE.coins >= REBIRTH_COST;
  if (ready){
    ctx.fillStyle = 'rgba(192,132,252,0.22)';
    rr(px, rbY, pw, rbH, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(192,132,252,0.85)'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    rr(px, rbY, pw, rbH, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();
  }
  if (G.rebirthFlash > 0){
    ctx.fillStyle = 'rgba(192,132,252,' + Math.min(1, G.rebirthFlash) + ')';
    rr(px, rbY, pw, rbH, 10); ctx.fill();
  }
  var iconX = px + (small ? 22 : 26);
  var iconY = rbY + rbH / 2;
  var iconR = small ? 13 : 16;
  drawRebirthIcon(iconX, iconY, iconR, ready ? '#e9d5ff' : 'rgba(200,200,200,0.4)');
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = ready ? '#e9d5ff' : '#9aa0a6';
  ctx.font = '900 ' + (small ? 13 : 15) + 'px system-ui';
  ctx.fillText('REBIRTH', px + (small ? 42 : 52), rbY + rbH * 0.35);
  ctx.font = '700 ' + (small ? 9 : 10) + 'px system-ui';
  if (ready){
    ctx.fillStyle = 'rgba(233,213,255,0.85)';
    ctx.fillText('Pulsa para reiniciar y duplicar drops', px + (small ? 42 : 52), rbY + rbH * 0.72);
  } else if (!maxed2){
    var missing = 0;
    for (var mi = 0; mi < UPGRADES.length; mi++) missing += UPGRADES[mi].max - SAVE.up[UPGRADES[mi].key];
    ctx.fillStyle = 'rgba(160,160,160,0.8)';
    ctx.fillText('Requiere mejoras al máximo (' + missing + ')', px + (small ? 42 : 52), rbY + rbH * 0.72);
  } else if (!enoughCoins){
    ctx.fillStyle = 'rgba(255,138,128,0.85)';
    ctx.fillText('Faltan ' + fmt(REBIRTH_COST - SAVE.coins) + ' monedas', px + (small ? 42 : 52), rbY + rbH * 0.72);
  }

  ctx.font = '900 ' + (small ? 13 : 15) + 'px system-ui';
  var costW = ctx.measureText(costTxt).width;
  var costStartX = px + pw - (small ? 12 : 16) - costW - r2*2 - 6;
  drawCoin(costStartX + r2, rbY + rbH/2, r2);
  ctx.textAlign = 'left';
  ctx.fillStyle = ready ? '#ffd54f' : '#5a5f66';
  ctx.fillText(costTxt, costStartX + r2*2 + 6, rbY + rbH/2);
  ctx.textBaseline = 'alphabetic';
  if (ready) uiRects.push({ x: px, y: rbY, w: pw, h: rbH, key: 'rebirth' });
}
function drawArmasTab(px, py, pw, small){
  var rowH = small ? 44 : 52;
  for (var i = 0; i < WEAPON_ORDER.length; i++){
    var k = WEAPON_ORDER[i];
    var w = WEAPONS[k];
    var req = w.rebirths || 0;
    var hasR = SAVE.rebirths >= req;
    var owned = !!SAVE.ownedWeapons[k];
    var equipped = SAVE.currentWeapon === k;
    var canBuy = !owned && hasR && SAVE.coins >= w.cost;
    var locked = !owned && !hasR;
    var ry = py + i * rowH;
    var rect = { x: px, y: ry + 3, w: pw, h: rowH - 6 };
    if (equipped){
      ctx.fillStyle = 'rgba(229,57,53,0.18)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(229,57,53,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    } else if (owned){
      ctx.fillStyle = 'rgba(76,175,80,0.10)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,80,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    } else if (locked){
      ctx.fillStyle = 'rgba(120,60,60,0.10)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(200,120,120,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    } else if (canBuy){
      ctx.fillStyle = 'rgba(255,213,79,0.10)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,213,79,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
    }
    if (G.buyFlash > 0 && G.buyKey === 'weapon:' + k){
      ctx.fillStyle = 'rgba(255,213,79,' + Math.min(1, G.buyFlash * 2.4) + ')';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
    }
    ctx.save(); ctx.translate(rect.x + (small ? 18 : 22), rect.y + rect.h/2);
    ctx.globalAlpha = locked ? 0.4 : 1;
    var wskW = WEAPON_SKINS[SAVE.currentWeaponSkin] || WEAPON_SKINS.default;
    ctx.fillStyle = (k === SAVE.currentWeapon && wskW.color) ? wskW.color : '#22262e';
    if (k === 'shotgun'){ ctx.fillRect(-10, -3, 22, 6); ctx.fillRect(-4, -3, 4, 8); }
    else if (k === 'rifle'){ ctx.fillRect(-12, -2.5, 26, 5); ctx.fillRect(2, -6, 8, 4); }
    else if (k === 'smg'){ ctx.fillRect(-8, -2.5, 18, 5); ctx.fillRect(-2, 2, 4, 6); }
    else { ctx.fillRect(-7, -2.5, 16, 5); ctx.fillRect(-3, 2, 4, 5); }
    ctx.fillStyle = w.color; ctx.fillRect(-4, -1, 3, 2);
    ctx.globalAlpha = 1; ctx.restore();
    var nameX = rect.x + (small ? 38 : 46);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = equipped ? '#fff' : (owned ? '#c5e1a5' : (locked ? '#8a7a7a' : (canBuy ? '#fff' : '#9aa0a6')));
    ctx.font = '900 ' + (small ? 12 : 14) + 'px system-ui';
    ctx.fillText(w.name, nameX, rect.y + rect.h * 0.32);
    var nameW = ctx.measureText(w.name).width;
    var priceX = nameX + nameW + (small ? 10 : 12);
    var pr = small ? 5 : 6;
    drawCoin(priceX + pr, rect.y + rect.h * 0.32, pr);
    ctx.textAlign = 'left';
    ctx.font = '900 ' + (small ? 10 : 12) + 'px system-ui';

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + btnW/2, btnY + btnH/2 + 1);
    uiRects.push({ x: bx, y: btnY, w: btnW, h: btnH, key: key });
  }
  drawBtn(btnStartX, 'REANUDAR', ['#43a047', '#2e7d32'], 'rgba(150,255,150,0.4)', 'resume');
  drawBtn(btnStartX + btnW + btnGap, 'MENÚ', ['#546e7a', '#37474f'], 'rgba(180,200,210,0.4)', 'pause-menu');
  ctx.textBaseline = 'alphabetic';
}

var last = 0;
function loop(now){
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  try { update(dt); render(); }
  catch (err) { showErr(err && err.message ? err.message : String(err)); }
  requestAnimationFrame(loop);
}

function boot(){
  try {
    resize();
    setTimeout(resize, 60);
    setTimeout(resize, 300);
    reset();
    setupLoginUI();
    setupMultiplayerUI();
    var ok = initFirebase();
    if (ok){
      fbAuth.onAuthStateChanged(function(user){
        if (user){
          currentUser = user;
          loginMsg('Cargando partida...', '#8b949e');
          cloudLoad().then(function(){
            hideLoginPanel();
            if (G) G.state = 'menu';
          });
        } else {
          currentUser = null;
          showLoginPanel();
        }
      });
    } else {
      G.state = 'menu';
    }
    requestAnimationFrame(loop);
  } catch (e) { showErr(e && e.message ? e.message : String(e)); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
