function drawMejorasTab(px, py, pw, small){
  var rowH = small ? 32 : 38;
  for (var i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i];
    var ry = py + i * rowH;
    var rect = { x: px, y: ry + 2, w: pw, h: rowH - 4, key: u.key };
    uiRects.push(rect);

    var lvl = SAVE.up[u.key];
    var maxed = lvl >= u.max;
    var cost = upgradeCost(u);
    var canBuy = !maxed && SAVE.coins >= cost;

    if (canBuy){
      ctx.fillStyle = 'rgba(76,175,80,0.15)';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,80,0.45)';
      ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
    }
    if (G.buyFlash > 0 && G.buyKey === u.key){
      ctx.fillStyle = 'rgba(76,175,80,' + Math.min(1, G.buyFlash * 2.4) + ')';
      rr(rect.x, rect.y, rect.w, rect.h, 9); ctx.fill();
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? '#81c784' : (canBuy ? '#ffffff' : '#cfd8dc');
    ctx.font = 'bold ' + (small ? 12 : 14) + 'px system-ui';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.name, rect.x + 12, rect.y + rect.h/2);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.font = 'bold ' + (small ? 9 : 11) + 'px system-ui';
    ctx.fillText('Nv.' + lvl + '/' + u.max, rect.x + rect.w * 0.60, rect.y + rect.h/2);

    ctx.textAlign = 'right';
    if (maxed){
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold ' + (small ? 11 : 13) + 'px system-ui';
      ctx.fillText('MAX', rect.x + rect.w - 12, rect.y + rect.h/2);
    } else {
      var txt = String(cost);
      ctx.font = 'bold ' + (small ? 12 : 14) + 'px system-ui';
      var tw = ctx.measureText(txt).width;
      var r = small ? 5 : 7;
      var startX = rect.x + rect.w - 12 - tw - r*2 - 5;
      drawCoin(startX + r, rect.y + rect.h/2, r);
      ctx.textAlign = 'left';
      ctx.fillStyle = canBuy ? '#ffd54f' : '#5a5f66';
      ctx.fillText(txt, startX + r*2 + 5, rect.y + rect.h/2);
    }
    ctx.textBaseline = 'alphabetic';
  }
}

function drawArmasTab(px, py, pw, small){
  var rowH = small ? 44 : 52;
  for (var i = 0; i < WEAPON_ORDER.length; i++){
    var k = WEAPON_ORDER[i];
    var w = WEAPONS[k];
    var ry = py + i * rowH;
    var rect = { x: px, y: ry + 3, w: pw, h: rowH - 6 };
    var owned = !!SAVE.ownedWeapons[k];
    var equipped = SAVE.currentWeapon === k;
    var canBuy = !owned && SAVE.coins >= w.cost;

    if (equipped){
      ctx.fillStyle = 'rgba(229,57,53,0.18)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(229,57,53,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    } else if (owned){
      ctx.fillStyle = 'rgba(76,175,80,0.10)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,80,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    } else if (canBuy){
      ctx.fillStyle = 'rgba(255,213,79,0.10)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,213,79,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
    }
    if (G.buyFlash > 0 && G.buyKey === 'weapon:' + k){
      ctx.fillStyle = 'rgba(255,213,79,' + Math.min(1, G.buyFlash * 2.4) + ')';
      rr(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
    }

    ctx.save();
    ctx.translate(rect.x + (small ? 18 : 22), rect.y + rect.h/2);
    ctx.fillStyle = '#22262e';
    if (k === 'shotgun'){ ctx.fillRect(-10, -3, 22, 6); ctx.fillRect(-4, -3, 4, 8); }
    else if (k === 'rifle'){ ctx.fillRect(-12, -2.5, 26, 5); ctx.fillRect(2, -6, 8, 4); }
    else if (k === 'smg'){ ctx.fillRect(-8, -2.5, 18, 5); ctx.fillRect(-2, 2, 4, 6); }
    else { ctx.fillRect(-7, -2.5, 16, 5); ctx.fillRect(-3, 2, 4, 5); }
    ctx.fillStyle = w.color; ctx.fillRect(-4, -1, 3, 2);
    ctx.restore();

    var nameX = rect.x + (small ? 38 : 46);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = equipped ? '#fff' : (owned ? '#c5e1a5' : (canBuy ? '#fff' : '#9aa0a6'));
    ctx.font = '900 ' + (small ? 12 : 14) + 'px system-ui';
    ctx.fillText(w.name, nameX, rect.y + rect.h * 0.36);

    ctx.fillStyle = '#8b949e';
    ctx.font = '700 ' + (small ? 9 : 10) + 'px system-ui';
    var statsTxt = 'Daño ' + w.dmg + '  ·  Cadencia ' + w.fireRate.toFixed(2) + 's  ·  Cargador ' + w.magSize;
    if (w.pellets > 1) statsTxt = 'x' + w.pellets + '  ·  ' + statsTxt;
    ctx.fillText(statsTxt, nameX, rect.y + rect.h * 0.68);

    ctx.textAlign = 'right';
    if (equipped){
      ctx.fillStyle = '#ff5252';
      ctx.font = '900 ' + (small ? 11 : 13) + 'px system-ui';
      ctx.fillText('EQUIPADA', rect.x + rect.w - 12, rect.y + rect.h/2);
    } else if (owned){
      var bx = rect.x + rect.w - (small ? 76 : 88);
      var by = rect.y + rect.h/2 - (small ? 12 : 14);
      var bw2 = small ? 72 : 84;
      var bh2 = small ? 24 : 28;
      ctx.fillStyle = 'rgba(76,175,80,0.85)';
      rr(bx, by, bw2, bh2, 7); ctx.fill();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '900 ' + (small ? 11 : 12) + 'px system-ui';
      ctx.fillText('EQUIPAR', bx + bw2/2, by + bh2/2 + 1);
      uiRects.push({ x: bx, y: by, w: bw2, h: bh2, key: 'equip:' + k });
    } else {
      var txt = String(w.cost);
      ctx.font = '900 ' + (small ? 13 : 15) + 'px system-ui';
      var tw = ctx.measureText(txt).width;
      var r = small ? 6 : 7;
      var startX = rect.x + rect.w - 12 - tw - r*2 - 6;
      drawCoin(startX + r, rect.y + rect.h/2, r);
      ctx.textAlign = 'left';
      ctx.fillStyle = canBuy ? '#ffd54f' : '#5a5f66';
      ctx.fillText(txt, startX + r*2 + 6, rect.y + rect.h/2);

      var bx2 = rect.x + rect.w - (small ? 76 : 88);
      var by2 = rect.y + rect.h/2 - (small ? 12 : 14);
      var bw3 = small ? 72 : 84;
      var bh3 = small ? 24 : 28;
      if (canBuy){
        ctx.fillStyle = 'rgba(255,213,79,0.9)';
        rr(bx2, by2, bw3, bh3, 7); ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#000';
        ctx.font = '900 ' + (small ? 11 : 12) + 'px system-ui';
        ctx.fillText('COMPRAR', bx2 + bw3/2, by2 + bh3/2 + 1);
        uiRects.push({ x: bx2, y: by2, w: bw3, h: bh3, key: 'buyweapon:' + k });
      } else {
        ctx.fillStyle = 'rgba(120,120,120,0.35)';
        rr(bx2, by2, bw3, bh3, 7); ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8a8a8a';
        ctx.font = '900 ' + (small ? 11 : 12) + 'px system-ui';
        ctx.fillText('COMPRAR', bx2 + bw3/2, by2 + bh3/2 + 1);
      }
    }
    ctx.textBaseline = 'alphabetic';
  }
}

function drawAspectosTab(px, py, pw, small){
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8b949e';
  ctx.font = '900 ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillText('COLOR', px + 8, py + (small ? 12 : 16));

  var colors = SKIN_COLORS.slice();
  if (SAVE.goldenUnlocked) colors.push('GOLD');

  var swatchSize = small ? 26 : 32;
  var swGap = small ? 5 : 7;
  var perRow = Math.min(colors.length, small ? 6 : 11);
  var totalRows = Math.ceil(colors.length / perRow);

  for (var i = 0; i < colors.length; i++){
    var col = colors[i];
    var row = Math.floor(i / perRow);
    var colIdx = i % perRow;
    var itemsInRow = Math.min(perRow, colors.length - row * perRow);
    var rowW = itemsInRow * swatchSize + (itemsInRow - 1) * swGap;
    var rowStartX = px + (pw - rowW) / 2;
    var sxc = rowStartX + colIdx * (swatchSize + swGap) + swatchSize / 2;
    var syc = py + (small ? 22 : 28) + row * (swatchSize + swGap) + swatchSize / 2;
    var selected = (col.toLowerCase() === String(SAVE.skin.body).toLowerCase());

    if (col === 'GOLD'){
      var gg = ctx.createLinearGradient(sxc - swatchSize/2, syc - swatchSize/2, sxc + swatchSize/2, syc + swatchSize/2);
      gg.addColorStop(0, '#fff7c2');
      gg.addColorStop(0.5, '#ffd700');
      gg.addColorStop(1, '#8b6914');
      ctx.fillStyle = gg;
    } else ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(sxc, syc, swatchSize / 2, 0, 7); ctx.fill();
    ctx.lineWidth = selected ? 3 : 1.5;
    ctx.strokeStyle = selected ? '#ffffff' : (col === 'GOLD' ? '#8b6914' : 'rgba(0,0,0,0.5)');
    ctx.stroke();

    if (col === 'GOLD'){
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold ' + (swatchSize * 0.5) + 'px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u2605', sxc, syc + 1);
      ctx.textBaseline = 'alphabetic';
    }
    if (selected){
      ctx.beginPath(); ctx.arc(sxc, syc, 3.2, 0, 7);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
    uiRects.push({ x: sxc - swatchSize/2, y: syc - swatchSize/2,
                   w: swatchSize, h: swatchSize, key: 'color:' + col });
  }

  var hatsY = py + (small ? 22 : 28) + totalRows * (swatchSize + swGap) + (small ? 12 : 18);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8b949e';
  ctx.font = '900 ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillText('SOMBRERO', px + 8, hatsY);

  var hatBtnSize = small ? 40 : 48;
  var hatGap = small ? 6 : 10;
  var totalHat = HAT_COUNT * hatBtnSize + (HAT_COUNT - 1) * hatGap;
  var hatStartX = px + (pw - totalHat) / 2;
  var hatY = hatsY + (small ? 8 : 10);

  for (var h = 0; h < HAT_COUNT; h++){
    var hx = hatStartX + h * (hatBtnSize + hatGap);
    var hc = hx + hatBtnSize / 2;
    var hv = hatY + hatBtnSize / 2;
    var sel = (h === SAVE.skin.hat);
    ctx.fillStyle = sel ? 'rgba(126,87,194,0.28)' : 'rgba(255,255,255,0.04)';
    rr(hx, hatY, hatBtnSize, hatBtnSize, 8); ctx.fill();
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeStyle = sel ? '#b39ddb' : 'rgba(255,255,255,0.1)';
    ctx.stroke();
    drawHatButtonContent(hc, hv, hatBtnSize * 0.27, h, SAVE.skin.body);
    uiRects.push({ x: hx, y: hatY, w: hatBtnSize, h: hatBtnSize, key: 'hat:' + h });
  }
}

function drawCodigoTab(px, py, pw, small){
  ctx.textAlign = 'center';
  var cy = py + (small ? 30 : 40);

  if (SAVE.codeUsed){
    ctx.fillStyle = '#81c784';
    ctx.font = '900 ' + (small ? 15 : 18) + 'px system-ui';
    ctx.fillText('CÓDIGO YA CANJEADO', px + pw/2, cy);
    ctx.fillStyle = '#8b949e';
    ctx.font = '700 ' + (small ? 11 : 13) + 'px system-ui';
    ctx.fillText('Gracias por apoyar el juego', px + pw/2, cy + (small ? 24 : 30));
  } else {
    ctx.fillStyle = '#b39ddb';
    ctx.font = '900 ' + (small ? 15 : 18) + 'px system-ui';
    ctx.fillText('¿TIENES UN CÓDIGO?', px + pw/2, cy);
    ctx.fillStyle = '#8b949e';
    ctx.font = '700 ' + (small ? 11 : 13) + 'px system-ui';
    ctx.fillText('Introduce el código de creador', px + pw/2, cy + (small ? 24 : 30));

    var btnW2 = Math.min(pw - 40, small ? 220 : 280);
    var btnH2 = small ? 40 : 48;
    var bx = px + (pw - btnW2) / 2;
    var by = cy + (small ? 50 : 60);
    var pg2 = ctx.createLinearGradient(0, by, 0, by + btnH2);
    pg2.addColorStop(0, '#7e57c2');
    pg2.addColorStop(1, '#4a2a8a');
    ctx.fillStyle = pg2;
    rr(bx, by, btnW2, btnH2, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(200,160,255,0.5)';
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + (small ? 14 : 16) + 'px system-ui';
    ctx.textBaseline = 'middle';
    ctx.fillText('INTRODUCIR CÓDIGO', bx + btnW2/2, by + btnH2/2 + 1);
    ctx.textBaseline = 'alphabetic';
    uiRects.push({ x: bx, y: by, w: btnW2, h: btnH2, key: 'open-code' });

    ctx.fillStyle = 'rgba(160,160,160,0.6)';
    ctx.font = '700 ' + (small ? 10 : 11) + 'px system-ui';
    ctx.fillText('Recompensa: 1000 monedas + skin dorada', px + pw/2, by + btnH2 + (small ? 18 : 22));
  }
}

function drawHUD(){
  if (!G) return;
  var p = G.player;
  var small = Math.min(W, H) < 420;
  var pad = small ? 14 : 22;

  var bw = Math.min(small ? 150 : 260, W * 0.42);
  var bh = small ? 16 : 20;
  var bx = pad, by = pad;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(bx - 5, by - 5, bw + 10, bh + 10, 9); ctx.fill();
  ctx.fillStyle = '#241717';
  rr(bx, by, bw, bh, 6); ctx.fill();
  var frac = Math.max(0, p.hp / p.maxHp);
  ctx.fillStyle = frac > 0.5 ? '#43a047' : (frac > 0.25 ? '#f9a825' : '#e53935');
  rr(bx, by, bw * frac, bh, 6); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (small ? 11 : 13) + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, bx + bw/2, by + bh - (small ? 4 : 5));

  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '900 ' + (small ? 10 : 12) + 'px system-ui';
  ctx.fillText(p.weapon.name, bx, by + bh + (small ? 14 : 18));

  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (small ? 22 : 30) + 'px system-ui';
  ctx.fillText(fmt(G.score), W - pad, pad + (small ? 20 : 26));
  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold ' + (small ? 11 : 14) + 'px system-ui';
  ctx.fillText('OLEADA ' + G.wave, W - pad, pad + (small ? 38 : 48));

  ctx.font = 'bold ' + (small ? 13 : 16) + 'px system-ui';
  var coinTxt = String(SAVE.coins);
  var ctw = ctx.measureText(coinTxt).width;
  var cr = small ? 7 : 8;
  var cxp = W - pad - ctw - cr*2 - 6;
  var cyp = pad + (small ? 52 : 68);
  drawCoin(cxp + cr, cyp - (small ? 4 : 5), cr);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(coinTxt, cxp + cr*2 + 6, cyp);

  ctx.textAlign = 'center';
  var ax = W/2, ay = pad + (small ? 16 : 22);
  if (p.reloading){
    ctx.fillStyle = '#ffb300';
    ctx.font = 'bold ' + (small ? 13 : 17) + 'px system-ui';
    ctx.fillText('RECARGANDO', ax, ay);
    var rw = small ? 100 : 150;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(ax - rw/2, ay + 8, rw, 7, 4); ctx.fill();
    ctx.fillStyle = '#ffb300';
    rr(ax - rw/2, ay + 8, rw * (1 - p.reloadT / p.reloadTime), 7, 4); ctx.fill();
  } else {
    ctx.fillStyle = p.mag <= 4 ? '#e53935' : '#fff';
    ctx.font = 'bold ' + (small ? 26 : 34) + 'px system-ui';
    ctx.fillText(String(p.mag), ax - 14, ay + 6);
    ctx.fillStyle = '#6e7681';
    ctx.font = 'bold ' + (small ? 15 : 20) + 'px system-ui';
    ctx.fillText('/ \u221E', ax + 20, ay + 6);
  }

  if (G.bloodRound){
    var bxx = W/2, byy = pad + (small ? 38 : 50);
    ctx.fillStyle = 'rgba(180,0,0,0.85)';
    var tw = small ? 130 : 170;
    rr(bxx - tw/2, byy - (small ? 10 : 12), tw, small ? 18 : 22, 6); ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + (small ? 11 : 13) + 'px system-ui';
    ctx.fillText('\u2620 RONDA DE SANGRE', bxx, byy + (small ? 4 : 5));
  }

  if (G.hintT > 0 && G.wave <= 1){
    ctx.globalAlpha = Math.min(1, G.hintT / 1.5) * 0.8;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfd8dc';
    ctx.font = 'bold ' + (small ? 11 : 13) + 'px system-ui';
    ctx.fillText('Móvil: joysticks táctiles  \u00B7  PC: WASD + ratón  \u00B7  R recargar  \u00B7  Espacio dash  \u00B7  1-5 power-ups',
                 W/2, H * 0.60);
    ctx.globalAlpha = 1;
  }

  if (G.waveMsg > 0 && !G.bloodRound){
    ctx.globalAlpha = Math.min(1, G.waveMsg * 1.6);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e53935';
    ctx.font = '900 ' + (small ? 40 : 58) + 'px system-ui';
    ctx.fillText('OLEADA ' + G.wave, W/2, H * 0.30);
    ctx.globalAlpha = 1;
  }

  if (G.bloodMsg > 0){
    var bt = G.bloodMsg;
    var pulse2 = 0.7 + Math.sin((3.5 - bt) * 12) * 0.3;
    ctx.globalAlpha = Math.min(1, bt * 1.4);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, H * 0.34, W, small ? 70 : 100);
    ctx.fillStyle = 'rgba(229,57,53,' + pulse2 + ')';
    ctx.font = '900 ' + (small ? 36 : 54) + 'px system-ui';
    ctx.fillText('\u2620 RONDA DE SANGRE \u2620', W/2, H * 0.44);
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + (small ? 12 : 15) + 'px system-ui';
    ctx.fillText('Los enemigos tienen x2 vida, x2 daño y son más rápidos', W/2, H * 0.52);
    ctx.globalAlpha = 1;
  }
}

var last = 0;
function loop(now){
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  try { update(dt); render(); }
  catch (err) { showErr(err && err.message ? err.message : String(err)); }
  requestAnimationFrame(loop);
}

function boot(){
  try {
    resize();
    setTimeout(resize, 60);
    setTimeout(resize, 300);
    reset();
    G.state = 'menu';
    requestAnimationFrame(loop);
  } catch (e) { showErr(e && e.message ? e.message : String(e)); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
